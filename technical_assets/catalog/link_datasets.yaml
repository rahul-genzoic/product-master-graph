# Lazy dataset links for the fast-moving data that used to be materialised on
# apply (see integrations/live_bq.yaml). Each link binds an entity TYPE to a
# BigQuery source table via a join key; NO rows are copied at apply time — the
# data is fetched on demand, scoped to one entity instance, when a widget below
# renders on that entity's page. `connection: live_bq` resolves to the live_bq
# integration's connection block.
#
# Join keys: Product.id == SKU (pim_bq maps Product id: SKU); Store.id ==
# MASTER_STORE_ID (live_bq maps Store id: MASTER_STORE_ID). So the entity id is
# the join value in every link below.

datasets:
  # --- attached to Store -------------------------------------------------
  - entity_type: Store
    name: Reviews
    description: Customer review events for this store (lazy).
    source_table: CUSTOMER_REVIEW_EVENTS
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: MASTER_STORE_ID }
    columns: [REVIEW_ID, REVIEW_TEXT, STAR_RATING, REVIEW_DATE, SOURCE_SYSTEM, CUSTOMER_NAME, MASTER_STORE_ID]

  - entity_type: Store
    name: Complaints
    description: Complaint events for this store (lazy). Base table (not the
      V_COMPLAINT_EVENTS view) — the complaint carries ORDER_ID, matched to the
      sale's ONLINE_ORDER_ID in the complaint-triage process.
    source_table: CUSTOMER_COMPLAINT_EVENTS
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: MASTER_STORE_ID }
    columns: [EVENT_ID, ISSUE_TYPE, ITEM_NAME, CUSTOMER_COMMENTS, SOURCE_SYSTEM, ORDER_ID, COMPLAINT_RECEIVED_AT, MASTER_STORE_ID]

  - entity_type: Store
    name: Inventory batches
    description: Latest inventory snapshot at this store (lazy).
    source_table: STORE_INVENTORY_DAILY
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: store_id }
    columns: [inventory_record_id, snapshot_date, batch_row_number, available_quantity, expiry_date, batch_hash, product_sku, store_id]

  - entity_type: Store
    name: Current campaigns
    description: Zomato/Swiggy ad campaigns running this month at this store (lazy). V_STORE_CAMPAIGN_CURRENT resolves RES_ID->store and re-scopes to "running now / this month" on each render.
    source_table: V_STORE_CAMPAIGN_CURRENT
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: MASTER_STORE_ID }
    columns: [MASTER_STORE_ID, CAMPAIGN_ID, RES_ID, PLATFORM, PRODUCT_TYPE, TARGETING, SEGMENTS, DATE, AD_SPEND_RS, AD_SALES_RS, AD_ORDERS, AD_IMPRESSIONS, AD_CLICKS, ROI, ADS_M2O_PCT, OVERALL_M2O_PCT, ROAS, CTR]

  - entity_type: Store
    name: Sales
    description: Order-line sales for this store from the silver BASE table (no view) — queried via raw SQL fully-qualifying silver.BUSINESS_ANALYTICS. Anchor for the per-SKU sales widget.
    source_table: silver.BUSINESS_ANALYTICS   # dataset-qualified so the gather's dataset-read path hits silver, not the connection's default bronze
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: STORE_ID }
    columns: [STORE_ID, SKU_ID, ITEM_SOURCE_NAME, QUANTITY, TOTAL, NET, ORDER_DATE, ORDER_STATE, ONLINE_ORDER_ID]

  # --- attached to Product ----------------------------------------------
  # Static product truth (1:1 on SKU) from the PIM dataset, not bronze — hence
  # `connection: pim_bq`, whose default dataset is ctx_upside_master_data.
  # IMAGES_LINK is the Drive folder holding the SKU's label artwork; the
  # label_compliance_review process reads it from here and lists that folder
  # directly, instead of searching Drive by product name.
  - entity_type: Product
    name: Product label facts
    description: On-pack declarations + label artwork Drive folder link (IMAGES_LINK) for this SKU (lazy, 1:1).
    source_table: DIM_PRODUCT
    connection: pim_bq
    cardinality: "1:1"
    join_keys:
      - { entity_attribute: id, table_column: SKU }
    columns: [SKU, DISPLAY_NAME, VEG_NONVEG, SIZE_LABEL, SIZE_GM, VERSION, STATUS, DESCRIPTION, IMAGES_LINK]

  - entity_type: Product
    name: Inventory batches
    description: Latest inventory snapshot for this product across stores (lazy).
    source_table: STORE_INVENTORY_DAILY
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: product_sku }
    columns: [inventory_record_id, snapshot_date, batch_row_number, available_quantity, expiry_date, batch_hash, product_sku, store_id]

  - entity_type: Product
    name: Stock by store
    description: Current stock / wastage flags per store for this product (lazy).
    source_table: V_STOCKED_AT
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: SKU_ID }
    columns: [SKU_ID, MASTER_STORE_ID, TOTAL_STOCK, SAFE_STOCK, EXPIRED_STOCK, SOONEST_EXPIRY, QTY_EXPIRING_WITHIN_RISK_DAYS, WASTAGE_FLAG, LOW_STOCK_FLAG, SHELF_LIFE_DAYS]

  - entity_type: Product
    name: Forecast
    description: Latest-run demand forecast (next 1-3 days) per store for this product, from the gold BASE table. source_table is dataset-qualified (gold.) so the dataset-read path (widgets + the demand_forecast gather) resolves it in gold, not the connection's default bronze dataset.
    source_table: gold.FORECAST_RESULTS_UPDATE
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: SKU_ID }
    columns: [SKU_ID, MASTER_STORE_ID, FORECAST_DATE, PREDICTED_SALES_QUANTITY, DAYS_AHEAD, IS_LATEST_FORECAST]

  # Same gold forecast table, joined by STORE — lets the demand_forecast
  # gather START from the Store node (per-store forecast read), symmetric with inventory.
  - entity_type: Store
    name: Forecast by store
    description: Latest-run demand forecast per SKU for this store, from gold. Store-anchored (join on MASTER_STORE_ID) so a gather can traverse Store -> forecast.
    source_table: gold.FORECAST_RESULTS_UPDATE
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: MASTER_STORE_ID }
    columns: [SKU_ID, MASTER_STORE_ID, FORECAST_DATE, PREDICTED_SALES_QUANTITY, DAYS_AHEAD, IS_LATEST_FORECAST]

  - entity_type: Product
    name: Sales
    description: Order-line sales for this product from the silver BASE table (no view) — queried via raw SQL fully-qualifying silver.BUSINESS_ANALYTICS. Anchor for the qty-sold / revenue widgets.
    source_table: silver.BUSINESS_ANALYTICS   # dataset-qualified (silver) for the dataset-read path
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: SKU_ID }
    columns: [SKU_ID, STORE_ID, QUANTITY, TOTAL, NET, ORDER_DATE, ORDER_STATE]

  # Master cost/price facts (static PIM truth) exposed as a 1:1 self-link so a
  # gather can read cost/MRP/shelf-life by SKU (they're Product NODE properties,
  # not otherwise reachable via search_dataset). connection: pim_bq resolves to
  # the pim_bq integration (dataset ctx_upside_master_data), NOT live_bq/bronze.
  # Used by the shelf_life_rescue_desk process to compute ₹ value-at-risk.
  - entity_type: Product
    name: Product cost & price
    description: Static master cost/price/shelf-life for this product from V_PRODUCT_ENRICHED (lazy, 1:1 on SKU).
    source_table: V_PRODUCT_ENRICHED
    connection: pim_bq
    cardinality: "1:1"
    join_keys:
      - { entity_attribute: id, table_column: SKU }
    columns: [SKU, DISPLAY_NAME, MRP_INR, TOTAL_COGS_INR, SHELF_LIFE_DAYS]

  # --- attached to CustomerSegment --------------------------------------
  - entity_type: CustomerSegment
    name: Budget allocations
    description: Per-store marketing budget allocated to this segment, by channel/month (lazy).
    source_table: V_SEGMENT_BUDGET
    connection: live_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: SEGMENT_ID }
    columns: [SEGMENT_ID, MASTER_STORE_ID, STORE_NAME, CHANNEL, BUDGET_MONTH, ALLOCATED_BUDGET_RS, EXPECTED_REVENUE_RS]

  - entity_type: Product
    name: All Ideas
    description: Ideas table for innovation triage
    source_table: DIM_IDEA
    connection: pim_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: IDEA_ID }
    columns: [IDEA_ID, NAME, STAGE, HYPOTHESIS, THESIS_FIT, TARGET_COGS_INR]

  - entity_type: Product
    name: Portfolio products
    description: Enriched product catalog
    source_table: V_PRODUCT_ENRICHED
    connection: pim_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: SKU }
    columns: [SKU, DISPLAY_NAME, DESCRIPTION, STATUS, IS_ACTIVE, CATEGORY]

  - entity_type: Competitor
    name: Active competitors
    description: Competitors table
    source_table: DIM_COMPETITOR
    connection: pim_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: COMPETITOR_ID }
    columns: [COMPETITOR_ID, COMPETITOR_NAME, CATEGORY, IS_ACTIVE]

  - entity_type: CompetitorProduct
    name: Active competitor products
    description: Competitor products table
    source_table: DIM_COMPETITOR_PRODUCT
    connection: pim_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: COMPETITOR_PRODUCT_ID }
    columns: [COMPETITOR_PRODUCT_ID, PRODUCT_NAME, CITY, IS_ACTIVE, COMPETITOR_ID]

  - entity_type: Ingredient
    name: Ingredient master
    description: Every ingredient the company sources (DIM_INGREDIENT). Each one is already used in at least one live SKU, so presence here means "we already buy this". Carries no stock quantities. Read by idea_capture_triage's ingredient-availability step.
    source_table: DIM_INGREDIENT
    connection: pim_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: INGREDIENT_ID }
    columns: [INGREDIENT_ID, INGREDIENT_NAME, CATEGORY]

  - entity_type: ProductLine
    name: Production capability
    description: Product lines actually manufactured today, with active SKU count, COGS range and shelf life. Read by idea_capture_triage's feasibility step.
    source_table: V_PRODUCT_LINE_CAPABILITY
    connection: pim_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: PRODUCT_LINE_ID }
    columns: [PRODUCT_LINE_ID, PRODUCT_LINE_NAME, CATEGORY_NAME, ACTIVE_SKUS, MIN_COGS_INR, MAX_COGS_INR, AVG_SHELF_LIFE_DAYS]

  - entity_type: Product
    name: Triage similarity candidates
    description: Pipeline ideas + active competitor products unioned into one candidate set, read cross-type via dataset_search by idea_capture_triage's first step so the similarity match sees every row un-truncated. Not entity-scoped — never rendered as a Product widget.
    source_table: V_TRIAGE_SIMILARITY_CANDIDATES
    connection: pim_bq
    cardinality: "1:m"
    join_keys:
      - { entity_attribute: id, table_column: CANDIDATE_ID }
    columns: [SOURCE, CANDIDATE_ID, NAME, STAGE, HYPOTHESIS, THESIS_FIT, TARGET_COGS_INR, CITY, COMPETITOR_ID, CATEGORY]

widgets:
  # --- Store page --------------------------------------------------------
  - entity_type: Store
    type: number
    dataset: CUSTOMER_REVIEW_EVENTS
    title: Avg review rating
    position: 0
    config: { aggregation: avg, column: STAR_RATING }

  - entity_type: Store
    type: number
    dataset: CUSTOMER_COMPLAINT_EVENTS
    title: Complaints
    position: 1
    config: { aggregation: count, column: MASTER_STORE_ID }

  - entity_type: Store
    type: table
    dataset: CUSTOMER_REVIEW_EVENTS
    title: Recent reviews
    position: 2
    config:
      columns: [REVIEW_DATE, STAR_RATING, CUSTOMER_NAME, REVIEW_TEXT]
      order_by: REVIEW_DATE
      order_dir: desc
      limit: 20

  - entity_type: Store
    type: table
    dataset: STORE_INVENTORY_DAILY
    title: Inventory (latest snapshot)
    position: 3
    query: >
        SELECT * FROM `bronze.STORE_INVENTORY_DAILY`
        WHERE store_id = {{entity_id}}
        QUALIFY snapshot_date = MAX(snapshot_date) OVER ()


  - entity_type: Store
    type: table
    dataset: V_STORE_CAMPAIGN_CURRENT
    title: Running campaigns (this month)
    position: 4
    config:
      columns: [CAMPAIGN_ID, PRODUCT_TYPE, SEGMENTS, DATE, AD_SPEND_RS, AD_SALES_RS, AD_ORDERS, ROI]
      order_by: AD_SPEND_RS
      order_dir: desc
      limit: 50

  - entity_type: Store
    type: table
    dataset: silver.BUSINESS_ANALYTICS
    title: Sales by SKU
    position: 5
    query: >
      SELECT SKU_ID, ANY_VALUE(ITEM_SOURCE_NAME) AS item_name,
             SUM(QUANTITY) AS quantity, SUM(TOTAL) AS revenue
      FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`
      WHERE STORE_ID = {{entity_id}} AND ORDER_STATE <> 'Cancelled'
        AND ORDER_DATE >= DATE_TRUNC(CURRENT_DATE(), MONTH)
      GROUP BY SKU_ID
      ORDER BY revenue DESC

  # --- Product page ------------------------------------------------------
  - entity_type: Product
    type: table
    dataset: STORE_INVENTORY_DAILY
    title: Available quantity by store
    position: 0
    query: >
      SELECT store_id, SUM(available_quantity) AS available_quantity
      FROM (
        SELECT store_id, available_quantity
        FROM `bronze.STORE_INVENTORY_DAILY`
        WHERE product_sku = {{entity_id}}
        QUALIFY snapshot_date = MAX(snapshot_date) OVER (PARTITION BY store_id)
      )
      GROUP BY store_id
      ORDER BY available_quantity DESC

  - entity_type: Product
    type: table
    dataset: V_STOCKED_AT
    title: Stock by store
    position: 1
    config:
      columns: [MASTER_STORE_ID, TOTAL_STOCK, EXPIRED_STOCK, SOONEST_EXPIRY, LOW_STOCK_FLAG]
      order_by: TOTAL_STOCK
      order_dir: desc
      limit: 50

  - entity_type: Product
    type: table
    dataset: gold.FORECAST_RESULTS_UPDATE
    title: Forecast quantity by store (next 1-3 days)
    position: 2
    query: >
      SELECT MASTER_STORE_ID, ROUND(SUM(PREDICTED_SALES_QUANTITY), 1) AS forecast_qty
      FROM `gen-lang-client-0520145261.gold.FORECAST_RESULTS_UPDATE`
      WHERE SKU_ID = {{entity_id}} AND IS_LATEST_FORECAST = TRUE AND DAYS_AHEAD BETWEEN 1 AND 3
      GROUP BY MASTER_STORE_ID
      ORDER BY forecast_qty DESC

  - entity_type: Product
    type: number
    dataset: silver.BUSINESS_ANALYTICS
    title: Quantity sold (this month)
    position: 3
    query: >
      SELECT SUM(QUANTITY) AS VALUE
      FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`
      WHERE SKU_ID = {{entity_id}} AND ORDER_STATE <> 'Cancelled'
        AND ORDER_DATE >= DATE_TRUNC(CURRENT_DATE(), MONTH)

  - entity_type: Product
    type: number
    dataset: silver.BUSINESS_ANALYTICS
    title: Revenue (overall)
    position: 4
    query: >
      SELECT SUM(TOTAL) AS VALUE
      FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`
      WHERE SKU_ID = {{entity_id}} AND ORDER_STATE <> 'Cancelled'

  # --- CustomerSegment page ---------------------------------------------
  - entity_type: CustomerSegment
    type: table
    dataset: V_SEGMENT_BUDGET
    title: Budget by store
    position: 0
    config:
      columns: [STORE_NAME, CHANNEL, BUDGET_MONTH, ALLOCATED_BUDGET_RS]
      order_by: ALLOCATED_BUDGET_RS
      order_dir: desc
      limit: 50
