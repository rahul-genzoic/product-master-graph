# Lazy dataset links for fast-moving data.
# Binds canonical entity types to BigQuery source tables/views via join keys.

datasets:
- entity_type: Channel
  name: Reviews
  description: Customer review events for this store (lazy).
  source_table: CUSTOMER_REVIEW_EVENTS
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: MASTER_STORE_ID
  columns:
  - REVIEW_ID
  - REVIEW_TEXT
  - STAR_RATING
  - REVIEW_DATE
  - SOURCE_SYSTEM
  - CUSTOMER_NAME
  - MASTER_STORE_ID
- entity_type: Channel
  name: Review complaint candidates
  description: Low-rated reviews from the last 30 days, narrowed for the formulation_feedback_loop
    agent step. One-letter columns and a 140-char text cap keep the rowset inside
    that step's 9000-char prompt budget. S = store id, D = review date, N = integer
    day index (the 14-day test is done on N, not on D), T = review text, P = the SKU
    whose catalog family name appears in T, or ''. The clustering step reads [S, D,
    N, T] and deliberately NOT P -- `columns` is chosen per read, so P costs it nothing
    -- while the `reviewed_products` context key reads [P] alone to mint Product cards.
    See sql/views.sql.
  source_table: V_REVIEW_COMPLAINT_CANDIDATES
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: S
  columns:
  - S
  - D
  - N
  - T
  - P
- entity_type: Channel
  name: Complaints
  description: "Complaint events for this store (lazy). Base table (not the V_COMPLAINT_EVENTS\
    \ view) \u2014 the complaint carries ORDER_ID, matched to the sale's ONLINE_ORDER_ID\
    \ in the complaint-triage process."
  source_table: CUSTOMER_COMPLAINT_EVENTS
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: MASTER_STORE_ID
  columns:
  - EVENT_ID
  - ISSUE_TYPE
  - ITEM_NAME
  - CUSTOMER_COMMENTS
  - SOURCE_SYSTEM
  - ORDER_ID
  - COMPLAINT_RECEIVED_AT
  - MASTER_STORE_ID
- entity_type: Channel
  name: Inventory batches
  description: Latest inventory snapshot at this store (lazy).
  source_table: STORE_INVENTORY_DAILY
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: store_id
  columns:
  - inventory_record_id
  - snapshot_date
  - batch_row_number
  - available_quantity
  - expiry_date
  - batch_hash
  - product_sku
  - store_id
- entity_type: Channel
  name: Current campaigns
  description: Zomato/Swiggy ad campaigns running this month at this store (lazy).
    V_STORE_CAMPAIGN_CURRENT resolves RES_ID->store and re-scopes to "running now
    / this month" on each render.
  source_table: V_STORE_CAMPAIGN_CURRENT
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: MASTER_STORE_ID
  columns:
  - MASTER_STORE_ID
  - CAMPAIGN_ID
  - RES_ID
  - PLATFORM
  - PRODUCT_TYPE
  - TARGETING
  - SEGMENTS
  - DATE
  - AD_SPEND_RS
  - AD_SALES_RS
  - AD_ORDERS
  - AD_IMPRESSIONS
  - AD_CLICKS
  - ROI
  - ADS_M2O_PCT
  - OVERALL_M2O_PCT
  - ROAS
  - CTR
- entity_type: Channel
  name: Sales
  description: "Order-line sales for this store from the silver BASE table (no view)\
    \ \u2014 queried via raw SQL fully-qualifying silver.BUSINESS_ANALYTICS. Anchor\
    \ for the per-SKU sales widget."
  source_table: silver.BUSINESS_ANALYTICS
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: STORE_ID
  columns:
  - STORE_ID
  - SKU_ID
  - ITEM_SOURCE_NAME
  - QUANTITY
  - TOTAL
  - NET
  - ORDER_DATE
  - ORDER_STATE
  - ONLINE_ORDER_ID
- entity_type: Channel
  name: Campaign history
  description: "Zomato/Swiggy ad campaign performance for this store across ALL history,\
    \ rolled up to one row per (campaign, calendar month) \u2014 no CURRENT_DATE()\
    \ scoping, unlike \"Current campaigns\" above (lazy). Read by seasonal_campaign_planning.yaml's\
    \ seasonal_campaign_history context key to evaluate past comparable-window performance\
    \ for an upcoming event."
  source_table: V_STORE_CAMPAIGN_HISTORY
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: MASTER_STORE_ID
  columns:
  - MASTER_STORE_ID
  - CAMPAIGN_ID
  - MONTH
  - RES_ID
  - PLATFORM
  - PRODUCT_TYPE
  - TARGETING
  - SEGMENTS
  - WINDOW_START
  - WINDOW_END
  - AD_SPEND_RS
  - AD_SALES_RS
  - AD_ORDERS
  - AD_IMPRESSIONS
  - AD_CLICKS
  - ROI
  - ADS_M2O_PCT
  - OVERALL_M2O_PCT
  - ROAS
  - CTR
- entity_type: Channel
  name: Budget allocations
  description: This store's marketing budget allocated per segment, by channel/month
    (lazy).
  source_table: V_SEGMENT_BUDGET
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: MASTER_STORE_ID
  columns:
  - SEGMENT_ID
  - MASTER_STORE_ID
  - STORE_NAME
  - CHANNEL
  - BUDGET_MONTH
  - ALLOCATED_BUDGET_RS
  - EXPECTED_REVENUE_RS
- entity_type: Products
  name: Product label facts
  description: On-pack declarations + label artwork Drive folder link (IMAGES_LINK)
    for this SKU (lazy, 1:1).
  source_table: DIM_PRODUCT
  connection: pim_bq
  cardinality: '1:1'
  join_keys:
  - entity_attribute: id
    table_column: SKU
  columns:
  - SKU
  - DISPLAY_NAME
  - VEG_NONVEG
  - SIZE_LABEL
  - SIZE_GM
  - VERSION
  - STATUS
  - DESCRIPTION
  - IMAGES_LINK
- entity_type: Products
  name: Inventory batches
  description: Latest inventory snapshot for this product across stores (lazy).
  source_table: STORE_INVENTORY_DAILY
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: product_sku
  columns:
  - inventory_record_id
  - snapshot_date
  - batch_row_number
  - available_quantity
  - expiry_date
  - batch_hash
  - product_sku
  - store_id
- entity_type: Products
  name: Stock by store
  description: Current stock / wastage flags per store for this product (lazy).
  source_table: V_STOCKED_AT
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: SKU_ID
  columns:
  - SKU_ID
  - MASTER_STORE_ID
  - TOTAL_STOCK
  - SAFE_STOCK
  - EXPIRED_STOCK
  - SOONEST_EXPIRY
  - QTY_EXPIRING_WITHIN_RISK_DAYS
  - WASTAGE_FLAG
  - LOW_STOCK_FLAG
  - SHELF_LIFE_DAYS
- entity_type: Products
  name: Forecast
  description: Latest-run demand forecast (next 1-3 days) per store for this product,
    from the gold BASE table. source_table is dataset-qualified (gold.) so the dataset-read
    path (widgets + the demand_forecast gather) resolves it in gold, not the connection's
    default bronze dataset.
  source_table: gold.FORECAST_RESULTS_UPDATE
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: SKU_ID
  columns:
  - SKU_ID
  - MASTER_STORE_ID
  - FORECAST_DATE
  - PREDICTED_SALES_QUANTITY
  - DAYS_AHEAD
  - IS_LATEST_FORECAST
- entity_type: Channel
  name: Forecast by store
  description: Latest-run demand forecast per SKU for this store, from gold. Store-anchored
    (join on MASTER_STORE_ID) so a gather can traverse Store -> forecast.
  source_table: gold.FORECAST_RESULTS_UPDATE
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: MASTER_STORE_ID
  columns:
  - SKU_ID
  - MASTER_STORE_ID
  - FORECAST_DATE
  - PREDICTED_SALES_QUANTITY
  - DAYS_AHEAD
  - IS_LATEST_FORECAST
- entity_type: Products
  name: Sales
  description: "Order-line sales for this product from the silver BASE table (no view)\
    \ \u2014 queried via raw SQL fully-qualifying silver.BUSINESS_ANALYTICS. Anchor\
    \ for the qty-sold / revenue widgets."
  source_table: silver.BUSINESS_ANALYTICS
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: SKU_ID
  columns:
  - SKU_ID
  - STORE_ID
  - QUANTITY
  - TOTAL
  - NET
  - ORDER_DATE
  - ORDER_STATE
- entity_type: Products
  name: Product cost & price
  description: Static master cost/price/shelf-life for this product from V_PRODUCT_ENRICHED
    (lazy, 1:1 on SKU).
  source_table: V_PRODUCT_ENRICHED
  connection: pim_bq
  cardinality: '1:1'
  join_keys:
  - entity_attribute: id
    table_column: SKU
  columns:
  - SKU
  - DISPLAY_NAME
  - MRP_INR
  - TOTAL_COGS_INR
  - SHELF_LIFE_DAYS
- entity_type: Consumers
  name: Budget allocations
  description: Per-store marketing budget allocated to this segment, by channel/month
    (lazy).
  source_table: V_SEGMENT_BUDGET
  connection: live_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: SEGMENT_ID
  columns:
  - SEGMENT_ID
  - MASTER_STORE_ID
  - STORE_NAME
  - CHANNEL
  - BUDGET_MONTH
  - ALLOCATED_BUDGET_RS
  - EXPECTED_REVENUE_RS
- entity_type: Products
  name: All Ideas
  description: Ideas table for innovation triage
  source_table: DIM_IDEA
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: IDEA_ID
  columns:
  - IDEA_ID
  - NAME
  - STAGE
  - HYPOTHESIS
  - THESIS_FIT
  - TARGET_COGS_INR
  - STAGE_ENTERED_AT
- entity_type: Products
  name: Brief scoring inputs
  description: "Per-idea priority-scoring inputs for the active pipeline (V_IDEA_PRIORITY_INPUTS)\
    \ \u2014 DAYS_IN_STAGE, STAGE_RANK, TARGET_COGS_INR vs the portfolio COGS envelope,\
    \ and the COGS_FIT band. Active briefs only (STAGE not Rejected/Launch)."
  source_table: V_IDEA_PRIORITY_INPUTS
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: IDEA_ID
  columns:
  - IDEA_ID
  - NAME
  - STAGE
  - HYPOTHESIS
  - THESIS_FIT
  - TARGET_COGS_INR
  - DAYS_IN_STAGE
  - STAGE_RANK
  - PORTFOLIO_MIN_COGS_INR
  - PORTFOLIO_MAX_COGS_INR
  - COGS_FIT
- entity_type: Products
  name: Portfolio products
  description: Enriched product catalog
  source_table: V_PRODUCT_ENRICHED
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: SKU
  columns:
  - SKU
  - DISPLAY_NAME
  - DESCRIPTION
  - STATUS
  - IS_ACTIVE
  - CATEGORY
- entity_type: Materials
  name: Ingredient master
  description: Every ingredient the company sources (DIM_INGREDIENT). Each one is
    already used in at least one live SKU, so presence here means "we already buy
    this". Carries no stock quantities. Read by idea_capture_triage's ingredient-availability
    step.
  source_table: DIM_INGREDIENT
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: INGREDIENT_ID
  columns:
  - INGREDIENT_ID
  - INGREDIENT_NAME
  - CATEGORY
- entity_type: Products
  name: Product family names
  description: 'ONE ROW whose NM is every active product family, pipe-separated --
    the closed vocabulary formulation_feedback_loop''s clustering step must pick from
    when it infers a product from free review text. Aggregated into a single row on
    purpose: a context_package fact that is a list of more than 4 rows is previewed
    down to 4 before the step sees it, so 24 family rows would arrive as 4. Not entity-scoped
    -- never rendered as a Product widget. CG pairs the same families with their entry-pack
    COGS, so an approved reformulation brief can carry TARGET_COGS_INR. Families with
    no costed active SKU are absent from CG.'
  source_table: V_PRODUCT_FAMILY_NAMES
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: ID
  columns:
  - ID
  - NM
  - CG
- entity_type: Products
  name: Triage similarity candidates
  description: "Pipeline ideas + live SKUs + per-category counts + competitor examples\
    \ + an end-of-list sentinel, unioned into one candidate set behind a numerically-prefixed\
    \ SRC discriminator. Read cross-type via dataset_search by idea_capture_triage's\
    \ TWO matching steps, each filtering SRC to its own arms so each gets its own\
    \ 9000-char step-input budget. FOUR PACKED COLUMNS: a column name is a JSON key\
    \ on every row, and the previous ten-column shape measured 16904 chars against\
    \ a 9000 cap. Per-grain fields are packed positionally into D \u2014 see sql/views.sql\
    \ for the layout. Every column a step references, in `columns` or in `filters`,\
    \ must be declared below or the read 400s. Not entity-scoped \u2014 never rendered\
    \ as a Product widget."
  source_table: V_TRIAGE_SIMILARITY_CANDIDATES
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: ID
  columns:
  - SRC
  - ID
  - NM
  - D
- entity_type: Products
  name: Pipeline priority candidates
  description: "Active briefs + per-category demand/compliance/channel reference +\
    \ the cost envelope + the ingredient master, unioned into one narrow rowset behind\
    \ a SRC discriminator, read cross-type via dataset_search by innovation_pipeline_prioritisation's\
    \ scoring step so all ~38 briefs arrive un-truncated through a single fetch. Four\
    \ columns only, and the reference grains are packed into DATA, because STEP INPUT\
    \ DATA is capped at 9000 chars (see the view's header comment in sql/views.sql).\
    \ Not entity-scoped \u2014 never rendered as a Product widget."
  source_table: V_PIPELINE_PRIORITY_CANDIDATES
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: ID
  columns:
  - SRC
  - ID
  - NAME
  - DATA
- entity_type: Products
  name: Category market signal
  description: "Realised demand per product category (V_CATEGORY_MARKET_SIGNAL) \u2014\
    \ units and revenue over the trailing 90 days vs the prior 90, growth %, forward\
    \ forecast, active SKUs, plus competitor counts as a tiebreaker. The evidence\
    \ behind the market-signal factor in innovation_pipeline_prioritisation. Category-grained,\
    \ not entity-scoped."
  source_table: V_CATEGORY_MARKET_SIGNAL
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: CATEGORY_NAME
  columns:
  - CATEGORY_NAME
  - UNITS_90D
  - NET_REVENUE_90D
  - UNITS_PRIOR_90D
  - GROWTH_PCT
  - FORECAST_UNITS_NEXT
  - ACTIVE_SKUS_IN_CATEGORY
  - ACTIVE_COMPETITOR_PRODUCTS
  - DISTINCT_COMPETITORS
- entity_type: Materials
  name: Current cost
  description: Today's rate, normalised to INR/kg (litre quotes converted once, here),
    with supplier, provenance and age in days. IS_COSTED is false for an ingredient
    with no live price row. Cannot be served from DIM_INGREDIENT_PRICE directly, because
    picking the current row needs EFFECTIVE_TO IS NULL and dataset filters have no
    is_null operator.
  source_table: V_INGREDIENT_CURRENT_COST
  connection: pim_bq
  cardinality: '1:1'
  join_keys:
  - entity_attribute: id
    table_column: INGREDIENT_ID
  columns:
  - INGREDIENT_ID
  - INGREDIENT_NAME
  - SUPPLIER_NAME
  - PRICE_INR
  - PRICE_UOM
  - PRICE_INR_PER_KG
  - EFFECTIVE_FROM
  - EFFECTIVE_TO
  - PRICE_SOURCE
  - IS_COSTED
  - PRICE_AGE_DAYS
- entity_type: Materials
  name: Price history
  description: Every quoted rate over time with its effective window and provenance.
    The evidence behind "this is up 8% since Q1".
  source_table: DIM_INGREDIENT_PRICE
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: INGREDIENT_ID
  columns:
  - PRICE_ID
  - INGREDIENT_ID
  - SUPPLIER_NAME
  - PRICE_INR
  - PRICE_UOM
  - DENSITY_G_PER_ML
  - EFFECTIVE_FROM
  - EFFECTIVE_TO
  - PRICE_SOURCE
  - NOTE
- entity_type: Products
  name: Recipe versions
  description: Every recipe version for this SKU with its live rolled-up COGS and
    variance against the master TOTAL_COGS_INR in PRODUCT_PRICING. A non-zero variance
    means the master figure has gone stale, which is a finding, not a defect.
  source_table: V_RECIPE_COGS
  connection: pim_bq
  cardinality: 1:m
  join_keys:
  - entity_attribute: id
    table_column: SKU
  columns:
  - RECIPE_ID
  - SKU
  - RECIPE_NAME
  - VERSION_NO
  - STATUS
  - IS_CURRENT
  - INGREDIENT_COST_INR
  - PACKAGING_COST_INR
  - LABOUR_OVERHEAD_INR
  - RECIPE_COGS_INR
  - MASTER_COGS_INR
  - MASTER_VARIANCE_INR
  - MASTER_VARIANCE_PCT
  - YIELD_PCT
  - IS_FULLY_COSTED
  - TARGET_FIT
widgets:
- entity_type: Channel
  type: number
  dataset: CUSTOMER_REVIEW_EVENTS
  title: Avg review rating
  position: 0
  config:
    aggregation: avg
    column: STAR_RATING
- entity_type: Channel
  type: number
  dataset: CUSTOMER_COMPLAINT_EVENTS
  title: Complaints
  position: 1
  config:
    aggregation: count
    column: MASTER_STORE_ID
- entity_type: Channel
  type: table
  dataset: CUSTOMER_REVIEW_EVENTS
  title: Recent reviews
  position: 2
  config:
    columns:
    - REVIEW_DATE
    - STAR_RATING
    - CUSTOMER_NAME
    - REVIEW_TEXT
    order_by: REVIEW_DATE
    order_dir: desc
    limit: 20
- entity_type: Channel
  type: table
  dataset: STORE_INVENTORY_DAILY
  title: Inventory (latest snapshot)
  position: 3
  query: 'SELECT * FROM `bronze.STORE_INVENTORY_DAILY` WHERE store_id = {{entity_id}}
    QUALIFY snapshot_date = MAX(snapshot_date) OVER ()

    '
- entity_type: Channel
  type: table
  dataset: V_STORE_CAMPAIGN_CURRENT
  title: Running campaigns (this month)
  position: 4
  config:
    columns:
    - CAMPAIGN_ID
    - PRODUCT_TYPE
    - SEGMENTS
    - DATE
    - AD_SPEND_RS
    - AD_SALES_RS
    - AD_ORDERS
    - ROI
    order_by: AD_SPEND_RS
    order_dir: desc
    limit: 50
- entity_type: Channel
  type: table
  dataset: silver.BUSINESS_ANALYTICS
  title: Sales by SKU
  position: 5
  query: "SELECT SKU_ID, ANY_VALUE(ITEM_SOURCE_NAME) AS item_name,\n       SUM(QUANTITY)\
    \ AS quantity, SUM(TOTAL) AS revenue\nFROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`\
    \ WHERE STORE_ID = {{entity_id}} AND ORDER_STATE <> 'Cancelled'\n  AND ORDER_DATE\
    \ >= DATE_TRUNC(CURRENT_DATE(), MONTH)\nGROUP BY SKU_ID ORDER BY revenue DESC\n"
- entity_type: Products
  type: table
  dataset: STORE_INVENTORY_DAILY
  title: Available quantity by store
  position: 0
  query: "SELECT store_id, SUM(available_quantity) AS available_quantity FROM (\n\
    \  SELECT store_id, available_quantity\n  FROM `bronze.STORE_INVENTORY_DAILY`\n\
    \  WHERE product_sku = {{entity_id}}\n  QUALIFY snapshot_date = MAX(snapshot_date)\
    \ OVER (PARTITION BY store_id)\n) GROUP BY store_id ORDER BY available_quantity\
    \ DESC\n"
- entity_type: Products
  type: table
  dataset: V_STOCKED_AT
  title: Stock by store
  position: 1
  config:
    columns:
    - MASTER_STORE_ID
    - TOTAL_STOCK
    - EXPIRED_STOCK
    - SOONEST_EXPIRY
    - LOW_STOCK_FLAG
    order_by: TOTAL_STOCK
    order_dir: desc
    limit: 50
- entity_type: Products
  type: table
  dataset: gold.FORECAST_RESULTS_UPDATE
  title: Forecast quantity by store (next 1-3 days)
  position: 2
  query: 'SELECT MASTER_STORE_ID, ROUND(SUM(PREDICTED_SALES_QUANTITY), 1) AS forecast_qty
    FROM `gen-lang-client-0520145261.gold.FORECAST_RESULTS_UPDATE` WHERE SKU_ID =
    {{entity_id}} AND IS_LATEST_FORECAST = TRUE AND DAYS_AHEAD BETWEEN 1 AND 3 GROUP
    BY MASTER_STORE_ID ORDER BY forecast_qty DESC

    '
- entity_type: Products
  type: number
  dataset: silver.BUSINESS_ANALYTICS
  title: Quantity sold (this month)
  position: 3
  query: "SELECT SUM(QUANTITY) AS VALUE FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`\
    \ WHERE SKU_ID = {{entity_id}} AND ORDER_STATE <> 'Cancelled'\n  AND ORDER_DATE\
    \ >= DATE_TRUNC(CURRENT_DATE(), MONTH)\n"
- entity_type: Products
  type: number
  dataset: silver.BUSINESS_ANALYTICS
  title: Revenue (overall)
  position: 4
  query: 'SELECT SUM(TOTAL) AS VALUE FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`
    WHERE SKU_ID = {{entity_id}} AND ORDER_STATE <> ''Cancelled''

    '
- entity_type: Products
  type: table
  dataset: V_RECIPE_COGS
  title: Recipe versions & live COGS
  position: 5
  config:
    columns:
    - VERSION_NO
    - STATUS
    - IS_CURRENT
    - INGREDIENT_COST_INR
    - PACKAGING_COST_INR
    - LABOUR_OVERHEAD_INR
    - RECIPE_COGS_INR
    - MASTER_VARIANCE_INR
    order_by: VERSION_NO
    order_dir: desc
    limit: 20
- entity_type: Consumers
  type: table
  dataset: V_SEGMENT_BUDGET
  title: Budget by store
  position: 0
  config:
    columns:
    - STORE_NAME
    - CHANNEL
    - BUDGET_MONTH
    - ALLOCATED_BUDGET_RS
    order_by: ALLOCATED_BUDGET_RS
    order_dir: desc
    limit: 50
