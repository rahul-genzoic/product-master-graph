version: 1
kpis:
- id: ListingReadyShare
  name: Listing-Ready SKU Share
  description: Share of active SKUs a marketplace or FSSAI would accept with no blocking gap.
  owner: compliance_team
  applies_to: Product
  unit: percentage
  target:
    value: 90
    comparison: gte
  computed_by:
    source: bigquery
    network_query: 'SELECT ROUND(COUNTIF(BLOCKING_GAPS = '''') * 100.0 / NULLIF(COUNT(*), 0), 1) AS VALUE

      FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`

      WHERE IS_ACTIVE

      '
    view: V_LISTING_PACKAGE
  refresh:
    cache_ttl: 12h
  related_signals_events: [COMP_FSSAIRegulationPublished, COMP_PackagingRegulationChange, COMP_LegalMetrologyChange, COMP_NewSKUCreated,
    COMP_NewMarketChannelListingRequested, SALES_MarketplacePolicyChange]
- id: BlockingGapsPerSku
  name: Blocking Gaps per Active SKU
  description: How far a SKU is from publishable, not just whether it is. Depth behind ListingReadyShare.
  owner: compliance_team
  applies_to: Product
  unit: count
  target:
    value: 1
    comparison: lte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(AVG(IF(BLOCKING_GAPS = '', 0,\n             LENGTH(BLOCKING_GAPS)\n             - LENGTH(REPLACE(BLOCKING_GAPS,\
      \ CHR(59), '')) + 1)), 2) AS VALUE\nFROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`\nWHERE\
      \ IS_ACTIVE\n"
  refresh:
    cache_ttl: 12h
  related_signals_events: [COMP_FSSAIRegulationPublished, COMP_PackagingRegulationChange, COMP_LegalMetrologyChange, COMP_NewSKUCreated,
    SALES_MarketplacePolicyChange]
- id: AllergenUnderdeclarationRate
  name: Allergen Under-Declaration Rate
  description: Share of active SKUs whose recipe implies an allergen the label declares only as "may contain" (or not at all).
    The highest-liability number in the graph.
  owner: compliance_team
  applies_to: Product
  unit: percentage
  target:
    value: 0
    comparison: lte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(COUNTIF(ALLERGEN_UNDERDECLARED IS NOT NULL) * 100.0\n             / NULLIF(COUNT(*), 0),\
      \ 1) AS VALUE\nFROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`\nWHERE IS_ACTIVE\n"
    view: V_LISTING_PACKAGE
    column: ALLERGEN_UNDERDECLARED
  refresh:
    cache_ttl: 12h
  related_processes: [label_compliance_review]
  related_signals_events: [COMP_IngredientAdditiveRuleChange, COMP_ProductFormulationChanged, QA_IngredientSafetyWarning,
    QA_ContaminationOutbreak]
- id: ClaimSubstantiationRate
  name: Claim Substantiation Rate
  description: "Share of on-pack claims the lab panel supports within 5%. Claim-weighted, not averaged per SKU \u2014 one\
    \ SKU with ten claims must not count as one vote."
  owner: compliance_team
  applies_to: Product
  unit: percentage
  target:
    value: 90
    comparison: gte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(COUNTIF(VERDICT = 'substantiated') * 100.0\n             / NULLIF(COUNT(*), 0), 1) AS VALUE\n\
      FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_CLAIM_CHECK`\n"
  refresh:
    cache_ttl: 12h
  related_processes: [label_compliance_review]
  related_signals_events: [COMP_ClaimsRuleChange, COMP_ProductClaimChanged, MKT_MarketingClaimApprovalRequired, CMI_CompetitorClaimChange]
- id: ContradictedClaimCount
  name: Unpublishable Claim Count
  description: "Claims the lab panel contradicts outright \u2014 over 20% off, a false zero claim, or malformed."
  owner: compliance_team
  applies_to: Claim
  unit: count
  target:
    value: 0
    comparison: lte
  computed_by:
    source: bigquery
    network_query: 'SELECT COUNTIF(VERDICT IN (''MISMATCH'', ''CONTRADICTED'', ''MALFORMED_CLAIM'')) AS VALUE

      FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_CLAIM_CHECK`

      '
  refresh:
    cache_ttl: 12h
  related_processes: [label_compliance_review]
  related_signals_events: [COMP_ClaimsRuleChange, COMP_ProductClaimChanged, MKT_MarketingClaimApprovalRequired, CMI_CompetitorClaimChange]
- id: OwnRecipeShare
  name: Own-Recipe SKU Share
  description: Share of active SKUs with an ingredient list of their own rather than one inherited from a sibling pack size.
    Inherited data is assembled, not verified.
  owner: portfolio_team
  applies_to: Product
  unit: percentage
  target:
    value: 80
    comparison: gte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(COUNTIF(INGREDIENT_SOURCE = 'own') * 100.0\n             / NULLIF(COUNT(*), 0), 1) AS VALUE\n\
      FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`\nWHERE IS_ACTIVE\n"
    view: V_LISTING_PACKAGE
    column: INGREDIENT_SOURCE
  refresh:
    cache_ttl: 24h
  related_signals_events: [NPD_CompetitorFormulationChange, CMI_CompetitorFormulationChange]
  related_processes: [recipe_development_live_cogs]
- id: PanelBasisKnownShare
  name: Nutrition Basis Established Share
  description: 'Share of active SKUs whose panel basis is known. Without it no figure is publishable: 14.71 g protein per
    100 g and per 70 g serving are two different listings.'
  owner: compliance_team
  applies_to: Product
  unit: percentage
  target:
    value: 100
    comparison: gte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(COUNTIF(NUTRIENT_BASIS NOT IN ('unknown', 'no_panel')) * 100.0\n             / NULLIF(COUNT(*),\
      \ 0), 1) AS VALUE\nFROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`\nWHERE IS_ACTIVE\n"
    view: V_LISTING_PACKAGE
    column: NUTRIENT_BASIS
  refresh:
    cache_ttl: 24h
  related_processes: [label_compliance_review]
  related_signals_events: [COMP_LabellingRuleChange, COMP_LabelArtworkChanged]
- id: MandatoryNutrientCompleteness
  name: FSSAI Mandatory Nutrient Completeness
  description: Share of active SKUs with no FSSAI-mandatory nutrient left blank on the panel.
  owner: compliance_team
  applies_to: Product
  unit: percentage
  target:
    value: 100
    comparison: gte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(COUNTIF(MANDATORY_NUTRIENTS_BLANK IS NULL) * 100.0\n             / NULLIF(COUNT(*), 0), 1)\
      \ AS VALUE\nFROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`\nWHERE IS_ACTIVE\n"
    view: V_LISTING_PACKAGE
    column: MANDATORY_NUTRIENTS_BLANK
  refresh:
    cache_ttl: 24h
  related_processes: [label_compliance_review]
  related_signals_events: [COMP_LabellingRuleChange, COMP_LabelArtworkChanged]
- id: WastageRisk
  name: Wastage Risk (units at risk)
  description: "Units expiring inside the store's configured risk window \u2014 the liquidation trigger. Target 0 is a true\
    \ north, so this reads red until the network actually clears."
  owner: supply_chain_team
  applies_to: Store
  unit: units
  target:
    value: 0
    comparison: eq
  computed_by:
    source: bigquery
    network_query: 'SELECT SUM(QTY_EXPIRING_WITHIN_RISK_DAYS) AS VALUE

      FROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT`

      '
    view: V_STOCKED_AT
    column: QTY_EXPIRING_WITHIN_RISK_DAYS
  refresh:
    cache_ttl: 6h
  related_processes: [shelf_life_risk_monitoring, demand_forecast]
  related_signals_events: [OPS_WeatherAnomaly, OPS_ShelfLifeThresholdReached]
- id: ExpiryValueAtRisk
  name: Expiry Value at Risk (INR)
  description: "Rupee cost of the stock about to be binned network-wide \u2014 units at risk priced at unit COGS."
  owner: supply_chain_team
  applies_to: Product
  unit: inr
  target:
    value: 25000
    comparison: lte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(SUM(s.QTY_EXPIRING_WITHIN_RISK_DAYS * p.TOTAL_COGS_INR), 0) AS VALUE\nFROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT`\
      \ s\nJOIN `gen-lang-client-0520145261.ctx_upside_master_data.V_PRODUCT_ENRICHED` p\n  ON p.SKU = s.SKU_ID\n"
  refresh:
    cache_ttl: 6h
  related_processes: [demand_forecast]
  related_signals_events: [OPS_ShelfLifeThresholdReached]
- id: ExpiredStockUnits
  name: Expired Stock on the Books (units)
  description: Units already past expiry and still carried. Both shelf-life processes filter days_to_expiry >= 0, so nothing
    else watches this.
  owner: supply_chain_team
  applies_to: Store
  unit: units
  target:
    value: 0
    comparison: eq
  computed_by:
    source: bigquery
    network_query: 'SELECT SUM(EXPIRED_STOCK) AS VALUE

      FROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT`

      '
    view: V_STOCKED_AT
    column: EXPIRED_STOCK
  refresh:
    cache_ttl: 6h
  related_processes: [shelf_life_risk_monitoring, demand_forecast]
  related_signals_events: [OPS_ShelfLifeThresholdReached]
- id: LowStockIncidenceRate
  name: Low-Stock Incidence Rate
  description: "Share of stocked (SKU, store) pairs at or under their configured min_count. The counterweight to cutting wastage\
    \ \u2014 expiry risk removed by understocking is not a win."
  owner: supply_chain_team
  applies_to: Store
  unit: percentage
  target:
    value: 5
    comparison: lte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(COUNTIF(s.TOTAL_STOCK <= c.MIN_COUNT) * 100.0\n             / NULLIF(COUNT(*), 0), 1) AS\
      \ VALUE\nFROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT` s\nJOIN `gen-lang-client-0520145261.bronze.LOW_STOCK_CONFIG`\
      \ c\n  ON c.SKU_ID = s.SKU_ID AND c.STORE_ID = s.MASTER_STORE_ID\n"
  refresh:
    cache_ttl: 6h
  related_processes: [shelf_life_risk_monitoring, demand_forecast]
  related_signals_events:
  - SALES_CompetitorOutOfStock
  - OPS_TransportPortDisruption
  - OPS_RegionalDisruption
  - OPS_LogisticsMarketDisruption
  - OPS_IndustryWideShortage
  - OPS_InventoryBelowSafetyStock
  - PROC_SupplierRegionWeatherDisruption
  - PROC_PortShippingDisruption
  - PROC_MarketMaterialShortage
- id: CriticalLowCount
  name: Critically-Low (SKU, store) Pairs
  description: "Pairs at or under absolute_risk_count \u2014 the hard floor, not the reorder point."
  owner: supply_chain_team
  applies_to: Store
  unit: count
  target:
    value: 0
    comparison: eq
  computed_by:
    source: bigquery
    network_query: "SELECT COUNTIF(s.TOTAL_STOCK <= c.ABSOLUTE_RISK_COUNT) AS VALUE\nFROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT`\
      \ s\nJOIN `gen-lang-client-0520145261.bronze.LOW_STOCK_CONFIG` c\n  ON c.SKU_ID = s.SKU_ID AND c.STORE_ID = s.MASTER_STORE_ID\n"
  refresh:
    cache_ttl: 6h
  related_processes: [shelf_life_risk_monitoring, demand_forecast]
  related_signals_events: [OPS_InventoryBelowSafetyStock]
- id: SellThroughGap
  name: Sell-Through Gap on At-Risk Stock (units)
  description: "On-hand minus the 3-day forecast for stock inside the expiry window. Positive means we ordered more than will\
    \ sell \u2014 the over-ordering the rescue desk exists to stop."
  owner: supply_chain_team
  applies_to: Product
  unit: units
  target:
    value: 0
    comparison: lte
  computed_by:
    source: bigquery
    network_query: "WITH latest AS (\n  SELECT store_id, product_sku, available_quantity, expiry_date\n  FROM `gen-lang-client-0520145261.bronze.STORE_INVENTORY_DAILY`\n\
      \  QUALIFY snapshot_date = MAX(snapshot_date) OVER (PARTITION BY store_id)\n),\ninv AS (\n  SELECT store_id, product_sku,\n\
      \         SUM(available_quantity) AS on_hand,\n         MIN(SAFE_CAST(expiry_date AS DATE)) AS soonest\n  FROM latest\n\
      \  WHERE available_quantity > 0\n  GROUP BY store_id, product_sku\n),\nfc AS (\n  SELECT MASTER_STORE_ID AS store_id,\
      \ SKU_ID AS product_sku,\n         SUM(PREDICTED_SALES_QUANTITY) AS fc3\n  FROM `gen-lang-client-0520145261.gold.FORECAST_RESULTS_UPDATE`\n\
      \  WHERE IS_LATEST_FORECAST AND DAYS_AHEAD BETWEEN 1 AND 3\n  GROUP BY store_id, product_sku\n)\nSELECT ROUND(AVG(i.on_hand\
      \ - IFNULL(f.fc3, 0)), 1) AS VALUE\nFROM inv i\nLEFT JOIN fc f ON f.store_id = i.store_id AND f.product_sku = i.product_sku\n\
      WHERE DATE_DIFF(i.soonest, CURRENT_DATE(), DAY) BETWEEN 0 AND 3\n"
  refresh:
    cache_ttl: 6h
  related_processes: [demand_forecast]
  related_signals_events: [OPS_ShelfLifeThresholdReached]
- id: AvgStoreRating
  name: Average Store Rating
  description: Mean customer star rating across stores.
  owner: cx_team
  applies_to: Store
  unit: rating
  target:
    value: 4.0
    comparison: gte
  computed_by:
    source: bigquery
    table: CUSTOMER_REVIEW_EVENTS
    column: STAR_RATING
  refresh:
    cache_ttl: 12h
  related_processes: [customer_review_aggregation_and_triage]
  related_signals_events: [MKT_BrandSentimentShift, QA_PublicComplaintTrend]
- id: LowRatingShare
  name: Low-Rating Share (<= 3 stars)
  description: Share of reviews at 3 stars or below over 90 days. The mean averages the tail away; this is the band the triage
    process actually acts on.
  owner: cx_team
  applies_to: Store
  unit: percentage
  target:
    value: 15
    comparison: lte
  computed_by:
    source: bigquery
    network_query: 'SELECT ROUND(COUNTIF(STAR_RATING <= 3) * 100.0 / NULLIF(COUNT(*), 0), 1) AS VALUE

      FROM `gen-lang-client-0520145261.bronze.CUSTOMER_REVIEW_EVENTS`

      WHERE SAFE_CAST(REVIEW_DATE AS DATE) >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)

      '
  refresh:
    cache_ttl: 12h
  related_processes: [customer_review_aggregation_and_triage]
  related_signals_events: [MKT_BrandSentimentShift, QA_PublicComplaintTrend, QA_CategoryQualityIssue, QA_ConsumerComplaintsAboveThreshold]
- id: OpsComplaintShare
  name: Last-Mile Complaint Share
  description: "Share of complaints over 60 days owned by the dark-store partner rather than the product \u2014 late, wrong,\
    \ missing or damaged."
  owner: cx_team
  applies_to: Store
  unit: percentage
  target:
    value: 30
    comparison: lte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(COUNTIF(REGEXP_CONTAINS(LOWER(IFNULL(ISSUE_TYPE, '')),\n             r'late|delay|deliver|packag|spillage|wrong|missing'))\
      \ * 100.0\n             / NULLIF(COUNT(*), 0), 1) AS VALUE\nFROM `gen-lang-client-0520145261.bronze.CUSTOMER_COMPLAINT_EVENTS`\n\
      WHERE SAFE_CAST(COMPLAINT_RECEIVED_AT AS DATE)\n      >= DATE_SUB(CURRENT_DATE(), INTERVAL 60 DAY)\n"
  refresh:
    cache_ttl: 12h
  related_signals_events: [QA_PublicComplaintTrend, QA_ConsumerComplaintsAboveThreshold]
  related_processes: [dark_store_ops_escalation]
- id: StoresOverOpsComplaintBar
  name: Stores Over the Ops-Complaint Bar
  description: "Stores with 3 or more last-mile complaints in 60 days \u2014 the escalation bar itself."
  owner: cx_team
  applies_to: Store
  unit: count
  target:
    value: 0
    comparison: eq
  computed_by:
    source: bigquery
    network_query: "WITH per_store AS (\n  SELECT MASTER_STORE_ID,\n         COUNTIF(REGEXP_CONTAINS(LOWER(IFNULL(ISSUE_TYPE,\
      \ '')),\n                 r'late|delay|deliver|packag|spillage|wrong|missing')) AS ops\n  FROM `gen-lang-client-0520145261.bronze.CUSTOMER_COMPLAINT_EVENTS`\n\
      \  WHERE SAFE_CAST(COMPLAINT_RECEIVED_AT AS DATE)\n        >= DATE_SUB(CURRENT_DATE(), INTERVAL 60 DAY)\n  GROUP BY\
      \ MASTER_STORE_ID\n)\nSELECT COUNTIF(ops >= 3) AS VALUE FROM per_store\n"
  refresh:
    cache_ttl: 12h
  related_signals_events: [OPS_RegionalDisruption, OPS_InfrastructureDisruption, QA_ConsumerComplaintsAboveThreshold]
  related_processes: [dark_store_ops_escalation]
- id: NearExpiryComplaintShare
  name: Near-Expiry Product Complaint Share
  description: Share of product complaints where the batch on hand that day was already inside its shelf-life threshold. The
    only measure of a freshness failure reaching a customer.
  owner: production_team
  applies_to: Product
  unit: percentage
  target:
    value: 10
    comparison: lte
  computed_by:
    source: bigquery
    network_query: "WITH product_complaints AS (\n  SELECT ORDER_ID\n  FROM `gen-lang-client-0520145261.bronze.CUSTOMER_COMPLAINT_EVENTS`\n\
      \  WHERE SAFE_CAST(COMPLAINT_RECEIVED_AT AS DATE)\n        >= DATE_SUB(CURRENT_DATE(), INTERVAL 60 DAY)\n    AND REGEXP_CONTAINS(LOWER(IFNULL(ISSUE_TYPE,\
      \ '')), r'quality|taste|fresh|expir')\n    AND ORDER_ID IS NOT NULL\n),\nlines AS (\n  SELECT DISTINCT ONLINE_ORDER_ID,\
      \ STORE_ID, SKU_ID,\n         SAFE_CAST(ORDER_DATE AS DATE) AS order_date\n  FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`\n\
      \  WHERE ORDER_STATE <> 'Cancelled'\n),\nbatch AS (\n  SELECT store_id, product_sku,\n         SAFE_CAST(snapshot_date\
      \ AS DATE) AS snap,\n         MIN(SAFE_CAST(expiry_date AS DATE)) AS soonest\n  FROM `gen-lang-client-0520145261.bronze.STORE_INVENTORY_DAILY`\n\
      \  WHERE available_quantity > 0\n  GROUP BY store_id, product_sku, snap\n),\ntraced AS (\n  SELECT DATE_DIFF(bt.soonest,\
      \ l.order_date, DAY) AS life_left,\n         IFNULL(c.MIN_DAYS_SHELF_LIFE, 2) AS threshold\n  FROM product_complaints\
      \ pc\n  JOIN lines l ON l.ONLINE_ORDER_ID = pc.ORDER_ID\n  LEFT JOIN batch bt\n    ON bt.store_id = l.STORE_ID AND bt.product_sku\
      \ = l.SKU_ID\n   AND bt.snap = l.order_date\n  LEFT JOIN `gen-lang-client-0520145261.bronze.LOW_STOCK_CONFIG` c\n  \
      \  ON c.SKU_ID = l.SKU_ID AND c.STORE_ID = l.STORE_ID\n)\nSELECT ROUND(COUNTIF(life_left IS NOT NULL AND life_left <=\
      \ threshold) * 100.0\n             / NULLIF(COUNT(*), 0), 1) AS VALUE\nFROM traced\n"
  refresh:
    cache_ttl: 12h
  related_processes: [customer_review_aggregation_and_triage, shelf_life_risk_monitoring]
  related_signals_events: [QA_PublicComplaintTrend, QA_CategoryQualityIssue]
- id: ForecastAccuracy
  name: Demand Forecast Accuracy
  description: '100 - MAPE against realised sales per (SKU, store, day) over 30 days. Can go negative: a forecast worse than
    useless should read worse than zero.'
  owner: demand_planning_team
  applies_to: Product
  unit: percentage
  target:
    value: 80
    comparison: gte
  computed_by:
    source: bigquery
    network_query: "WITH fc AS (\n  SELECT SKU_ID, MASTER_STORE_ID,\n         SAFE_CAST(FORECAST_DATE AS DATE) AS d,\n   \
      \      SUM(PREDICTED_SALES_QUANTITY) AS predicted\n  FROM `gen-lang-client-0520145261.gold.FORECAST_RESULTS_UPDATE`\n\
      \  WHERE IS_LATEST_FORECAST\n  GROUP BY SKU_ID, MASTER_STORE_ID, d\n),\nact AS (\n  SELECT SKU_ID, STORE_ID,\n     \
      \    SAFE_CAST(ORDER_DATE AS DATE) AS d,\n         SUM(QUANTITY) AS actual\n  FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`\n\
      \  WHERE ORDER_STATE <> 'Cancelled'\n  GROUP BY SKU_ID, STORE_ID, d\n)\nSELECT ROUND(100 - AVG(ABS(SAFE_DIVIDE(f.predicted\
      \ - a.actual,\n                                       NULLIF(a.actual, 0))) * 100), 1) AS VALUE\nFROM fc f\nJOIN act\
      \ a\n  ON a.SKU_ID = f.SKU_ID AND a.STORE_ID = f.MASTER_STORE_ID AND a.d = f.d\nWHERE a.actual > 0\n  AND f.d >= DATE_SUB(CURRENT_DATE(),\
      \ INTERVAL 30 DAY)\n"
  refresh:
    cache_ttl: 12h
  related_processes: [demand_forecast]
  related_signals_events:
  - MKT_FestivalSeasonalOpportunity
  - MKT_CulturalSportingEvent
  - FIN_MacroeconomicDemandChange
  - OPS_WeatherAnomaly
  - OPS_SevereWeatherWarning
  - OPS_FestivalEventDemandSignal
  - OPS_ExternalDemandTrend
  - OPS_ForecastVarianceAboveTolerance
  - CMI_CategoryMarketGrowthShift
- id: ForecastCoverageDays
  name: Forecast Coverage (days ahead)
  description: "How far into the future the latest forecast run reaches. Accuracy on a forecast that stops in the past plans\
    \ nothing \u2014 this is what makes a stalled job visible."
  owner: demand_planning_team
  applies_to: Product
  unit: days
  target:
    value: 3
    comparison: gte
  computed_by:
    source: bigquery
    network_query: 'SELECT DATE_DIFF(MAX(SAFE_CAST(FORECAST_DATE AS DATE)), CURRENT_DATE(), DAY) AS VALUE

      FROM `gen-lang-client-0520145261.gold.FORECAST_RESULTS_UPDATE`

      WHERE IS_LATEST_FORECAST

      '
  refresh:
    cache_ttl: 6h
  related_processes: [demand_forecast]
  related_signals_events: [OPS_ForecastVarianceAboveTolerance]
- id: BlendedCampaignRoi
  name: Blended Campaign ROI
  description: "Ad sales over ad spend across every running campaign. Spend-weighted, never an average of per-campaign ROI\
    \ \u2014 a tiny-spend outlier must not outvote a flagship."
  owner: marketing_team
  applies_to: Campaign
  unit: ratio
  target:
    value: 1.5
    comparison: gte
  computed_by:
    source: bigquery
    network_query: 'SELECT ROUND(SAFE_DIVIDE(SUM(AD_SALES_RS), SUM(AD_SPEND_RS)), 2) AS VALUE

      FROM `gen-lang-client-0520145261.bronze.V_STORE_CAMPAIGN_CURRENT`

      '
  refresh:
    cache_ttl: 6h
  related_processes: [campaign_planning_optimisation]
  related_signals_events:
  - MKT_SearchVolumeSpike
  - MKT_SocialConversationSpike
  - MKT_InfluencerMention
  - MKT_CompetitorCampaignLaunch
  - MKT_ViralContentCategoryTrend
  - MKT_CampaignPerformanceBelowTarget
  - MKT_CampaignOptimizationReviewDue
  - MKT_CampaignPostMortemDue
- id: ZeroReturnAdSpend
  name: Zero-Return Ad Spend (INR)
  description: Money on campaigns returning literally nothing, above the process's own 200-rupee floor.
  owner: marketing_team
  applies_to: Campaign
  unit: inr
  target:
    value: 0
    comparison: lte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(SUM(IF(IFNULL(ROI, 0) = 0 AND AD_SPEND_RS >= 200,\n                    AD_SPEND_RS, 0)),\
      \ 0) AS VALUE\nFROM `gen-lang-client-0520145261.bronze.V_STORE_CAMPAIGN_CURRENT`\n"
  refresh:
    cache_ttl: 6h
  related_processes: [campaign_planning_optimisation]
  related_signals_events: [MKT_CompetitorCampaignLaunch, MKT_CampaignPerformanceBelowTarget, MKT_CampaignBudgetThresholdReached,
    MKT_CampaignOptimizationReviewDue]
- id: AdsConversionGapPct
  name: Ads Conversion Gap (pp)
  description: Percentage points by which ad-driven menu-to-order conversion trails the store's overall rate. The process
    treats a 5-point gap as a campaign failing on its own terms.
  owner: marketing_team
  applies_to: Campaign
  unit: percentage
  target:
    value: 5
    comparison: lte
  computed_by:
    source: bigquery
    network_query: 'SELECT ROUND(AVG(OVERALL_M2O_PCT - ADS_M2O_PCT), 1) AS VALUE

      FROM `gen-lang-client-0520145261.bronze.V_STORE_CAMPAIGN_CURRENT`

      WHERE ADS_M2O_PCT IS NOT NULL AND OVERALL_M2O_PCT IS NOT NULL

      '
  refresh:
    cache_ttl: 6h
  related_processes: [campaign_planning_optimisation]
  related_signals_events: [MKT_SearchVolumeSpike, MKT_SocialConversationSpike, MKT_ConsumerBehaviorShift, MKT_CampaignPerformanceBelowTarget,
    MKT_CampaignOptimizationReviewDue]
- id: MarginPct
  name: Portfolio Gross Margin %
  description: (MRP - COGS) / MRP across active SKUs, revenue-weighted. Previously averaged MRP_INR and labelled it a percentage,
    which read as permanently on target.
  owner: portfolio_team
  applies_to: Product
  unit: percentage
  target:
    value: 60
    comparison: gte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(SAFE_DIVIDE(SUM(MRP_INR - TOTAL_COGS_INR),\n                         NULLIF(SUM(MRP_INR),\
      \ 0)) * 100, 1) AS VALUE\nFROM `gen-lang-client-0520145261.ctx_upside_master_data.V_PRODUCT_ENRICHED`\nWHERE IS_ACTIVE\
      \ AND MRP_INR > 0\n"
  refresh:
    cache_ttl: 24h
  related_signals_events:
  - NPD_CompetitorFormulationChange
  - NPD_CompetitorPackInnovation
  - NPD_FormulationCOGSAboveTarget
  - FIN_CompetitorPriceChange
  - FIN_CompetitorPromotionLaunch
  - FIN_CommodityPriceMovement
  - FIN_FXRateMovement
  - FIN_InflationMovement
  - FIN_CompetitorPackSizeChange
  - FIN_CompetitorBundleOffer
  - FIN_CategoryPricingMovement
  - FIN_RetailerDiscountMovement
  - FIN_GrossMarginBelowFloor
  - FIN_COGSAboveThreshold
  - FIN_SKUProfitabilityBelowThreshold
  - OPS_FuelPriceSpike
  - PROC_CommodityPriceSpike
  - PROC_CommodityFuturesMovement
  - PROC_NewAlternativeSupplierIdentified
  - PROC_IndustryInputCostMovement
  - CMI_CompetitorPriceChange
  - CMI_CompetitorPromotion
  - CMI_CompetitorFormulationChange
  related_processes: [recipe_development_live_cogs, competitive_pricing_signal]
- id: PipelineAgingDays
  name: Pipeline Aging (days in stage)
  description: Mean days an active brief has sat in its current stage.
  owner: npd_team
  applies_to: Idea
  unit: days
  target:
    value: 45
    comparison: lte
  computed_by:
    source: bigquery
    network_query: 'SELECT ROUND(AVG(DAYS_IN_STAGE), 1) AS VALUE

      FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_IDEA_PRIORITY_INPUTS`

      '
    view: V_IDEA_PRIORITY_INPUTS
    column: DAYS_IN_STAGE
  refresh:
    cache_ttl: 24h
  related_processes: [innovation_pipeline_prioritisation, idea_capture_triage]
  related_signals_events:
  - NPD_EmergingConsumerSearchTrend
  - NPD_SocialTrendAcceleration
  - NPD_CompetitorProductLaunch
  - NPD_CategoryGrowthDecline
  - NPD_NPDStageGateReached
  - MKT_ConsumerTrendEmergence
  - CMI_CompetitorProductLaunch
  - CMI_NewChallengerBrandEmerging
  - CMI_CategoryMarketGrowthShift
- id: StalledBriefCount
  name: Stalled Brief Count
  description: "Active briefs past 90 days in stage \u2014 the top rung of the scoring ladder, i.e. undecided."
  owner: npd_team
  applies_to: Idea
  unit: count
  target:
    value: 0
    comparison: eq
  computed_by:
    source: bigquery
    network_query: 'SELECT COUNTIF(DAYS_IN_STAGE >= 90) AS VALUE

      FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_IDEA_PRIORITY_INPUTS`

      '
  refresh:
    cache_ttl: 24h
  related_processes: [innovation_pipeline_prioritisation]
  related_signals_events: [NPD_NPDStageGateReached]
- id: BriefScorableShare
  name: Scorable Brief Share
  description: Share of active briefs with a target COGS and a stage date. Below this the ranking is scored on midpoints,
    which is what the process escalates on.
  owner: npd_team
  applies_to: Idea
  unit: percentage
  target:
    value: 90
    comparison: gte
  computed_by:
    source: bigquery
    network_query: "SELECT ROUND(COUNTIF(COGS_FIT <> 'UNKNOWN' AND DAYS_IN_STAGE IS NOT NULL) * 100.0\n             / NULLIF(COUNT(*),\
      \ 0), 1) AS VALUE\nFROM `gen-lang-client-0520145261.ctx_upside_master_data.V_IDEA_PRIORITY_INPUTS`\n"
    view: V_IDEA_PRIORITY_INPUTS
    column: COGS_FIT
  refresh:
    cache_ttl: 24h
  related_processes: [innovation_pipeline_prioritisation]
  related_signals_events: [NPD_EmergingIngredientTrend, NPD_EmergingFlavorTrend, NPD_EmergingConsumerNeed, NPD_NewIngredientTechnologyInnovation]
