version: 1

# KPI definitions. `network_query` is the goal-level number; `view`+`column` is the
# per-entity one. TARGETS ARE UNMEASURED — set against a real read before trusting them.

kpis:
  # ---- Listing & label accuracy (V_LISTING_PACKAGE / V_LISTING_CLAIM_CHECK) ----
  - id: ListingReadyShare
    name: Listing-Ready SKU Share
    description: Share of active SKUs a marketplace or FSSAI would accept with no blocking gap.
    owner: compliance_team
    applies_to: Product
    unit: percentage
    target: { value: 90, comparison: gte }
    computed_by:
      source: bigquery
      # BLOCKING_GAPS is an ARRAY_TO_STRING, so "ready" is the empty string, never NULL.
      network_query: |
        SELECT ROUND(COUNTIF(BLOCKING_GAPS = '') * 100.0 / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`
        WHERE IS_ACTIVE
      view: V_LISTING_PACKAGE
    refresh: { cache_ttl: 12h }
    related_signals_events: [COMP_NewSKUCreated]   # reverse of master_data/signals_events.yaml related_kpis for ListingReadyShare

  - id: BlockingGapsPerSku
    name: Blocking Gaps per Active SKU
    description: How far a SKU is from publishable, not just whether it is. Depth behind ListingReadyShare.
    owner: compliance_team
    applies_to: Product
    unit: count
    target: { value: 1, comparison: lte }
    computed_by:
      source: bigquery
      # Gaps are '; '-joined, so count = separators + 1. CHR(59) because the raw-query
      # guard rejects a literal semicolon even inside a string.
      network_query: |
        SELECT ROUND(AVG(IF(BLOCKING_GAPS = '', 0,
                     LENGTH(BLOCKING_GAPS)
                     - LENGTH(REPLACE(BLOCKING_GAPS, CHR(59), '')) + 1)), 2) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`
        WHERE IS_ACTIVE
    refresh: { cache_ttl: 12h }
    related_signals_events: [COMP_NewSKUCreated]   # reverse of master_data/signals_events.yaml related_kpis for BlockingGapsPerSku

  - id: AllergenUnderdeclarationRate
    name: Allergen Under-Declaration Rate
    description: >-
      Share of active SKUs whose recipe implies an allergen the label declares only as
      "may contain" (or not at all). The highest-liability number in the graph.
    owner: compliance_team
    applies_to: Product
    unit: percentage
    target: { value: 0, comparison: lte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(COUNTIF(ALLERGEN_UNDERDECLARED IS NOT NULL) * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`
        WHERE IS_ACTIVE
      view: V_LISTING_PACKAGE
      column: ALLERGEN_UNDERDECLARED
    refresh: { cache_ttl: 12h }
    related_processes: [label_compliance_review]
    related_signals_events: [COMP_ProductFormulationChanged]   # reverse of master_data/signals_events.yaml related_kpis for AllergenUnderdeclarationRate

  - id: ClaimSubstantiationRate
    name: Claim Substantiation Rate
    description: >-
      Share of on-pack claims the lab panel supports within 5%. Claim-weighted, not
      averaged per SKU — one SKU with ten claims must not count as one vote.
    owner: compliance_team
    applies_to: Product
    unit: percentage
    # Not 100: 'not_verifiable_from_pim' and 'needs_threshold_check' can never substantiate.
    target: { value: 90, comparison: gte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(COUNTIF(VERDICT = 'substantiated') * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_CLAIM_CHECK`
    refresh: { cache_ttl: 12h }
    related_processes: [label_compliance_review]
    related_signals_events: [COMP_ClaimsRuleChange, COMP_ProductClaimChanged, MKT_MarketingClaimApprovalRequired]   # reverse of master_data/signals_events.yaml related_kpis for ClaimSubstantiationRate

  - id: ContradictedClaimCount
    name: Unpublishable Claim Count
    description: Claims the lab panel contradicts outright — over 20% off, a false zero claim, or malformed.
    owner: compliance_team
    applies_to: Claim
    unit: count
    target: { value: 0, comparison: lte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT COUNTIF(VERDICT IN ('MISMATCH', 'CONTRADICTED', 'MALFORMED_CLAIM')) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_CLAIM_CHECK`
    refresh: { cache_ttl: 12h }
    related_processes: [label_compliance_review]
    related_signals_events: [COMP_ClaimsRuleChange, COMP_ProductClaimChanged, MKT_MarketingClaimApprovalRequired]   # reverse of master_data/signals_events.yaml related_kpis for ContradictedClaimCount

  - id: OwnRecipeShare
    name: Own-Recipe SKU Share
    description: >-
      Share of active SKUs with an ingredient list of their own rather than one inherited
      from a sibling pack size. Inherited data is assembled, not verified.
    owner: portfolio_team
    applies_to: Product
    unit: percentage
    target: { value: 80, comparison: gte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(COUNTIF(INGREDIENT_SOURCE = 'own') * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`
        WHERE IS_ACTIVE
      view: V_LISTING_PACKAGE
      column: INGREDIENT_SOURCE
    refresh: { cache_ttl: 24h }

  - id: PanelBasisKnownShare
    name: Nutrition Basis Established Share
    description: >-
      Share of active SKUs whose panel basis is known. Without it no figure is publishable:
      14.71 g protein per 100 g and per 70 g serving are two different listings.
    owner: compliance_team
    applies_to: Product
    unit: percentage
    target: { value: 100, comparison: gte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(COUNTIF(NUTRIENT_BASIS NOT IN ('unknown', 'no_panel')) * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`
        WHERE IS_ACTIVE
      view: V_LISTING_PACKAGE
      column: NUTRIENT_BASIS
    refresh: { cache_ttl: 24h }
    related_processes: [label_compliance_review]
    related_signals_events: [COMP_LabellingRuleChange, COMP_LabelArtworkChanged]   # reverse of master_data/signals_events.yaml related_kpis for PanelBasisKnownShare

  - id: MandatoryNutrientCompleteness
    name: FSSAI Mandatory Nutrient Completeness
    description: Share of active SKUs with no FSSAI-mandatory nutrient left blank on the panel.
    owner: compliance_team
    applies_to: Product
    unit: percentage
    target: { value: 100, comparison: gte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(COUNTIF(MANDATORY_NUTRIENTS_BLANK IS NULL) * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_LISTING_PACKAGE`
        WHERE IS_ACTIVE
      view: V_LISTING_PACKAGE
      column: MANDATORY_NUTRIENTS_BLANK
    refresh: { cache_ttl: 24h }
    related_processes: [label_compliance_review]
    related_signals_events: [COMP_LabellingRuleChange, COMP_LabelArtworkChanged]   # reverse of master_data/signals_events.yaml related_kpis for MandatoryNutrientCompleteness

  # ---- Shelf life & availability (V_STOCKED_AT / LOW_STOCK_CONFIG) ----
  - id: WastageRisk
    name: Wastage Risk (units at risk)
    description: >-
      Units expiring inside the store's configured risk window — the liquidation trigger.
      Target 0 is a true north, so this reads red until the network actually clears.
    owner: supply_chain_team
    applies_to: Store
    unit: units
    target: { value: 0, comparison: eq }
    computed_by:
      source: bigquery
      network_query: |
        SELECT SUM(QTY_EXPIRING_WITHIN_RISK_DAYS) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT`
      view: V_STOCKED_AT
      column: QTY_EXPIRING_WITHIN_RISK_DAYS
    refresh: { cache_ttl: 6h }
    related_processes: [shelf_life_risk_monitoring, demand_forecast]
    related_signals_events: [OPS_ShelfLifeThresholdReached]   # reverse of master_data/signals_events.yaml related_kpis for WastageRisk

  - id: ExpiryValueAtRisk
    name: Expiry Value at Risk (INR)
    description: Rupee cost of the stock about to be binned network-wide — units at risk priced at unit COGS.
    owner: supply_chain_team
    applies_to: Product
    unit: inr
    target: { value: 25000, comparison: lte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(SUM(s.QTY_EXPIRING_WITHIN_RISK_DAYS * p.TOTAL_COGS_INR), 0) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT` s
        JOIN `gen-lang-client-0520145261.ctx_upside_master_data.V_PRODUCT_ENRICHED` p
          ON p.SKU = s.SKU_ID
    refresh: { cache_ttl: 6h }
    related_processes: [demand_forecast]
    related_signals_events: [OPS_ShelfLifeThresholdReached]   # reverse of master_data/signals_events.yaml related_kpis for ExpiryValueAtRisk

  - id: ExpiredStockUnits
    name: Expired Stock on the Books (units)
    description: >-
      Units already past expiry and still carried. Both shelf-life processes filter
      days_to_expiry >= 0, so nothing else watches this.
    owner: supply_chain_team
    applies_to: Store
    unit: units
    target: { value: 0, comparison: eq }
    computed_by:
      source: bigquery
      network_query: |
        SELECT SUM(EXPIRED_STOCK) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT`
      view: V_STOCKED_AT
      column: EXPIRED_STOCK
    refresh: { cache_ttl: 6h }
    related_processes: [shelf_life_risk_monitoring, demand_forecast]
    related_signals_events: [OPS_ShelfLifeThresholdReached]   # reverse of master_data/signals_events.yaml related_kpis for ExpiredStockUnits

  - id: LowStockIncidenceRate
    name: Low-Stock Incidence Rate
    description: >-
      Share of stocked (SKU, store) pairs at or under their configured min_count. The
      counterweight to cutting wastage — expiry risk removed by understocking is not a win.
    owner: supply_chain_team
    applies_to: Store
    unit: percentage
    target: { value: 5, comparison: lte }
    computed_by:
      source: bigquery
      # Read off LOW_STOCK_CONFIG, not LOW_STOCK_FLAG: the flag's truthy values are unverified.
      network_query: |
        SELECT ROUND(COUNTIF(s.TOTAL_STOCK <= c.MIN_COUNT) * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT` s
        JOIN `gen-lang-client-0520145261.bronze.LOW_STOCK_CONFIG` c
          ON c.SKU_ID = s.SKU_ID AND c.STORE_ID = s.MASTER_STORE_ID
    refresh: { cache_ttl: 6h }
    related_processes: [shelf_life_risk_monitoring, demand_forecast]
    related_signals_events: [OPS_InventoryBelowSafetyStock]   # reverse of master_data/signals_events.yaml related_kpis for LowStockIncidenceRate

  - id: CriticalLowCount
    name: Critically-Low (SKU, store) Pairs
    description: Pairs at or under absolute_risk_count — the hard floor, not the reorder point.
    owner: supply_chain_team
    applies_to: Store
    unit: count
    target: { value: 0, comparison: eq }
    computed_by:
      source: bigquery
      network_query: |
        SELECT COUNTIF(s.TOTAL_STOCK <= c.ABSOLUTE_RISK_COUNT) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.V_STOCKED_AT` s
        JOIN `gen-lang-client-0520145261.bronze.LOW_STOCK_CONFIG` c
          ON c.SKU_ID = s.SKU_ID AND c.STORE_ID = s.MASTER_STORE_ID
    refresh: { cache_ttl: 6h }
    related_processes: [shelf_life_risk_monitoring, demand_forecast]
    related_signals_events: [OPS_InventoryBelowSafetyStock]   # reverse of master_data/signals_events.yaml related_kpis for CriticalLowCount

  - id: SellThroughGap
    name: Sell-Through Gap on At-Risk Stock (units)
    description: >-
      On-hand minus the 3-day forecast for stock inside the expiry window. Positive means
      we ordered more than will sell — the over-ordering the rescue desk exists to stop.
    owner: supply_chain_team
    applies_to: Product
    unit: units
    target: { value: 0, comparison: lte }
    computed_by:
      source: bigquery
      network_query: |
        WITH latest AS (
          SELECT store_id, product_sku, available_quantity, expiry_date
          FROM `gen-lang-client-0520145261.bronze.STORE_INVENTORY_DAILY`
          QUALIFY snapshot_date = MAX(snapshot_date) OVER (PARTITION BY store_id)
        ),
        inv AS (
          SELECT store_id, product_sku,
                 SUM(available_quantity) AS on_hand,
                 MIN(SAFE_CAST(expiry_date AS DATE)) AS soonest
          FROM latest
          WHERE available_quantity > 0
          GROUP BY store_id, product_sku
        ),
        fc AS (
          SELECT MASTER_STORE_ID AS store_id, SKU_ID AS product_sku,
                 SUM(PREDICTED_SALES_QUANTITY) AS fc3
          FROM `gen-lang-client-0520145261.gold.FORECAST_RESULTS_UPDATE`
          WHERE IS_LATEST_FORECAST AND DAYS_AHEAD BETWEEN 1 AND 3
          GROUP BY store_id, product_sku
        )
        SELECT ROUND(AVG(i.on_hand - IFNULL(f.fc3, 0)), 1) AS VALUE
        FROM inv i
        LEFT JOIN fc f ON f.store_id = i.store_id AND f.product_sku = i.product_sku
        WHERE DATE_DIFF(i.soonest, CURRENT_DATE(), DAY) BETWEEN 0 AND 3
    refresh: { cache_ttl: 6h }
    related_processes: [demand_forecast]
    related_signals_events: [OPS_ShelfLifeThresholdReached]   # reverse of master_data/signals_events.yaml related_kpis for SellThroughGap

  # ---- Customer voice (CUSTOMER_REVIEW_EVENTS / CUSTOMER_COMPLAINT_EVENTS) ----
  - id: AvgStoreRating
    name: Average Store Rating
    description: Mean customer star rating across stores.
    owner: cx_team
    applies_to: Store
    unit: rating
    target: { value: 4.0, comparison: gte }
    computed_by:
      source: bigquery
      table: CUSTOMER_REVIEW_EVENTS
      column: STAR_RATING
    refresh: { cache_ttl: 12h }
    related_processes: [customer_review_aggregation_and_triage]

  - id: LowRatingShare
    name: Low-Rating Share (<= 3 stars)
    description: >-
      Share of reviews at 3 stars or below over 90 days. The mean averages the tail away;
      this is the band the triage process actually acts on.
    owner: cx_team
    applies_to: Store
    unit: percentage
    target: { value: 15, comparison: lte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(COUNTIF(STAR_RATING <= 3) * 100.0 / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.CUSTOMER_REVIEW_EVENTS`
        WHERE SAFE_CAST(REVIEW_DATE AS DATE) >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
    refresh: { cache_ttl: 12h }
    related_processes: [customer_review_aggregation_and_triage]
    related_signals_events: [QA_PublicComplaintTrend, QA_ConsumerComplaintsAboveThreshold]   # reverse of master_data/signals_events.yaml related_kpis for LowRatingShare

  - id: OpsComplaintShare
    name: Last-Mile Complaint Share
    description: >-
      Share of complaints over 60 days owned by the dark-store partner rather than the
      product — late, wrong, missing or damaged.
    owner: cx_team
    applies_to: Store
    unit: percentage
    target: { value: 30, comparison: lte }
    computed_by:
      source: bigquery
      # Case-insensitive regex on purpose: the process's `contains` buckets are case-sensitive.
      network_query: |
        SELECT ROUND(COUNTIF(REGEXP_CONTAINS(LOWER(IFNULL(ISSUE_TYPE, '')),
                     r'late|delay|deliver|packag|spillage|wrong|missing')) * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.CUSTOMER_COMPLAINT_EVENTS`
        WHERE SAFE_CAST(COMPLAINT_RECEIVED_AT AS DATE)
              >= DATE_SUB(CURRENT_DATE(), INTERVAL 60 DAY)
    refresh: { cache_ttl: 12h }
    related_signals_events: [QA_PublicComplaintTrend, QA_ConsumerComplaintsAboveThreshold]   # reverse of master_data/signals_events.yaml related_kpis for OpsComplaintShare

  - id: StoresOverOpsComplaintBar
    name: Stores Over the Ops-Complaint Bar
    description: Stores with 3 or more last-mile complaints in 60 days — the escalation bar itself.
    owner: cx_team
    applies_to: Store
    unit: count
    target: { value: 0, comparison: eq }
    computed_by:
      source: bigquery
      network_query: |
        WITH per_store AS (
          SELECT MASTER_STORE_ID,
                 COUNTIF(REGEXP_CONTAINS(LOWER(IFNULL(ISSUE_TYPE, '')),
                         r'late|delay|deliver|packag|spillage|wrong|missing')) AS ops
          FROM `gen-lang-client-0520145261.bronze.CUSTOMER_COMPLAINT_EVENTS`
          WHERE SAFE_CAST(COMPLAINT_RECEIVED_AT AS DATE)
                >= DATE_SUB(CURRENT_DATE(), INTERVAL 60 DAY)
          GROUP BY MASTER_STORE_ID
        )
        SELECT COUNTIF(ops >= 3) AS VALUE FROM per_store
    refresh: { cache_ttl: 12h }
    related_signals_events: [QA_ConsumerComplaintsAboveThreshold]   # reverse of master_data/signals_events.yaml related_kpis for StoresOverOpsComplaintBar

  - id: NearExpiryComplaintShare
    name: Near-Expiry Product Complaint Share
    description: >-
      Share of product complaints where the batch on hand that day was already inside its
      shelf-life threshold. The only measure of a freshness failure reaching a customer.
    owner: production_team
    applies_to: Product
    unit: percentage
    target: { value: 10, comparison: lte }
    computed_by:
      source: bigquery
      # Replicates the triage process's chain: complaint -> order line -> that day's batch
      # -> the pair's min_days_shelf_life, falling back to 2 days when unconfigured.
      network_query: |
        WITH product_complaints AS (
          SELECT ORDER_ID
          FROM `gen-lang-client-0520145261.bronze.CUSTOMER_COMPLAINT_EVENTS`
          WHERE SAFE_CAST(COMPLAINT_RECEIVED_AT AS DATE)
                >= DATE_SUB(CURRENT_DATE(), INTERVAL 60 DAY)
            AND REGEXP_CONTAINS(LOWER(IFNULL(ISSUE_TYPE, '')), r'quality|taste|fresh|expir')
            AND ORDER_ID IS NOT NULL
        ),
        lines AS (
          SELECT DISTINCT ONLINE_ORDER_ID, STORE_ID, SKU_ID,
                 SAFE_CAST(ORDER_DATE AS DATE) AS order_date
          FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`
          WHERE ORDER_STATE <> 'Cancelled'
        ),
        batch AS (
          SELECT store_id, product_sku,
                 SAFE_CAST(snapshot_date AS DATE) AS snap,
                 MIN(SAFE_CAST(expiry_date AS DATE)) AS soonest
          FROM `gen-lang-client-0520145261.bronze.STORE_INVENTORY_DAILY`
          WHERE available_quantity > 0
          GROUP BY store_id, product_sku, snap
        ),
        traced AS (
          SELECT DATE_DIFF(bt.soonest, l.order_date, DAY) AS life_left,
                 IFNULL(c.MIN_DAYS_SHELF_LIFE, 2) AS threshold
          FROM product_complaints pc
          JOIN lines l ON l.ONLINE_ORDER_ID = pc.ORDER_ID
          LEFT JOIN batch bt
            ON bt.store_id = l.STORE_ID AND bt.product_sku = l.SKU_ID
           AND bt.snap = l.order_date
          LEFT JOIN `gen-lang-client-0520145261.bronze.LOW_STOCK_CONFIG` c
            ON c.SKU_ID = l.SKU_ID AND c.STORE_ID = l.STORE_ID
        )
        SELECT ROUND(COUNTIF(life_left IS NOT NULL AND life_left <= threshold) * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM traced
    refresh: { cache_ttl: 12h }
    related_processes: [customer_review_aggregation_and_triage, shelf_life_risk_monitoring]
    related_signals_events: [QA_PublicComplaintTrend]   # reverse of master_data/signals_events.yaml related_kpis for NearExpiryComplaintShare

  # ---- Demand planning & marketing spend ----
  - id: ForecastAccuracy
    name: Demand Forecast Accuracy
    description: >-
      100 - MAPE against realised sales per (SKU, store, day) over 30 days. Can go negative:
      a forecast worse than useless should read worse than zero.
    owner: demand_planning_team
    applies_to: Product
    unit: percentage
    target: { value: 80, comparison: gte }
    computed_by:
      source: bigquery
      # Thin by construction: only IS_LATEST_FORECAST rows are retained, so there is
      # little forecast history to score against actuals.
      network_query: |
        WITH fc AS (
          SELECT SKU_ID, MASTER_STORE_ID,
                 SAFE_CAST(FORECAST_DATE AS DATE) AS d,
                 SUM(PREDICTED_SALES_QUANTITY) AS predicted
          FROM `gen-lang-client-0520145261.gold.FORECAST_RESULTS_UPDATE`
          WHERE IS_LATEST_FORECAST
          GROUP BY SKU_ID, MASTER_STORE_ID, d
        ),
        act AS (
          SELECT SKU_ID, STORE_ID,
                 SAFE_CAST(ORDER_DATE AS DATE) AS d,
                 SUM(QUANTITY) AS actual
          FROM `gen-lang-client-0520145261.silver.BUSINESS_ANALYTICS`
          WHERE ORDER_STATE <> 'Cancelled'
          GROUP BY SKU_ID, STORE_ID, d
        )
        SELECT ROUND(100 - AVG(ABS(SAFE_DIVIDE(f.predicted - a.actual,
                                               NULLIF(a.actual, 0))) * 100), 1) AS VALUE
        FROM fc f
        JOIN act a
          ON a.SKU_ID = f.SKU_ID AND a.STORE_ID = f.MASTER_STORE_ID AND a.d = f.d
        WHERE a.actual > 0
          AND f.d >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
    refresh: { cache_ttl: 12h }
    related_processes: [demand_forecast]
    related_signals_events: [OPS_WeatherAnomaly, OPS_FestivalEventDemandSignal, OPS_ExternalDemandTrend, OPS_ForecastVarianceAboveTolerance]   # reverse of master_data/signals_events.yaml related_kpis for ForecastAccuracy

  - id: ForecastCoverageDays
    name: Forecast Coverage (days ahead)
    description: >-
      How far into the future the latest forecast run reaches. Accuracy on a forecast that
      stops in the past plans nothing — this is what makes a stalled job visible.
    owner: demand_planning_team
    applies_to: Product
    unit: days
    target: { value: 3, comparison: gte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT DATE_DIFF(MAX(SAFE_CAST(FORECAST_DATE AS DATE)), CURRENT_DATE(), DAY) AS VALUE
        FROM `gen-lang-client-0520145261.gold.FORECAST_RESULTS_UPDATE`
        WHERE IS_LATEST_FORECAST
    refresh: { cache_ttl: 6h }
    related_processes: [demand_forecast]
    related_signals_events: [OPS_ForecastVarianceAboveTolerance]   # reverse of master_data/signals_events.yaml related_kpis for ForecastCoverageDays

  - id: BlendedCampaignRoi
    name: Blended Campaign ROI
    description: >-
      Ad sales over ad spend across every running campaign. Spend-weighted, never an average
      of per-campaign ROI — a tiny-spend outlier must not outvote a flagship.
    owner: marketing_team
    applies_to: Campaign
    unit: ratio
    target: { value: 1.5, comparison: gte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(SAFE_DIVIDE(SUM(AD_SALES_RS), SUM(AD_SPEND_RS)), 2) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.V_STORE_CAMPAIGN_CURRENT`
    refresh: { cache_ttl: 6h }
    related_processes: [campaign_planning_optimisation]
    related_signals_events: [MKT_CampaignPerformanceBelowTarget, MKT_CampaignOptimizationReviewDue, MKT_CampaignPostMortemDue]   # reverse of master_data/signals_events.yaml related_kpis for BlendedCampaignRoi

  - id: ZeroReturnAdSpend
    name: Zero-Return Ad Spend (INR)
    description: Money on campaigns returning literally nothing, above the process's own 200-rupee floor.
    owner: marketing_team
    applies_to: Campaign
    unit: inr
    target: { value: 0, comparison: lte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(SUM(IF(IFNULL(ROI, 0) = 0 AND AD_SPEND_RS >= 200,
                            AD_SPEND_RS, 0)), 0) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.V_STORE_CAMPAIGN_CURRENT`
    refresh: { cache_ttl: 6h }
    related_processes: [campaign_planning_optimisation]
    related_signals_events: [MKT_CampaignPerformanceBelowTarget, MKT_CampaignBudgetThresholdReached, MKT_CampaignOptimizationReviewDue]   # reverse of master_data/signals_events.yaml related_kpis for ZeroReturnAdSpend

  - id: AdsConversionGapPct
    name: Ads Conversion Gap (pp)
    description: >-
      Percentage points by which ad-driven menu-to-order conversion trails the store's
      overall rate. The process treats a 5-point gap as a campaign failing on its own terms.
    owner: marketing_team
    applies_to: Campaign
    unit: percentage
    target: { value: 5, comparison: lte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(AVG(OVERALL_M2O_PCT - ADS_M2O_PCT), 1) AS VALUE
        FROM `gen-lang-client-0520145261.bronze.V_STORE_CAMPAIGN_CURRENT`
        WHERE ADS_M2O_PCT IS NOT NULL AND OVERALL_M2O_PCT IS NOT NULL
    refresh: { cache_ttl: 6h }
    related_processes: [campaign_planning_optimisation]
    related_signals_events: [MKT_CampaignPerformanceBelowTarget, MKT_CampaignOptimizationReviewDue]   # reverse of master_data/signals_events.yaml related_kpis for AdsConversionGapPct

  - id: MarginPct
    name: Portfolio Gross Margin %
    description: >-
      (MRP - COGS) / MRP across active SKUs, revenue-weighted. Previously averaged MRP_INR
      and labelled it a percentage, which read as permanently on target.
    owner: portfolio_team
    applies_to: Product
    unit: percentage
    target: { value: 60, comparison: gte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(SAFE_DIVIDE(SUM(MRP_INR - TOTAL_COGS_INR),
                                 NULLIF(SUM(MRP_INR), 0)) * 100, 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_PRODUCT_ENRICHED`
        WHERE IS_ACTIVE AND MRP_INR > 0
    refresh: { cache_ttl: 24h }
    related_signals_events: [NPD_FormulationCOGSAboveTarget, FIN_CommodityPriceMovement, FIN_GrossMarginBelowFloor, FIN_COGSAboveThreshold, FIN_SKUProfitabilityBelowThreshold]   # reverse of master_data/signals_events.yaml related_kpis for MarginPct

  # ---- Innovation pipeline (V_IDEA_PRIORITY_INPUTS, active briefs only) ----
  - id: PipelineAgingDays
    name: Pipeline Aging (days in stage)
    description: Mean days an active brief has sat in its current stage.
    owner: npd_team
    applies_to: Idea
    unit: days
    target: { value: 45, comparison: lte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(AVG(DAYS_IN_STAGE), 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_IDEA_PRIORITY_INPUTS`
      view: V_IDEA_PRIORITY_INPUTS
      column: DAYS_IN_STAGE
    refresh: { cache_ttl: 24h }
    related_processes: [innovation_pipeline_prioritisation, idea_capture_triage]
    related_signals_events: [NPD_NPDStageGateReached]   # reverse of master_data/signals_events.yaml related_kpis for PipelineAgingDays

  - id: StalledBriefCount
    name: Stalled Brief Count
    description: Active briefs past 90 days in stage — the top rung of the scoring ladder, i.e. undecided.
    owner: npd_team
    applies_to: Idea
    unit: count
    target: { value: 0, comparison: eq }
    computed_by:
      source: bigquery
      network_query: |
        SELECT COUNTIF(DAYS_IN_STAGE >= 90) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_IDEA_PRIORITY_INPUTS`
    refresh: { cache_ttl: 24h }
    related_processes: [innovation_pipeline_prioritisation]
    related_signals_events: [NPD_NPDStageGateReached]   # reverse of master_data/signals_events.yaml related_kpis for StalledBriefCount

  - id: BriefScorableShare
    name: Scorable Brief Share
    description: >-
      Share of active briefs with a target COGS and a stage date. Below this the ranking
      is scored on midpoints, which is what the process escalates on.
    owner: npd_team
    applies_to: Idea
    unit: percentage
    target: { value: 90, comparison: gte }
    computed_by:
      source: bigquery
      network_query: |
        SELECT ROUND(COUNTIF(COGS_FIT <> 'UNKNOWN' AND DAYS_IN_STAGE IS NOT NULL) * 100.0
                     / NULLIF(COUNT(*), 0), 1) AS VALUE
        FROM `gen-lang-client-0520145261.ctx_upside_master_data.V_IDEA_PRIORITY_INPUTS`
      view: V_IDEA_PRIORITY_INPUTS
      column: COGS_FIT
    refresh: { cache_ttl: 24h }
    related_processes: [innovation_pipeline_prioritisation]
