version: 1

# KPI definitions. `computed_by` is metadata (projected as meta.KPI); the live
# query layer is wired later. Compliance KPIs are graph-computed (no source).

kpis:
  # ---- Operations / Supply-Chain (the first demo) ----------------------
  - id: WastageRisk
    name: Wastage Risk (units at risk)
    description: Quantity expiring within the store's risk window — the liquidation trigger.
    owner: supply_chain_team_lead
    applies_to: Store
    unit: units
    target: { value: 0, comparison: eq }
    computed_by:
      source: bigquery
      view: V_STOCKED_AT
      column: QTY_EXPIRING_WITHIN_RISK_DAYS
    refresh: { cache_ttl: 24h }
    related_processes: [shelf_life_liquidation]

  - id: ForecastAccuracy
    name: Demand Forecast Accuracy
    description: How close the ML forecast tracked actual sales (100 - MAPE). Higher is better.
    owner: demand_planning_team_lead
    applies_to: Product
    unit: percentage
    target: { value: 80, comparison: gte }
    computed_by:
      source: bigquery
      query_template: |
        -- forecast vs BUSINESS_ANALYTICS actuals, per SKU, trailing 30 days
        SELECT SKU_ID, 100 - AVG(ABS(err)) AS accuracy_pct FROM ...
    related_processes: [shelf_life_liquidation, demand_forecast]

  - id: AvgStoreRating
    name: Average Store Rating
    description: Mean customer star rating for a store.
    owner: cx_team_lead
    applies_to: Store
    unit: rating
    target: { value: 4.0, comparison: gte }
    computed_by:
      source: bigquery
      table: CUSTOMER_REVIEW_EVENTS
      column: STAR_RATING

  # ---- Portfolio / margin ----------------------------------------------
  - id: MarginPct
    name: Gross Margin %
    description: (MRP - COGS) / MRP, base or per-channel.
    owner: portfolio_team_lead
    applies_to: Product
    unit: percentage
    target: { value: 60, comparison: gte }
    computed_by:
      source: bigquery
      view: V_PRODUCT_ENRICHED
      column: MRP_INR

  # ---- Compliance (graph-computed; no warehouse source) ----------------
  - id: PortfolioComplianceScore
    name: Portfolio Compliance Score
    description: Share of active SKUs with no restricted ingredient and all claims substantiated.
    owner: compliance_team
    applies_to: Product
    unit: percentage
    target: { value: 100, comparison: gte }
    related_processes: [regulation_impact_analysis]

  - id: ClaimSubstantiationRate
    name: Claim Substantiation Rate
    description: Substantiated claims / total claims, per SKU.
    owner: compliance_team
    applies_to: Product
    unit: percentage
    target: { value: 100, comparison: gte }

  - id: CertificationDaysToExpiry
    name: Certification Days To Expiry
    description: Days until a certificate lapses. Under 30 triggers the renewal workflow.
    owner: compliance_team_lead
    applies_to: Certification
    unit: days
    target: { value: 30, comparison: gte }

  - id: ListingCoverage
    name: Listing Coverage
    description: Applicable channels a SKU is live on / target channels.
    owner: sales_team_lead
    applies_to: Product
    unit: percentage
    target: { value: 90, comparison: gte }
