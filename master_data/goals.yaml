version: 1

# Goal tree: company goal -> business areas -> the specific things teams work on.
# Every  and  id here must exist, or apply fails.

version: 1
title: Business goals
description: What the business is trying to achieve, who owns each part, and the numbers
  that show whether it is working.
source: Product master operating plan
steward: portfolio_team
review_cadence: Monthly operating review
goals:
- id: grow_profitably
  name: Grow profitably
  kind: enterprise
  description: Sell more without wasting stock, overspending on ads, or guessing at
    new products.
  horizon: FY26
  owner: executive_leadership
  contributors:
  - supply_chain_team
  - cx_team
  - marketing_team
  - demand_planning_team
  - npd_team
- id: reduce_stock_wastage
  parent: grow_profitably
  name: Reduce stock wastage
  kind: strategic
  description: Sell short shelf-life products before they expire, and stop ordering
    more than we can sell.
  horizon: FY26
  owner: supply_chain_team
  contributors:
  - demand_planning_team
  applies_to:
  - Products
  - Channel
- id: improve_customer_satisfaction
  parent: grow_profitably
  name: Improve customer satisfaction
  kind: strategic
  description: Fix what customers complain about, and know whether the problem was
    the product or the delivery.
  horizon: FY26
  owner: cx_team
  contributors:
  - production_team
  - demand_planning_team
  applies_to:
  - Channel
- id: plan_and_spend_on_data
  parent: grow_profitably
  name: Plan and spend using real data
  kind: strategic
  description: Use an accurate forecast to plan stock, and put ad money only where
    it earns a return.
  horizon: FY26
  owner: demand_planning_team
  contributors:
  - marketing_team
  - supply_chain_team
  applies_to:
  - Products
  - Channel
  - Campaigns
- id: launch_new_products_faster
  parent: grow_profitably
  name: Launch new products faster
  kind: strategic
  description: Rank the new product ideas we already have and decide on them, instead
    of letting them sit. About 38 ideas are waiting.
  horizon: FY26
  owner: npd_team
  applies_to:
  - Products
- id: reduce_expiring_stock
  parent: reduce_stock_wastage
  name: Reduce expiring stock
  kind: operational
  description: Cut the number of units, and the rupee value, of stock sitting close
    to its expiry date.
  horizon: FY26
  owner: supply_chain_team
  contributors:
  - demand_planning_team
  applies_to:
  - Products
  - Channel
  kpis:
  - kpi: WastageRisk
    aggregation: sum
    cadence: Daily
  - kpi: ExpiryValueAtRisk
    aggregation: sum
    cadence: Daily
  processes:
  - shelf_life_risk_monitoring
  - demand_forecast
- id: avoid_stock_outs
  parent: reduce_stock_wastage
  name: Avoid stock-outs
  kind: operational
  description: Keep enough stock at every store. Ordering less would cut wastage but
    leave shelves empty, so this is measured alongside it.
  horizon: FY26
  owner: supply_chain_team
  contributors:
  - demand_planning_team
  applies_to:
  - Products
  - Channel
  kpis:
  - kpi: LowStockIncidenceRate
    aggregation: avg
    cadence: Daily
  - kpi: CriticalLowCount
    aggregation: sum
    cadence: Daily
  processes:
  - shelf_life_risk_monitoring
  - demand_forecast
- id: remove_expired_stock
  parent: reduce_stock_wastage
  name: Remove expired stock
  kind: operational
  description: Make sure stock that has already expired does not stay in the system.
    Nothing checks this today.
  horizon: FY26
  owner: supply_chain_team
  applies_to:
  - Products
  - Channel
  kpis:
  - kpi: ExpiredStockUnits
    aggregation: sum
    cadence: Daily
  processes:
  - shelf_life_risk_monitoring
  - demand_forecast
- id: dont_sell_near_expiry_stock
  parent: improve_customer_satisfaction
  name: Do not sell near-expiry stock
  kind: operational
  description: Make sure customers never receive a product that was already close
    to expiry when it was sold.
  horizon: FY26
  owner: production_team
  contributors:
  - supply_chain_team
  - cx_team
  applies_to:
  - Products
  - Channel
  kpis:
  - kpi: NearExpiryComplaintShare
    aggregation: avg
    cadence: Weekly
  - kpi: AvgStoreRating
    aggregation: avg
    cadence: Weekly
  processes:
  - customer_review_aggregation_and_triage
  - shelf_life_risk_monitoring
- id: reduce_low_ratings
  parent: improve_customer_satisfaction
  name: Reduce low ratings
  kind: operational
  description: Bring down the share of reviews rated 3 stars or below. A good average
    can still hide a lot of unhappy customers.
  horizon: FY26
  owner: cx_team
  applies_to:
  - Channel
  kpis:
  - kpi: LowRatingShare
    aggregation: avg
    cadence: Weekly
  - kpi: AvgStoreRating
    aggregation: avg
    cadence: Weekly
  processes:
  - customer_review_aggregation_and_triage
- id: improve_forecast_accuracy
  parent: plan_and_spend_on_data
  name: Improve forecast accuracy
  kind: operational
  description: Make the demand forecast match what actually sells, and make sure it
    always covers upcoming days. An old forecast can still look accurate.
  horizon: FY26
  owner: demand_planning_team
  contributors:
  - supply_chain_team
  applies_to:
  - Products
  - Channel
  kpis:
  - kpi: ForecastAccuracy
    aggregation: avg
    cadence: Weekly
  - kpi: ForecastCoverageDays
    aggregation: min
    cadence: Daily
  processes:
  - demand_forecast
- id: cut_wasted_ad_spend
  parent: plan_and_spend_on_data
  name: Cut wasted ad spend
  kind: operational
  description: Stop spending on campaigns that bring no sales and move that budget
    to the ones that work. 460 campaigns currently return nothing.
  horizon: FY26
  owner: marketing_team
  applies_to:
  - Campaigns
  - Channel
  kpis:
  - kpi: BlendedCampaignRoi
    aggregation: avg
    cadence: Weekly
  - kpi: ZeroReturnAdSpend
    aggregation: sum
    cadence: Weekly
  processes:
  - campaign_planning_optimisation
- id: improve_ad_conversion
  parent: plan_and_spend_on_data
  name: Improve ad conversion
  kind: operational
  description: Make sure customers who arrive from an ad order as often as our normal
    customers do.
  horizon: FY26
  owner: marketing_team
  applies_to:
  - Campaigns
  - Channel
  kpis:
  - kpi: AdsConversionGapPct
    aggregation: avg
    cadence: Weekly
  processes:
  - campaign_planning_optimisation
- id: decide_on_pending_ideas
  parent: launch_new_products_faster
  name: Decide on pending ideas
  kind: operational
  description: Cut how long a new product idea waits without a decision. One idea
    has been waiting 134 days.
  horizon: FY26
  owner: npd_team
  applies_to:
  - Products
  kpis:
  - kpi: PipelineAgingDays
    aggregation: avg
    cadence: Weekly
  - kpi: StalledBriefCount
    aggregation: sum
    cadence: Weekly
  processes:
  - innovation_pipeline_prioritisation
  - idea_capture_triage
- id: complete_new_product_data
  parent: launch_new_products_faster
  name: Complete new product data
  kind: operational
  description: Make sure every idea has the target cost and date needed to rank it.
    Without them the ranking is a guess.
  horizon: FY26
  owner: npd_team
  applies_to:
  - Products
  kpis:
  - kpi: BriefScorableShare
    aggregation: avg
    cadence: Weekly
  processes:
  - innovation_pipeline_prioritisation
