# The external feeds catalog: data feeds ingested from outside the tenant (a
# system, API, or file drop) — the upstream source a signal or event is often
# derived from, though there is no edge linking a feed to the signals/events
# it produces today; each is a separate, independently-authored list.
# `id`, `name` and `source` are required by the apply-time schema; `source`
# is the upstream system/provider (e.g. "fssai.gov.in", "ERPNext", "Petpooja")
# — a free-text label like `cadence`/`format`, not a resolved integration
# reference. `entity_types` and `affected_kpis` are free-text labels, same
# treatment as above. `id` must be unique across the whole file. `cadence` is
# a free-text label (e.g. "hourly", "daily", "streaming") and `format`
# describes the feed's transport/shape (e.g. "REST", "CSV", "Kafka",
# "Webhook"). `owner` is a plain team/role id, the same convention KPIs and
# goals use.
#
# Sourced from the "Integration Required" column of the same tracker's Sheet1
# (Use Case list), not the "Demo events / signals" tab — that column names the
# feed each use case leans on. Several source rows only say "?" or a bare
# capability name with no concrete provider chosen yet (e.g. "News site ?",
# "External Data Provider"); those are transcribed here with
# cadence/format left as "not yet decided" rather than invented, same as this
# repo's constraints.yaml `rule: "documentation_only"` entries and the
# seasonal_campaign_planning.yaml convention of marking an unresolved input
# plainly instead of guessing. This is planning-stage data, not a live
# integration — the confirmed, extraction-backed sources are
# integrations/live_bq.yaml and integrations/pim_bq.yaml.

external_feeds:
  - id: FssaiRegulatoryGazetteFeed
    owner: compliance_team
    name: "FSSAI Regulatory Gazette Feed"
    source: "fssai.gov.in"
    description: "FSSAI gazette notifications, draft regulations and state-level advisories, scraped directly from fssai.gov.in. Feeds FSSAI / regulatory feed monitoring, regulation impact analysis, label compliance review, and new-product compliance pre-clearance."
    cadence: "continuous (per source use case: \"Continuous monitoring\")"
    format: "Web scrape (HTML)"
    entity_types: ["Regulation", "Ingredient", "Claim", "Product"]
    affected_kpis: ["Compliance Exposure", "Revenue at Risk"]

  - id: StateComplianceParserFeed
    owner: compliance_team
    name: "State-Level Compliance Portal Feed"
    source: "State FSSAI / food-safety authority portals (per state, provider not yet decided)"
    description: "State-level food-safety authority advisories and restrictions, parsed per state beyond central FSSAI coverage. Source tracker names it only as \"local complaince parser\" [sic] with no cadence decided."
    cadence: "not yet decided"
    format: "Web scrape"
    entity_types: ["Regulation", "Geography", "Product"]
    affected_kpis: ["Compliance Exposure"]

  - id: RegulatoryCompetitorNewsFeed
    owner: compliance_team
    name: "Regulatory & Competitor Enforcement News Feed"
    source: "News site (provider not yet decided)"
    description: "News-site monitoring for competitor FSSAI enforcement/recall actions and pre-rule legislative/advisory-committee signals. Source tracker marks the provider \"News site ?\" — not yet selected."
    cadence: "not yet decided"
    format: "not yet decided"
    entity_types: ["Competitor Product", "Regulation", "Category"]
    affected_kpis: ["Regulatory Risk Score"]

  - id: ComplianceOpsMessagingFeed
    owner: compliance_team
    name: "Compliance Ops Inbox (Email / WhatsApp)"
    source: "Email / WhatsApp"
    description: "Inbound dark-store FSSAI licence and supplier COA renewal documents/reminders over email and WhatsApp."
    cadence: "as-received"
    format: "Email / WhatsApp"
    entity_types: ["Licence", "Certification", "Supplier"]
    affected_kpis: ["Licence Coverage", "Supplier Compliance Rate"]

  - id: DtcCustomerMessagingFeed
    owner: marketing_team
    name: "DTC Customer Messaging Feed"
    source: "Email / WhatsApp / SMS"
    description: "Outbound/inbound DTC customer engagement over email, WhatsApp and SMS text."
