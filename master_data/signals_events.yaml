version: 1

# The signals & events catalog: external market/consumer signals and internal
# operational events, what each can trigger downstream, and the entity types/
# KPIs it touches. `downstream_events`, `entity_types` and `affected_kpis` are
# free-text labels (matched by `name` at apply time for the `downstream_events`
# graph edges) — they are not validated against ontology/entities.yaml or
# master_data/kpis.yaml, so this catalog can be authored ahead of (or
# independently from) those definitions.
#
# `kind` is either "Signal" (something observed, often external) or "Event"
# (something that happened, usually internal) — projected as meta.Signal /
# meta.Event nodes respectively. `id` must be unique across the whole file;
# `name` does not need to be — the same name can recur under a different
# `category` with a different meaning. `owner` is a plain team/role id, the
# same convention KPIs and goals use.
#
# Imported verbatim from the "Demo events / signals" tab of the solution-design
# tracker (Google Sheet: Genzoic AI Use Case & Signal/Event Tracker,
# gid=1856941780). Sheet columns map 1:1: Type -> category, Heading -> name,
# Signal/Event -> kind, Potential Downstream Events -> downstream_events,
# Impacted Entity Types -> entity_types, Affected KPI -> affected_kpis.
# Projected by ingest_ontology (see migrations/0004_signals_events_catalog.yaml)
# the same way policies/constraints.yaml projects as meta.Constraint.
#
# `related_processes` (real processes/*.yaml ids) and `related_kpis` (real
# master_data/kpis.yaml ids) are curated on top of the sheet import, NOT part
# of it -- added only where a process's own description or a KPI's own
# applies_to/description is an unambiguous match for that entry (e.g.
# COMP_ProductClaimChanged -> claims_validation; OPS_ShelfLifeThresholdReached
# -> shelf_life_risk_monitoring / WastageRisk). Both fields are optional and
# absent on most entries: this repo has only 22 processes and 28 KPIs built
# against 180 signals/events, so most entries genuinely have no real process
# or KPI to point to yet -- absence means "not built here yet", not "not
# reviewed". Never add an entry to either list without a real match; extend
# these only as new processes/KPIs are actually built.

