version: 1

# The signals & events catalog: external market/consumer signals and internal
# operational events, what each can trigger downstream, and the entity types/
# KPIs it touches. `downstream_events` and `affected_kpis` are free-text
# labels (matched by `name` at apply time for the `downstream_events` graph
# edges) — they are not validated against master_data/kpis.yaml or against
# each other, so this catalog can be authored ahead of (or independently
# from) those definitions.
#
# `entity_types`, unlike the two above, IS pruned to real ontology/entities.yaml
# `type` values only — every value left in any entity_types list resolves to a
# real declared node type. Two wording near-misses from the source sheet were
# normalized rather than dropped ("Competitor Product" -> "CompetitorProduct",
# "Consumer Segment" -> "CustomerSegment" — the real ontology type in each
# case, just spelled differently in the tracker). Everything else that didn't
# match a real type (SKU, Geography, Market, Warehouse, Factory, Batch,
# Contract, Formulation, Order, Shipment, Retailer, Distributor, ...) was
# removed rather than kept as unresolved text — those are real business
# concepts the source tracker references that simply aren't modeled as graph
# node types yet; re-add them here once/if they are. 16 entries end up with
# entity_types: [] as a result — an honest "nothing here resolves yet", same
# meaning as an absent related_processes/related_kpis.
#
# `kind` is either "Signal" (something observed, often external) or "Event"
# (something that happened, usually internal) — projected as meta.Signal /
# meta.Event nodes respectively. `id` must be unique across the whole file;
# `name` does not need to be — the same name can recur under a different
# `category` with a different meaning. `owner` is a plain team/role id, the
# same convention KPIs and goals use.
#
# Imported verbatim from the "Demo events / signals" tab of the solution-design
# tracker (Google Sheet: Genzoic AI Use Case & Signal/Event Tracker,
# gid=1856941780). Sheet columns map 1:1: Type -> category, Heading -> name,
# Signal/Event -> kind, Potential Downstream Events -> downstream_events,
# Impacted Entity Types -> entity_types, Affected KPI -> affected_kpis.
# Projected by ingest_ontology (see migrations/0004_signals_events_catalog.yaml)
# the same way policies/constraints.yaml projects as meta.Constraint.
#
# `related_processes` (real processes/*.yaml ids) and `related_kpis` (real
# master_data/kpis.yaml ids) are curated on top of the sheet import, NOT part
# of it -- this is the "Associated Process" / "Impacted KPIs" relationship
# from the tracker's own concept model (Sheet3), applied against the
# processes/KPIs actually built in this repo rather than the free-text
# `affected_kpis`/`downstream_events` the sheet itself carries. Two
# confidence tiers went in: an exact-match pass (e.g. COMP_ProductClaimChanged
# -> claims_validation, an word-for-word description match), a broader
# thematic pass (e.g. QA_ContaminationOutbreak -> competitor_enforcement_signals,
# same monitoring domain, not identical wording), and a KPI near-match pass:
# affected_kpis text that's a wording variant of a real KPI's own name --
# "Forecast Accuracy" (sheet) vs. "Demand Forecast Accuracy" (ForecastAccuracy's
# real name), "Gross Margin" vs. "Portfolio Gross Margin %" (MarginPct) -- gets
# related_kpis pointed at that real KPI. affected_kpis itself is untouched
# (321 mentions, 0 exact matches to the 28 real KPIs). Whether the other 213
# unique concepts (e.g. "Opportunity Score", "COGS", "Search Growth") have
# real BigQuery columns/tables to eventually build a KPI from
# (gen-lang-client-0520145261's bronze/silver/gold/ctx_upside_master_data)
# is an open question -- a bulk schema pull across those datasets to check
# was blocked by this session's own safety tooling as a bulk-extraction-shaped
# use of a live service-account credential; it needs a narrower, explicit
# per-candidate check instead of a blanket dump. Both fields stay optional
# and absent on most entries: this repo has only 22 processes and 28 KPIs
# built against 180 signals/events, so most entries genuinely have no real
# process or KPI to point to yet (all of Procurement & Suppliers and
# Competitive & Market Intelligence, most of Sales & Channels and Commercial
# & Financial Performance) -- absence means "not built here yet", not "not
# reviewed". Never point either list at a process/KPI id that doesn't
# actually exist in this repo -- extend as new ones are actually built.
#
# Both edges are now mirrored back on the target side, so the relationship is
# traversable in both directions regardless of what the graph engine does
# with directed edges at query time: every processes/*.yaml entry named by a
# related_processes list carries the reverse as `related_signals_events`
# (right before its `metadata:` block), and every master_data/kpis.yaml entry
# named by a related_kpis list carries the same field name next to its own
# `related_processes`. These reverse fields are mechanically derived from
# the two lists here -- regenerate them from this file if related_processes/
# related_kpis ever change, don't hand-edit them out of sync.
#
# `source`, `cadence`, `format` (on every signals_events entry) and
# `category`, `kind: Signal` (every external_feeds entry is treated as a
# Signal -- a feed IS an ongoing external signal source) give both lists the
# SAME field set, so every entry -- Signal, Event, or the feed entries that
# carry `kind: Signal` too -- carries who/what it's from, how often it
# arrives, and what shape it's in, regardless of which list it's authored
# in. These are NOT tracker-sourced --
# the original sheet import never had a cadence/format/source column for
# signals/events or a category column for feeds. They're authored here:
# for a signals_events entry with a `sourced_from_feeds` link, its
# source/cadence/format are inherited verbatim from that feed (the one case
# with a real answer); for an Event with no feed link, they're
# "internal" / "event-triggered" / "system event" (an internal occurrence
# has no external pipe); for a Signal with no feed link, they're a
# per-category default (e.g. "Compliance & Regulatory" -> "Regulatory
# monitoring" / "continuous" / "Regulatory gazette / news scrape") -- a
# reasonable placeholder, not a verified integration. Every external_feeds
# entry's `category` is likewise inferred from its owner/description, one of
# the same 9 business categories used above. Two top-level keys
# (`signals_events:` / `external_feeds:`) are kept deliberately separate --
# a real apply-time schema difference exists between them (see
# f279469 "Fix external_feeds schema: add required source field"), so
# collapsing them into one list risks breaking `contextgraph apply` in a way
# nothing in this repo can verify. This is schema parity, not a structural
# merge.

