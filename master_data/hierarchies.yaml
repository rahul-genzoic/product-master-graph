version: 1

# Rollup hierarchies. Category members mirror DIM_CATEGORY; individual SKUs
# attach at runtime via the in_product_line / in_category edges (not enumerated).

hierarchies:
  - id: ProductCategory
    name: Product Category Hierarchy
    description: Category -> ProductLine taxonomy. Drives portfolio rollups (compliance, COGS, wastage).
    owner: portfolio_team
    levels:
      - { id: category,     label: Category,     order: 1 }
      - { id: product_line, label: "Product Line", order: 2 }
    members:
      # `attributes.owner` on desserts/snacks is a scoped-authority tag (not a
      # new fact — the whole-hierarchy `owner: portfolio_team` above already
      # names portfolio_team accountable for this taxonomy; this just points
      # that authority at portfolio_team's placeholder Lead role for two
      # categories, so the Organization page's scoped-responsibilities /
      # governed-scopes panels have something real to render). Remove once
      # per-category ownership is actually decided.
      - { id: desserts,      label: "Desserts",      level: category, attributes: { owner: portfolio_team_lead, assignment_label: "Category owner (placeholder)" } }
      - { id: health_bars,   label: "Health Bars",   level: category }
      - { id: snacks,        label: "Snacks",        level: category, attributes: { owner: portfolio_team_lead, assignment_label: "Category owner (placeholder)" } }
      - { id: mithai,        label: "Mithai",        level: category }
      - { id: savories,      label: "Savories",      level: category }
      - { id: dessert_bites, label: "Dessert Bites", level: category }

  - id: Geo
    name: Store Geographic Hierarchy
    description: Region -> City rollup for store, wastage & review KPIs.
    owner: supply_chain_team
    levels:
      - { id: region, label: Region, order: 1 }
      - { id: city,   label: City,   order: 2 }
    members:
      # See the ProductCategory note above — mumbai/pune's `attributes.owner`
      # is a placeholder scoped-authority tag pointed at supply_chain_team's
      # Lead role, not a new fact beyond the hierarchy-level owner already set.
      - { id: india,   label: "India",   level: region }
      - { id: mumbai,  label: "Mumbai",  level: city, parent: india, attributes: { owner: supply_chain_team_lead, assignment_label: "City owner (placeholder)" } }
      - { id: pune,    label: "Pune",    level: city, parent: india, attributes: { owner: supply_chain_team_lead, assignment_label: "City owner (placeholder)" } }
      - { id: delhi,   label: "Delhi",   level: city, parent: india }
      - { id: bengaluru, label: "Bengaluru", level: city, parent: india }

  - id: ChannelGroup
    name: Channel Grouping
    description: Online vs Offline grouping — reconciles the PIM channel list with live channel strings.
    owner: sales_team
    levels:
      - { id: mode,    label: Mode,    order: 1 }
      - { id: channel, label: Channel, order: 2 }
    members:
      # See the ProductCategory note above — online/offline's `attributes.owner`
      # is a placeholder scoped-authority tag pointed at sales_team's Lead
      # role, not a new fact beyond the hierarchy-level owner already set.
      - { id: online,  label: "Online",  level: mode, attributes: { owner: sales_team_lead, assignment_label: "Channel mode owner (placeholder)" } }
      - { id: offline, label: "Offline", level: mode, attributes: { owner: sales_team_lead, assignment_label: "Channel mode owner (placeholder)" } }
      - { id: swiggy,    label: "Swiggy",    level: channel, parent: online }
      - { id: zomato,    label: "Zomato",    level: channel, parent: online }
      - { id: blinkit,   label: "Blinkit",   level: channel, parent: online }
      - { id: zepto,     label: "Zepto",     level: channel, parent: online }
      - { id: instamart, label: "Instamart", level: channel, parent: online }
      - { id: d2c,       label: "D2C",       level: channel, parent: online }
      - { id: horeca,    label: "HoReCa",    level: channel, parent: offline }
      - { id: qsr,       label: "QSR",       level: channel, parent: offline }
      - { id: gifting,   label: "Gifting",   level: channel, parent: offline }

  # Org chart, reusing the same Hierarchy shape as the taxonomies above.
  # Reserved id "Organization" (see operations/organization.py,
  # _ORGANIZATION_HIERARCHY_ID) is what lets the Context Explorer's
  # organization view resolve each existing flat `owner:` string (used
  # throughout master_data/*.yaml and processes/*.yaml) into a real node —
  # subtype, reporting line, and (where tagged) scoped taxonomy authority —
  # instead of a bare, unclassified name.
  #
  # The "team" level is real (one node per flat owner id already in use
  # elsewhere in this tenant's config). "function" is a reasonable grouping
  # of those teams into 4 business units, not a confirmed org chart — revisit
  # if the tenant's actual division structure differs. The "role" and
  # "person" levels below carry a fictional demo roster (headcount requested
  # per team; names/emails invented for demo purposes, not a real HRIS
  # export) so the Governed-objects / organization view has something to
  # render. Replace with the tenant's actual roster (name/email/division/
  # authority) once real HR data is supplied — do not treat these names as
  # real people.
  - id: Organization
    name: Organization
    description: Reporting structure and accountability for this tenant's teams.
    levels:
      - { id: function, label: Function, order: 1 }
      - { id: team,     label: Team,     order: 2 }
      - { id: role,     label: Role,     order: 3 }
      - { id: person,   label: Person,   order: 4 }
    members:
      # Functions — grouping of the 10 real teams into 4 business units.
      - { id: commercial_function,       label: "Commercial",        level: function, attributes: { source: yaml } }
      - { id: operations_function,       label: "Operations",        level: function, attributes: { source: yaml } }
      - { id: product_function,          label: "Product",           level: function, attributes: { source: yaml } }
      - { id: data_technology_function,  label: "Data & Technology", level: function, attributes: { source: yaml } }

      - { id: compliance_team,      label: "Compliance",       level: team, parent: product_function,          attributes: { division: "Compliance",      source: yaml } }
      - { id: cx_team,              label: "CX",               level: team, parent: commercial_function,       attributes: { division: "CX",               source: yaml } }
      - { id: data_team,            label: "Data",             level: team, parent: data_technology_function,  attributes: { division: "Data",             source: yaml } }
      - { id: demand_planning_team, label: "Demand Planning",  level: team, parent: operations_function,       attributes: { division: "Demand Planning",  source: yaml } }
      - { id: marketing_team,       label: "Marketing",        level: team, parent: commercial_function,       attributes: { division: "Marketing",        source: yaml } }
      - { id: npd_team,             label: "NPD",              level: team, parent: product_function,          attributes: { division: "NPD",              source: yaml } }
      - { id: portfolio_team,       label: "Portfolio",        level: team, parent: product_function,          attributes: { division: "Portfolio",        source: yaml } }
      - { id: procurement_team,     label: "Procurement",      level: team, parent: operations_function,       attributes: { division: "Procurement",      source: yaml } }
      - { id: sales_team,           label: "Sales",            level: team, parent: commercial_function,       attributes: { division: "Sales",            source: yaml } }
      - { id: supply_chain_team,    label: "Supply Chain",     level: team, parent: operations_function,       attributes: { division: "Supply Chain",     source: yaml } }

      # Demo roster roles — one "Lead" per team plus extra headcount per the
      # requested counts (Sales: 2, Marketing: 4, all other teams: 2). Lead
      # roles are authority_kind: leadership; the rest are individual
      # contributors (authority_kind: primary).
      - id: compliance_team_lead
        label: "Compliance Lead"
