# PIM integration — erp-set-up.ctx_upside_master_data (static product truth).
# Maps canonical FMCG entity types and relationships to BigQuery tables/views.
#
# Run:  contextgraph apply -C ./product-master-graph -s pim_bq

name: pim_bq
kind: bigquery

connection:
  project:     ${env.GCP_PROJECT}
  dataset:     ctx_upside_master_data
  credentials: ${env.GOOGLE_APPLICATION_CREDENTIALS_JSON}

entities:
  - type: Products
    table: V_PRODUCT_ENRICHED
    id: SKU
    properties:
      product_name: DISPLAY_NAME
      mrp:          MRP_INR

  - type: Materials
    table: DIM_INGREDIENT
    id: INGREDIENT_ID
    properties:
      material_code: INGREDIENT_ID
      material_name: INGREDIENT_NAME
      material_type: CATEGORY

  - type: Channel
    table: DIM_CHANNEL
    id: CHANNEL_ID
    properties:
      type: CHANNEL_TYPE

relationships:
  - type: requires_material
    table: V_PRODUCT_INGREDIENT
    from: { entity: Products,  column: SKU }
    to:   { entity: Materials, column: INGREDIENT_ID }

  - type: stocked_at
    table: MAP_PRODUCT_CHANNEL
    from: { entity: Products, column: SKU }
    to:   { entity: Channel,  column: CHANNEL_ID }
