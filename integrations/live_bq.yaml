# Live integration — erp-setup bronze / silver / gold (the daily pulse).
# The Products node comes from pim_bq; live feeds attach to it by SKU.
#
# Run:  contextgraph apply -C ./product-master-graph -s live_bq

name: live_bq
kind: bigquery

connection:
  project:     ${env.GCP_PROJECT}          # erp-set-up
  dataset:     bronze
  credentials: ${env.GOOGLE_APPLICATION_CREDENTIALS_JSON}

entities:
  - type: Channel
    table: MASTER_STORE
    id: MASTER_STORE_ID
    properties:
      type: TYPE

  - type: Consumers
    table: MARKETING_SEGMENT_MASTER
    id: SEGMENT_ID
    properties:
      household_segment: SEGMENT_NAME
