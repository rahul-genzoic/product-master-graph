version: 1

processes:
  # Regulation Impact Analysis — the "so what does this mean for US?" companion to the
  # FSSAI feed signal. It SCANS incoming FSSAI regulatory changes (via the fssai-feed
  # scraper skill), maps each relevant change onto the SKUs / ingredients / suppliers it
  # touches in OUR portfolio, works out the formulation + label changes required, surfaces
  # compliant alternatives with cost deltas (from the graph), and lets a reviewer approve —
  # or REVISE to iterate on — the remediation plan.
  #
  # Stepped/agentic mode: real `steps` (agent|decision|notify), NO metadata.steps_display_only,
  # so the EventAgent walks them. `run_steps_before_gate: true` so each gate's key_data cards
  # (affected SKUs, required changes, alternatives) are produced before the reviewer sees them.
  - id: regulation_impact_analysis
    name: Regulation Impact Analysis
    description: >
      Scans incoming FSSAI regulatory changes, maps each relevant change to the affected
      SKUs, ingredients and suppliers in our portfolio, identifies the formulation and
      label changes required, and surfaces compliant alternatives with cost deltas — then
      lets a reviewer approve or iterate on the remediation plan.
    domain: Compliance
    owner: compliance_team
    definition_type: text

    # Products are the entities the analysis lands on. The run itself starts broad (a feed
    # scan) rather than from one SKU, then narrows to the affected Products.
    applies_to:
      - entity: Product

    triggers:
      # `regulation_changed` would be emitted by the fssai-feed signal detector when it
      # finds a relevant change; until that's wired onto the process bus, start manually.
      - { type: event, event_type: regulation_changed }
      - { type: manual, allowed_roles: [ComplianceLead, RegulatoryAffairs] }

    inputs:
      - { name: days_lookback,  type: number, required: false }   # how far back to scan the FSSAI feed
      - { name: focus_keywords, type: string, required: false }   # optional: restrict to specific ingredients/claims/categories
      # TODO: no Market/Country entity yet — FSSAI / India assumed.
      - { name: target_market,  type: string, required: false }

    outputs:
      - { name: remediation_decision, type: enum, values: ["Approve Remediation Plan", "REJECT"] }

    steps:
      # 1. SCAN — pull the latest FSSAI regulatory changes via the fssai-feed scraper skill
      #    (Playwright-rendered fssai.gov.in). Its result lands in state as `regulatory_scan`.
      - id: scan_regulations
        name: Scan FSSAI Regulatory Feed
        type: agent
        description: Invoke the FSSAI feed scraper to pull the latest regulatory changes.
        instruction: >
          The FSSAI feed scraper (scan_feed) has already run and its result is in state as
          regulatory_scan. Summarise regulatory_scan.items: for EACH scanned change output a
          concise entry {title, what_changed, effective_date, affected_areas (ingredient /
          claim / category keywords it names), business_criticality, source_url}. Output
          regulatory_changes as that list (an empty list if regulatory_scan.items is empty or
          the scan returned no documents), and change_count as its length. Do NOT invent
          changes beyond regulatory_scan.
        skill:
          # Registered Integration name = "Genzoic FSSAI Feed Scraper" (subprocess gets
          # PYTHONPATH+DB because the name starts with "Genzoic"); operation scan_feed.
          name: Genzoic FSSAI Feed Scraper
          operation: scan_feed
          args:
            days_lookback: '{{days_lookback}}'
            focus_keywords: '{{focus_keywords}}'
            model: gemini
          as: regulatory_scan
        produces:
          - regulatory_changes
          - change_count
        key_data:
          - title: Incoming FSSAI Changes
            summary: Regulatory changes scraped from the FSSAI feed for this run.
            views:
              - view: table
                from: regulatory_changes
                columns: [title, effective_date, business_criticality, affected_areas]

      # 2. ASSESS + MAP — cross-reference each scanned change against OUR portfolio. Uses
      #    the pre-gathered product_portfolio (SKU + category + claims + cost) and
      #    product_ingredients (SKU -> its ingredients, via the contains_ingredient edge)
      #    plus supplier_ingredients (Supplier -> ingredients it supplies). Produces the
      #    affected SKUs / suppliers and the subset of changes that actually touch us.
      - id: assess_and_map
        name: Assess Portfolio Impact & Map Affected SKUs
        type: agent
        after: scan_regulations
        description: Map each relevant regulatory change to the affected SKUs, ingredients and suppliers.
        # Pull the WHOLE portfolio as this step's own input so it lands in the step's
        # PRIMARY (un-truncated) prompt block — a context_package key would instead sit in
        # OTHER FACTS, where any list over 4 rows is previewed down to 4 (the agent would
        # see ~4 SKUs + "…(+N more rows)" and generalise). `search_dataset` is cross-entity
        # (the entire Product type), NOT scoped to one resolved SKU — right for a scan.
        fetch:
          entity_type: Product
          source_table: V_PRODUCT_ENRICHED
          columns: [SKU, DISPLAY_NAME, MRP_INR, TOTAL_COGS_INR, SHELF_LIFE_DAYS]
          limit: 200
          as: product_portfolio
        instruction: >
          Determine which of regulatory_changes actually affect OUR portfolio, and map them
          to the affected SKUs. Your SKU universe is product_portfolio — EVERY row is a real
          SKU we sell (SKU code, DISPLAY_NAME, MRP_INR, TOTAL_COGS_INR). You MUST only name
          SKUs that appear in product_portfolio; never invent SKUs or describe them in the
          abstract ("several dessert products"). The DISPLAY_NAME encodes the product family
          (e.g. "Dessert-…", "Health Bar-…") — use it to match a change's affected_areas to
          a product category. Supporting signals: product_ingredients (a representative
          ingredient per SKU, best-effort — may be sparse) and any ingredient/supplier links
          in the GATHERED CONTEXT. For EACH change in regulatory_changes, decide relevance: it
          is relevant if its affected_areas match a product family / claim / ingredient we
          actually carry in product_portfolio.
          Output:
          - relevant_changes: the subset of changes that affect us, each with a one-line
            why_relevant and the matched ingredient(s)/category(ies).
          - affected_skus: one row per (SKU, change) it touches, drawn STRICTLY from
            product_portfolio — {sku, product_name (DISPLAY_NAME), affected_via (the exact
            ingredient/claim/category that matched), change_title, business_criticality,
            mrp_inr, total_cogs_inr}.
          - affected_suppliers: suppliers tied to an affected ingredient — {supplier,
            ingredient, sku_count}. Empty if no supplier data is present.
          If NO product_portfolio SKU concretely matches any change, output EMPTY lists — the
          reviewer will choose "No Action Needed". Never claim a SKU is affected without a
          concrete, named match to a product_portfolio row.
        produces:
          - relevant_changes
          - affected_skus
          - affected_suppliers
        key_data:
          - title: Affected SKUs
            summary: SKUs touched by an incoming regulatory change, and why.
            views:
              - view: table
                from: affected_skus
                columns: [sku, product_name, affected_via, change_title, business_criticality]
          - title: Affected Suppliers
            views:
              - { view: table, from: affected_suppliers }

      # 3. GATE — reviewer confirms the impact scope. Choosing "No Action Needed" cleanly
      #    handles the no-impact case (empty affected_skus) without a fragile LLM-set flag.
      - id: confirm_scope
        name: Confirm Impact Scope
        type: decision
        after: assess_and_map
        description: Compliance lead confirms which SKUs/suppliers to remediate (or that there's no impact).
        instruction: >
          Review affected_skus and relevant_changes. Choose "Proceed to Remediation" when one
          or more SKUs are genuinely affected and warrant formulation/label changes. Choose
          "No Action Needed" when nothing in the portfolio is affected (empty affected_skus) or
          the changes are purely informational. Recommend "Proceed to Remediation" whenever
          affected_skus is non-empty with any license_blocking / must_have item; otherwise
          recommend "No Action Needed".
        decision_options: ["Proceed to Remediation", "No Action Needed"]
        produces:
          - scope_decision
        key_data:
          - title: Affected SKUs
            views:
              - view: table
                from: affected_skus
                columns: [sku, product_name, affected_via, change_title, business_criticality]
          - title: Relevant Changes
            views:
              - { view: table, from: relevant_changes }

      # 4. Identify the concrete formulation + label changes required on the affected SKUs.
      - id: identify_remediation
        name: Identify Required Formulation & Label Changes
        type: agent
        after: confirm_scope
        condition: '{{scope_decision}} == "Proceed to Remediation"'
        description: Derive the formulation and label edits each affected SKU needs to comply.
        instruction: >
          For each row in affected_skus, derive what must change to comply with its
          change_title (see relevant_changes for the rule detail). Split into two outputs:
          - formulation_changes: {sku, product_name, ingredient, action (reduce | replace |
            remove | reformulate), driving_rule, rationale} — the recipe-level edits (e.g.
            replace a restricted additive, cut a nutrient above a new threshold).
          - label_changes: {sku, product_name, field (e.g. allergen declaration, nutrition
            panel, claim, front-of-pack symbol, ingredient list), current_state,
            required_state, driving_rule} — the on-pack edits.
          Reason over product_ingredients / product_portfolio for current state; use
          "not declared" when a field is absent. Be concrete and per-SKU; do not generalise.
        produces:
          - formulation_changes
          - label_changes

      # 5. Surface compliant alternatives with cost deltas (from the graph).
      - id: surface_alternatives
        name: Surface Compliant Alternatives & Cost Deltas
        type: agent
        after: identify_remediation
        condition: '{{scope_decision}} == "Proceed to Remediation"'
        description: Propose compliant alternative ingredients/suppliers with the cost impact of each swap.
        instruction: >
          For each formulation_changes row that needs a replacement, propose compliant
          alternative(s). Reason over product_portfolio / product_ingredients (current cost
          signals: total_cogs_inr, mrp_inr) and any supplier links in the GATHERED CONTEXT
          for who could supply an alternative. Output compliant_alternatives: {sku,
          product_name, current_ingredient,
          alternative_ingredient, alternative_supplier, est_cost_delta_inr (per unit / per
          SKU; positive = costs more, negative = saves), compliance_note (why the alternative
          is compliant with the driving rule), confidence}. When you cannot find a concrete
          alternative in the graph, say so in compliance_note and set alternative_ingredient
          to "none identified" rather than inventing a supplier. Also output a one-line
          remediation_summary and rate remediation_severity as license_blocking, must_have,
          or good_to_have.
        produces:
          - compliant_alternatives
          - remediation_summary
          - remediation_severity

      # 6. GATE — reviewer approves (or REVISEs to iterate on) the remediation plan. REVISE
      #    feedback can reroute the run (e.g. "recalculate the alternatives", "drop SKU X",
      #    "the MRP for Y is wrong") via the agent's revise directive.
      - id: brief_remediation_plan
        name: Review Remediation Plan
        type: decision
        after: surface_alternatives
        condition: '{{scope_decision}} == "Proceed to Remediation"'
        description: Regulatory affairs approves or rejects the formulation/label remediation plan.
        instruction: >
          Review the full remediation plan: the formulation_changes, label_changes and
          compliant_alternatives (with cost deltas) for every affected SKU. Choose "Approve
          Remediation Plan" when the plan is sound and the alternatives are acceptable on cost
          and compliance; choose "REJECT" when it needs rework or the impact is not worth
          acting on. If you want to refine the plan — recalculate alternatives, correct a
          value, focus on a subset of SKUs — REVISE with that instruction instead of
          approving. Recommend "Approve Remediation Plan" when every license_blocking item has
          a concrete compliant fix.
        decision_options: ["Approve Remediation Plan", "REJECT"]
        recommends: remediation_severity
        rationale_from: remediation_summary
        produces:
          - remediation_decision
        key_data:
          - title: Formulation Changes
            summary: Recipe-level edits required on the affected SKUs.
            views:
              - view: table
                from: formulation_changes
                columns: [sku, product_name, ingredient, action, driving_rule]
          - title: Label Changes
            summary: On-pack edits required on the affected SKUs.
            views:
              - view: table
                from: label_changes
                columns: [sku, field, current_state, required_state, driving_rule]
          - title: Compliant Alternatives & Cost Deltas
            summary: Compliant swaps and what each does to cost.
            views:
              - view: table
                from: compliant_alternatives
                columns: [sku, current_ingredient, alternative_ingredient, alternative_supplier, est_cost_delta_inr, compliance_note]

      # 7. Record the approved remediation plan (simulated) — only on the APPROVE branch.
      - id: record_remediation_plan
        name: Record Remediation Plan
        type: notify
        after: brief_remediation_plan
        condition: '{{remediation_decision}} == "Approve Remediation Plan"'
        description: Record that the remediation plan is approved and route it to the owners.
        produces:
          - remediation_recorded
        action:
          type: simulated
          name: record_remediation_plan
          config:
            summary: 'Regulation remediation plan approved — {{change_count}} change(s) assessed'
            severity: '{{remediation_severity}}'
            formulation_changes: '{{formulation_changes}}'
            label_changes: '{{label_changes}}'
            alternatives: '{{compliant_alternatives}}'

    related_signals_events: [COMP_FSSAIRegulationPublished, COMP_IngredientAdditiveRuleChange, COMP_ClaimsRuleChange, COMP_LabellingRuleChange, COMP_PackagingRegulationChange, COMP_LegalMetrologyChange, COMP_EPREnvironmentalRegulationChange, QA_RegulatorFoodSafetyAlert]   # reverse of master_data/signals_events.yaml related_processes for regulation_impact_analysis

    metadata:
      version: 1
      priority: 10

      # This is a SCAN process — it starts from the FSSAI feed (no input SKU) and then finds
      # the affected products. So it runs ENTITY-LESS: a bare manual or scheduled fire with no
      # entity/attributes is valid (the orchestrator's event validation honors this flag).
      entity_optional: true

      # Run each agent step's FULL body (skill + the LLM `produces` pass) before the first
      # gate, so the gates' key_data cards (affected SKUs, changes, alternatives) exist.
      run_steps_before_gate: true

      # Pre-gather the portfolio the assessment reasons over. Three keys, "graph if
      # available, dataset fallback":
      #   1) product_portfolio — every SKU with category / claims / cost (dataset: reliable).
      #   2) product_ingredients — each SKU and the ingredients it contains, via the
      #      contains_ingredient edge (ingredient-level precision; empty where edges are sparse).
      #   3) supplier_ingredients — which suppliers supply each ingredient (for affected
      #      suppliers + alternatives). Graph-native; best-effort on tenants without supplier data.
      context_package:
        - key: product_portfolio
          # dataset_search = ACROSS the whole Product type (a scan), NOT scoped to one
          # resolved SKU. `source: dataset` would need a resolved pivot entity — which an
          # entity-less scan doesn't have, so it silently returned nothing before.
          source: dataset_search
          query:
            entity_type: Product
            dataset: V_PRODUCT_ENRICHED
            # Only the columns this tenant's V_PRODUCT_ENRICHED link exposes (category /
            # veg_nonveg / labelling live on the graph node, not this cost/price dataset).
            columns:
              - SKU
              - DISPLAY_NAME
              - MRP_INR
              - TOTAL_COGS_INR
              - SHELF_LIFE_DAYS
            limit: 500

        - key: product_ingredients
          gather:
            base:
              entity: Product
              dataset: V_PRODUCT_ENRICHED
              columns: [SKU, DISPLAY_NAME]
              limit: 500
            links:
              - from: SKU               # Product node id IS the SKU (verified in-graph)
                from_type: Product
                via: contains_ingredient
                direction: out
                # `name` is a property of the linked INGREDIENT NODE, so it must be pulled
                # with bring_target (node props). `bring` reads EDGE props — there is no
                # edge `name`, which is why every row came back name=null before.
                bring_target: [name]

      # Process-level "Data used" card (inherited by gates that don't override).
      key_data:
        - title: Portfolio (SKUs assessed)
          summary: The SKUs the incoming regulations were assessed against.
          views:
            - view: table
              from: product_portfolio
              columns: [SKU, DISPLAY_NAME, MRP_INR, TOTAL_COGS_INR, SHELF_LIFE_DAYS]

      # Tool scope: the only skill use is the hard-wired scan_regulations STEP (fssai-feed
      # scraper via run_skill, which bypasses this scope). The DECISION gates reason purely
      # over the gathered facts, so no external skills — an empty list keeps them focused.
      tools:
        skills: []
        connectors: []
        allow_unlisted_skills: false
