version: 1

processes:
  - id: competitor_enforcement_signals
    name: Competitor Enforcement Action Signals
    description: >
      Monitor FSSAI enforcement notices and recall actions against competitors.
      When a competitor is actioned for a claim or ingredient, assess our own
      exposure immediately.
    domain: Compliance
    owner: compliance_team
    definition_type: text

    applies_to:
      - entity: Product

    triggers:
      - { type: schedule, cron: "0 6 * * 1" }   # weekly, Monday 06:00
      - { type: manual, allowed_roles: [ComplianceLead, RegulatoryAffairs] }

    inputs:
      - { name: product, type: reference, references: Product, required: false }

    outputs:
      - { name: exposure_decision, type: enum, values: ["Flag Own Exposure", "No Action Needed"] }

    steps:
      - id: gather_enforcement_signals
        name: Gather Competitor Enforcement Signals
        type: agent
        description: Assembles recent competitor enforcement notices and recall actions with the claims or ingredients cited.
        instruction: >
          Reason over the event inputs and gathered graph context to compile recent
          FSSAI enforcement notices and recall actions taken against competitor products.
          For each, capture the competitor, the cited claim or ingredient, and the action
          type. Do NOT invent data beyond what is gathered; output empty lists where there
          is none.
        produces:
          - competitor_actions
          - cited_claims_ingredients
        key_data:
          - title: Competitor Enforcement Actions
            summary: Recent FSSAI notices and recalls against competitors
            views:
              - { view: table, from: competitor_actions }

      - id: assess_own_exposure
        name: Assess Own Exposure
        type: agent
        after: gather_enforcement_signals
        description: Evaluates whether our own products share the actioned claims or ingredients.
        instruction: >
          Evaluate the competitor_actions and cited_claims_ingredients against our own
          product portfolio in the gathered graph context. Produce a findings list of
          products that share the same actioned claim or ingredient, a one-line summary,
          and an exposure risk level. Output empty lists where there is no overlap.
        produces:
          - exposure_findings
          - exposure_summary
          - exposure_level

      - id: exposure_review_gate
        name: Exposure Review Gate
        type: decision
        after: assess_own_exposure
        description: Compliance lead reviews exposure findings and decides whether to flag our own products.
        instruction: >
          Review exposure_findings. Choose "Flag Own Exposure" when one or more of our
          products share an actioned claim or ingredient; choose "No Action Needed" when
          there is nothing to act on. Recommend "Flag Own Exposure" whenever a material
          overlap is present.
        decision_options: ["Flag Own Exposure", "No Action Needed"]
        recommends: exposure_level
        rationale_from: exposure_summary
        produces:
          - exposure_decision
        key_data:
          - title: Exposure Findings
            summary: Our products overlapping with competitor enforcement actions
            views:
              - { view: table, from: exposure_findings }

      - id: record_exposure_flag
        name: Record Exposure Flag
        type: notify
        after: exposure_review_gate
        condition: '{{exposure_decision}} == "Flag Own Exposure"'
        description: Records and routes the flagged exposure to the compliance team on the positive branch.
        produces:
          - exposure_flag_recorded
        action:
          type: simulated
          name: record_exposure_flag
          config:
            summary: 'Own exposure flagged for {{product}} based on competitor enforcement signals'
            findings: '{{exposure_findings}}'

    related_signals_events: [COMP_CompetitorEnforcementRecall, QA_IndustryProductRecall, QA_CompetitorProductRecall, QA_ContaminationOutbreak, QA_RegulatorFoodSafetyAlert]   # reverse of master_data/signals_events.yaml related_processes for competitor_enforcement_signals

    metadata:
      version: 1
      priority: 10
      # Demo sweep: fireable without a pivot entity (discovers its own targets).
      entity_optional: true
      run_steps_before_gate: true
      tools:
        skills: []
        connectors: []
        allow_unlisted_skills: false
