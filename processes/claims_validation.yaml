version: 1

processes:
  # Claims Validation — verify every on-pack and channel claim a SKU makes against its
  # CURRENT formulation (ingredients), nutrition facts, and the regulatory thresholds for
  # the target market. Surfaces "claim drift": a claim that used to hold but no longer does
  # after a formulation change — e.g. a "Natural Colour" claim invalidated once Red Dye 3
  # enters the recipe. Runs per-SKU (product id + name), on a schedule or on demand.
  #
  # Stepped/agentic mode: real `steps`, NO metadata.steps_display_only, so the EventAgent
  # walks them. `run_steps_before_gate: true` so the gate's key_data cards (claims,
  # ingredients, conflicts) are produced before the reviewer sees them.
  - id: claims_validation
    name: Claims Validation
    description: >
      Verifies every on-pack and channel claim a SKU makes against its current formulation,
      nutrition facts and the regulatory thresholds for the target market, and flags any
      claim that no longer holds (claim drift) — e.g. a "Natural Colour" claim invalidated
      by a synthetic colour in the recipe.
    domain: Compliance
    owner: compliance_team
    definition_type: text

    # Pivots on ONE SKU — the product whose claims are being validated.
    applies_to:
      - entity: Product

    triggers:
      # Schedulable: sweep claims on a cadence to catch drift after silent formulation
      # edits. `formulation_changed` re-validates a SKU the moment its recipe changes.
      - { type: schedule, cron: "0 6 * * 1" }   # weekly, Monday 06:00
      - { type: event, event_type: formulation_changed }
      - { type: event, event_type: claim_changed }
      - { type: manual, allowed_roles: [ComplianceLead, RegulatoryAffairs, BrandTeam] }

    inputs:
      - { name: sku,           type: reference, references: Product, required: true }   # the productID to validate
      - { name: product_name,  type: string, required: false }
      # TODO: no Market/Country entity yet — free-text; FSSAI / India assumed by default.
      - { name: target_market, type: string, required: false }

    outputs:
      - { name: claim_review_decision, type: enum, values: ["Flag for Remediation", "No Issues"] }

    steps:
      # 1. FETCH — assemble the two data points the reviewer needs side by side: every claim
      #    the SKU makes, and its current formulation (ingredients) + nutrition facts.
      - id: fetch_claims_and_formulation
        name: Fetch Claims & Current Formulation
        type: agent
        description: Show every claim the SKU makes alongside its current ingredients and nutrition facts.
        instruction: >
          Assemble, for this SKU, the two data points to validate against each other. Reason
          over: product_facts (the SKU's PIM attributes) and sku_graph — the SKU's related
          graph entities grouped by edge: sku_graph.claimed_by = its CLAIMS (each row's name is
          the claim text), sku_graph.contains_ingredient = its INGREDIENTS, sku_graph.
          declares_nutrient = its NUTRIENTS (each row carries value/unit), sku_graph.
          declares_allergen = its ALLERGENS. Output:
          - claims_list: every on-pack / channel claim — {claim, claim_type (e.g. natural,
            nutrition, free-from, origin, marketing), status, depends_on (any ingredient the
            claim relies on, from claim_depends_on_ingredient), substantiated_by (any nutrient
            it asserts, from substantiated_by_nutrient)}.
          - ingredients_list: the current formulation — {ingredient, category, note} where note
            flags anything claim-relevant: synthetic / artificial colour (e.g. Red Dye 3,
            Tartrazine), added sugar / syrup, animal-derived (dairy, egg, gelatin, collagen),
            or a known allergen.
          - nutrition_facts: {nutrient, value, unit} for the declared nutrition panel.
          Do NOT invent claims or ingredients beyond the gathered data; output empty lists
          where the graph has none.
        produces:
          - claims_list
          - ingredients_list
          - nutrition_facts
        key_data:
          - title: Claims Made
            summary: Every on-pack / channel claim this SKU carries.
            views:
              - view: table
                from: claims_list
                columns: [claim, claim_type, status, depends_on, substantiated_by]
          - title: Current Formulation
            summary: The SKU's current ingredients (claim-relevant notes flagged).
            views:
              - view: table
                from: ingredients_list
                columns: [ingredient, category, note]
          - title: Nutrition Facts
            views:
              - { view: table, from: nutrition_facts }

      # 2. VALIDATE — cross-check every claim against the formulation, nutrition facts and the
      #    market's regulatory thresholds; surface the conflicts (claim drift).
      - id: validate_claims
        name: Validate Claims Against Formulation
        type: agent
        after: fetch_claims_and_formulation
        description: Cross-check every claim against the current formulation and regulatory thresholds; list the conflicts.
        instruction: >
          For EACH claim in claims_list, decide whether it still holds against ingredients_list,
          nutrition_facts, and the regulatory thresholds for the target market (default FSSAI /
          India — use the regulation context in the GATHERED CONTEXT where present). Apply the
          usual claim↔formulation rules, for example:
          - "Natural" / "Natural Colour" / "No artificial colours" — INVALIDATED by any
            synthetic / artificial colour in the formulation (e.g. Red Dye 3, Red 40, Tartrazine).
          - "No added sugar" — invalidated by any added sugar / syrup ingredient.
          - "Vegan" / "Plant-based" — invalidated by any animal-derived ingredient (dairy, egg,
            gelatin, collagen).
          - "High protein" / "Source of <nutrient>" — holds only if nutrition_facts meets the
            regulatory threshold for that claim.
          - free-from / allergen claims — invalidated by the presence of that ingredient/allergen.
          Output claim_conflicts: one row per claim that is NOT cleanly valid — {claim, verdict
          (invalidated | at_risk | unclear), invalidated_by (the specific ingredient/nutrient/
          rule, e.g. "Red Dye 3"), reason (one line, e.g. "'Natural Colour' claim invalidated by
          Red Dye 3 in the formulation"), market, severity (license_blocking | must_have |
          good_to_have)}. Also output a one-line claim_drift_summary and drift_risk_level (high
          | medium | low) — HIGH when any license_blocking claim is invalidated. If every claim
          holds, output an empty claim_conflicts list and drift_risk_level "low".
        produces:
          - claim_conflicts
          - claim_drift_summary
          - drift_risk_level

      # 3. GATE — reviewer reviews the conflicting claims and decides whether to flag them.
      #    REVISE lets them iterate (recheck a claim, correct a value, focus a market).
      - id: review_claim_conflicts
        name: Review Conflicting Claims
        type: decision
        after: validate_claims
        description: Compliance lead reviews the claim conflicts and decides whether to flag them for remediation.
        instruction: >
          Review claim_conflicts against the claims and formulation. Choose "Flag for
          Remediation" when one or more claims no longer hold and must be corrected on pack /
          channel (claim drift). Choose "No Issues" when every claim is valid (empty
          claim_conflicts) or the conflicts are immaterial. Recommend "Flag for Remediation"
          whenever any invalidated / license_blocking conflict is present.
        decision_options: ["Flag for Remediation", "No Issues"]
        recommends: drift_risk_level
        rationale_from: claim_drift_summary
        produces:
          - claim_review_decision
        key_data:
          - title: Conflicting Claims (claim drift)
            summary: Claims that no longer hold against the current formulation.
            views:
              - view: table
                from: claim_conflicts
                columns: [claim, verdict, invalidated_by, reason, severity]
          - title: Claims Made
            views:
              - view: table
                from: claims_list
                columns: [claim, claim_type, status]
          - title: Current Formulation
            views:
              - view: table
                from: ingredients_list
                columns: [ingredient, category, note]

      # 4. Record the flagged claims for remediation (simulated) — only when flagged.
      - id: record_claim_review
        name: Record Flagged Claims
        type: notify
        after: review_claim_conflicts
        condition: '{{claim_review_decision}} == "Flag for Remediation"'
        description: Record the claims flagged for remediation and route them to the brand / compliance owner.
        produces:
          - claim_review_recorded
        action:
          type: simulated
          name: record_claim_review
          config:
            summary: 'Claim validation for {{product_name}} — claims flagged for remediation'
            sku: '{{sku}}'
            drift_risk: '{{drift_risk_level}}'
            conflicts: '{{claim_conflicts}}'

    related_signals_events: [COMP_ClaimsRuleChange, COMP_ProductFormulationChanged, COMP_NewIngredientIntroduced, COMP_ProductClaimChanged, MKT_MarketingClaimApprovalRequired]   # reverse of master_data/signals_events.yaml related_processes for claims_validation

    metadata:
      version: 1
      priority: 10

      # Run each agent step's full body (the LLM `produces` pass) before the gate, so the
      # gate's key_data cards (claims, formulation, conflicts) exist when the reviewer lands.
      run_steps_before_gate: true

      # Pre-fetch, scoped to the SKU on the event:
      #   1) product_facts — the SKU's PIM attributes (dataset: reliable).
      #   2) product_ingredients — its ingredients via the contains_ingredient edge.
      # The SKU's Claims / Nutrients / Allergens also arrive via the auto-gathered GATHERED
      # CONTEXT (related graph entities), which the fetch step reads.
      context_package:
        - key: product_facts
          source: dataset
          query:
            entity: product
            dataset: V_PRODUCT_ENRICHED
            # Only the columns this tenant's V_PRODUCT_ENRICHED link actually exposes —
            # category / veg_nonveg / labelling status live on the graph node and arrive
            # via the auto-gathered GATHERED CONTEXT, not this cost/price dataset.
            columns:
              - SKU
              - DISPLAY_NAME
              - MRP_INR
              - TOTAL_COGS_INR
              - SHELF_LIFE_DAYS
            limit: 1

        # The SKU's related graph entities — CLAIMS, INGREDIENTS, NUTRIENTS, ALLERGENS —
        # fetched up front via the `related` source (the orchestrator's in-process graph
        # client's get_related; one row per neighbour). A plain `gather` link only brings
        # ONE matched neighbour per base row, so it can't return all N ingredients/claims,
        # and the auto `_agent_collected` graph context is only gathered later at decision
        # gates — too late for the fetch step.
        - key: sku_graph
          source: related
          query:
            relationships: [claimed_by, contains_ingredient, declares_nutrient, declares_allergen]

      # Process-level "Data used" card (inherited by gates that don't override).
      key_data:
        - title: Product
          summary: The SKU whose claims are being validated.
          views:
            - view: table
              from: product_facts
              columns: [SKU, DISPLAY_NAME, MRP_INR, TOTAL_COGS_INR, SHELF_LIFE_DAYS]

      # Tool scope: the agent reasons purely over the gathered facts (sku_graph is fetched
      # by the orchestrator's context client, not an agent tool) — so no external skills.
      tools:
        skills: []
        connectors: []
        allow_unlisted_skills: false
