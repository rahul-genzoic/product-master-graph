version: 1

processes:
  - id: supplier_coa_renewal
    name: Supplier COA Renewal Workflow
    description: >
      Monitor all supplier COA (Certificate of Analysis) expiry dates, flag any
      certificate within 60 days of expiry, draft renewal requests, and route to
      supply chain for assignment and tracking to completion.
    domain: Compliance
    owner: compliance_team
    definition_type: text

    applies_to:
      - entity: Supplier

    triggers:
      - { type: schedule, cron: "0 6 * * 1" }   # weekly, Monday 06:00
      - { type: manual, allowed_roles: [ComplianceLead, RegulatoryAffairs] }

    inputs:
      - { name: supplier, type: reference, references: Supplier, required: false }

    outputs:
      - { name: renewal_decision, type: enum, values: ["Draft Renewal Requests", "No Action Needed"] }

    steps:
      - id: gather_coa_status
        name: Gather COA Expiry Status
        type: agent
        description: Assembles each supplier's COA certificates with expiry dates and days remaining.
        instruction: >
          Reason over the event inputs and gathered graph context to list every
          supplier COA certificate with its expiry date and days-until-expiry. Separate
          those within 60 days of expiry into the expiring list. Do NOT invent data
          beyond what is gathered; output empty lists where there is none.
        produces:
          - coa_certificates
          - expiring_certificates
        key_data:
          - title: COA Expiry Overview
            summary: All supplier COA certificates and days remaining
            views:
              - { view: table, from: coa_certificates }

      - id: assess_renewals
        name: Assess Renewal Needs
        type: agent
        after: gather_coa_status
        description: Evaluates expiring certificates and determines renewal priority.
        instruction: >
          Evaluate the expiring_certificates from the prior step and produce a findings
          list of certificates needing renewal action with the drafted renewal detail
          for each. Provide a one-line summary of the renewal workload and a risk level
          reflecting how close the earliest expiry is.
        produces:
          - renewal_findings
          - renewal_summary
          - renewal_risk_level

      - id: renewal_gate
        name: COA Renewal Decision Gate
        type: decision
        after: assess_renewals
        description: Supply chain compliance reviews renewal findings and decides whether to draft requests.
        instruction: >
          Review renewal_findings. Choose "Draft Renewal Requests" when one or more
          certificates are within 60 days of expiry and need renewal; choose "No Action
          Needed" when there is nothing to act on. Recommend "Draft Renewal Requests"
          whenever any expiring certificate is present.
        decision_options: ["Draft Renewal Requests", "No Action Needed"]
        recommends: renewal_risk_level
        rationale_from: renewal_summary
        produces:
          - renewal_decision
        key_data:
          - title: Renewal Findings
            summary: Certificates flagged for renewal action
            views:
              - { view: table, from: renewal_findings }

      - id: record_renewal_requests
        name: Record and Route Renewal Requests
        type: notify
        after: renewal_gate
        condition: '{{renewal_decision}} == "Draft Renewal Requests"'
        description: Records the drafted renewal requests and routes them to supply chain for assignment and tracking.
        produces:
          - routed_renewal_requests
        action:
          type: simulated
          name: record_renewal_requests
          config:
            summary: 'Drafted COA renewal requests routed to supply chain for {{supplier}}'
            findings: '{{renewal_findings}}'

    related_signals_events: [COMP_SupplierCOAExpiry, COMP_SupplierCertificationExpiry]   # reverse of master_data/signals_events.yaml related_processes for supplier_coa_renewal

    metadata:
      version: 1
      priority: 10
      # Demo sweep: fireable without a pivot entity (discovers its own targets).
      entity_optional: true
      run_steps_before_gate: true
      tools:
        skills: []
        connectors: []
        allow_unlisted_skills: false
