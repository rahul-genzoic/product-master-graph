version: 1
processes:
- id: shelf_life_risk_monitoring
  name: Shelf-Life Risk Monitoring
  description: "Monitors inventory age across dark-store locations against each SKU's\n\
    remaining shelf life and flags SKUs at risk before the wastage window\ncloses,\
    \ then emails the supply-chain owner the at-risk report on approval.\n\nFor the\
    \ agent: `at_risk_products` is ALREADY assembled and filtered by the\nsystem to\
    \ at-risk (store, SKU) rows only \u2014 rolled up from each store's\nlatest inventory\
    \ snapshot and scored against that pair's configured\nthresholds (from the stock_config_for\
    \ edge). Each row carries a `risk_type`:\n`wastage` (near expiry), `low_stock`\
    \ (below safety stock), `critical_low`\n(below the hard floor) or `both`. Do NOT\
    \ re-filter or re-list every row.\nWrite a SHORT summary: how many SKUs are near-expiry\
    \ vs low on stock, across\nhow many stores, and call out the most urgent (smallest\
    \ days_to_expiry, plus\nany critical_low/both). Recommend APPROVE to email the\
    \ report; if\n`at_risk_products` is empty, recommend no action.\n"
  domain: SupplyChain
  owner: supply_chain_team
  definition_type: text
  applies_to:
  - entity: Channel
  - entity: Channel
    where:
    - field: id
      op: ne
      value: __none__
  triggers:
  - type: schedule
    cron: '*/8 * * * *'
  - type: event
    event_type: shelf_life_risk
  - type: manual
    allowed_roles:
    - SupplyPlanner
    - DemandPlanner
  inputs:
  - name: store_id
    type: reference
    references: Store
    required: false
  - name: scheduled_at
    type: datetime
    required: false
  outputs:
  - name: decision
    type: enum
    values:
    - APPROVE
    - REJECT
    - ESCALATE
  - name: at_risk_products
    type: object
  steps:
  - id: collect_inventory
    name: Collect current inventory
    type: agent
    description: Read each store's latest inventory snapshot (sellable, non-expired
      stock).
    instruction: For every store, read the latest STORE_INVENTORY_DAILY snapshot and
      keep only non-expired, sellable batches.
    produces:
    - current_inventory
  - id: thresholds
    name: Attach shelf-life thresholds
    type: agent
    after: collect_inventory
    description: Walk stock_config_for to bring each (SKU, store)'s configured thresholds.
    instruction: For each (SKU, store) walk the stock_config_for edge and attach min_days_shelf_life,
      min_count and absolute_risk_count.
    produces:
    - thresholds
  - id: assess
    name: Assess risk
    type: agent
    after: thresholds
    description: Roll up per (store, SKU) and flag wastage / low-stock / critical
      risk.
    instruction: Roll up to one row per (store, SKU); classify each as wastage, low_stock,
      critical_low or both against its thresholds and drop the rest.
    produces:
    - at_risk_products
  - id: review
    name: Supply owner review
    type: decision
    after: assess
    description: Supply-chain owner reviews the at-risk report and approves / rejects
      / revises.
    instruction: Review the at-risk report and APPROVE to email it, REJECT to hold,
      or REVISE with changes.
    decision_options:
    - APPROVE
    - REJECT
    - ESCALATE
  - id: notify
    name: Email at-risk report
    type: notify
    after: review
    description: On approve, format the at-risk report as a Genzoic HTML email (via
      the Genzoic Email Formatter skill) and send it to the supply-chain owner.
    instruction: On approve, email the supply-chain owner the formatted at-risk report.
  learning: 'Persist, per (store, SKU), which risk_type recurs and whether the owner

    acted (transfer / markdown / ignored). Surface repeat offenders first.

    '
  related_kpis:
  - WastageRisk
  related_signals_events:
  - OPS_WeatherAnomaly
  - OPS_InventoryBelowSafetyStock
  - OPS_ExcessInventoryDetected
  - OPS_ShelfLifeThresholdReached
  metadata:
    version: 1
    effective_from: 2026-07-15
    priority: 10
    requires_human_approval: true
    steps_display_only: true
    tools:
      skills: []
    context_package:
    - key: at_risk_products
      required: true
      gather:
        base:
          entity: Channel
          dataset: STORE_INVENTORY_DAILY
          columns:
          - store_id
          - product_sku
          - available_quantity
          - expiry_date
          - snapshot_date
          - batch_row_number
          order_by: snapshot_date
          order_dir: desc
          limit: 2000
        links:
        - from: product_sku
          from_type: Products
          via: stock_config_for
          direction: out
          match: store_id
          bring:
          - min_days_shelf_life
          - min_count
          - absolute_risk_count
      post:
        latest_snapshot:
          by:
          - store_id
          'on': snapshot_date
        rollup:
          group_by:
          - store_id
          - product_sku
          filter_rows:
            compute:
            - as: days_to_expiry
              days_until: expiry_date
            where:
            - field: days_to_expiry
              op: gte
              value: 0
          agg:
          - as: total_available
            op: sum
            col: available_quantity
          - as: soonest_expiry
            op: min
            col: expiry_date
          - as: batches
            op: count
            col: batch_row_number
          - as: min_days_shelf_life
            op: first
            col: min_days_shelf_life
          - as: min_count
            op: first
            col: min_count
          - as: absolute_risk_count
            op: first
            col: absolute_risk_count
        compute:
        - as: days_to_expiry
          days_until: soonest_expiry
        - as: risk_type
          bucket:
          - when:
              all:
              - field: days_to_expiry
                op: lte
                ref: min_days_shelf_life
              - field: total_available
                op: lte
                ref: min_count
            value: both
          - when:
              field: days_to_expiry
              op: lte
              ref: min_days_shelf_life
            value: wastage
          - when:
              field: total_available
              op: lte
              ref: absolute_risk_count
            value: critical_low
          - when:
              field: total_available
              op: lte
              ref: min_count
            value: low_stock
          - else: ok
        where:
        - field: risk_type
          op: ne
          value: ok
        drop:
        - min_days_shelf_life
        - min_count
        - absolute_risk_count
        sort_by: days_to_expiry
        resolve:
        - field: store_id
          type: Channel
          as: store_name
        - field: product_sku
          type: Products
          as: product_name
    - key: scheduled_at
      source: event
      required: false
    key_data:
    - title: At-risk inventory (near-expiry & low-stock)
      summary: Flagged (store, SKU) pairs with risk type, most-urgent first
      views:
      - view: table
        from: at_risk_products
        columns:
        - store_name
        - product_name
        - risk_type
        - total_available
        - days_to_expiry
        - soonest_expiry
        - batches
    policy_rules:
    - '`at_risk_products` has ALREADY been assembled and filtered by the system to
      at-risk (store, SKU) rows only, rolled up from the latest inventory snapshot
      and scored against each pair''s configured thresholds (from the stock_config_for
      edge). Each row has a `risk_type`: `wastage` (near expiry: 0 <= days_to_expiry
      <= min_days_shelf_life; already-expired stock is excluded), `low_stock` (total_available
      <= min_count), `critical_low` (total_available <= absolute_risk_count), or `both`.
      Do NOT re-filter or re-list every row.'
    - "Write a SHORT decision summary in plain business language covering BOTH risks:\
      \ how many SKUs are near-expiry (wastage) vs running low on stock, across how\
      \ many stores, and call out the most urgent \u2014 smallest days_to_expiry for\
      \ wastage, and any `critical_low`/`both` rows. Example tone: 'Store 100008:\
      \ 3 SKUs expiring within 2 days and 2 SKUs critically low; 6 stores affected\
      \ overall.' Do not paste the table."
    - Recommend APPROVE to email the supply-chain owner the combined at-risk report
      so the manual daily monitoring is captured in writing. If `at_risk_products`
      is empty, recommend no action (nothing is at risk today).
    actions:
    - name: email_at_risk_report
      decision: APPROVE
      connector: skill
      config:
        type: skill
        skill: genzoic-email-formatter
        operation: send
        args:
          to: uzairtajmat7@gmail.com
          subject: Inventory risk - near-expiry & low-stock SKUs (all stores)
          title: Shelf-Life Risk - Daily Inventory Report
          intro: The scheduled inventory sweep flagged the at-risk (store, SKU) pairs
            below across all dark stores - both wastage risk (nearing expiry) and
            low-stock risk (below configured safety stock), each scored against the
            pair's own thresholds. Please action transfers / markdowns for near-expiry
            stock and replenishment for low-stock SKUs.
          sections:
          - type: table
            caption: At-risk (store, SKU) pairs - most urgent first
            columns:
            - store_name
            - product_name
            - risk_type
            - total_available
            - days_to_expiry
            - soonest_expiry
            - batches
            records: '{{facts.at_risk_products}}'
          footer_note: Generated automatically by the Shelf-Life Risk Monitoring process.
    - name: hold_no_action
      decision: REJECT
      connector: notify
      config:
        type: notify
        recipient: supply_chain_team
        message: "Shelf-life risk sweep reviewed and held \u2014 no email sent this\
          \ run."
    - name: escalate_review
      decision: ESCALATE
      connector: simulated
      config:
        type: simulated
        note: Shelf-life risk sweep escalated for human review.
