version: 1
processes:
- id: state_level_compliance_monitoring
  name: State-Level Compliance Monitoring
  description: 'Track state-level food-safety authority restrictions across the states where products are distributed, surfacing
    restrictions beyond central FSSAI.

    '
  domain: Compliance
  owner: compliance_team
  definition_type: text
  applies_to:
  - entity: Product
  triggers:
  - type: schedule
    cron: 0 6 * * 1
  - type: manual
    allowed_roles:
    - ComplianceLead
    - RegulatoryAffairs
  inputs:
  - name: product
    type: reference
    references: Product
    required: false
  outputs:
  - name: monitoring_decision
    type: enum
    values:
    - Flag for Action
    - No Issues
  steps:
  - id: gather_state_context
    name: Gather State Distribution Context
    type: agent
    description: Assembles distribution states and applicable state-level restrictions for the product.
    instruction: 'Using the event inputs and gathered graph context, identify the states where the product is distributed
      and the state-level food-safety authority restrictions that apply beyond central FSSAI. Output the structured lists
      named in produces. Do NOT invent data beyond what is gathered; output empty lists where there is none.

      '
    produces:
    - distribution_states
    - state_restrictions
    key_data:
    - title: State Restrictions
      summary: Restrictions by state for this product
      views:
      - view: table
        from: state_restrictions
  - id: assess_restrictions
    name: Assess State Restriction Impact
    type: agent
    after: gather_state_context
    description: Evaluates gathered restrictions against the product's distribution footprint.
    instruction: 'Evaluate distribution_states against state_restrictions to determine which restrictions materially affect
      this product. Produce a findings list of impacted states with the specific restriction, a one-line summary, and an overall
      risk level fact.

      '
    produces:
    - restriction_findings
    - assessment_summary
    - risk_level
  - id: review_gate
    name: State Compliance Review Gate
    type: decision
    after: assess_restrictions
    description: Compliance lead reviews impacted states and decides whether action is required.
    instruction: 'Review restriction_findings. Choose "Flag for Action" when one or more state-level restrictions materially
      affect the product; choose "No Issues" when there is nothing to act on. Recommend "Flag for Action" whenever a material
      finding is present.

      '
    decision_options:
    - Flag for Action
    - No Issues
    recommends: risk_level
    rationale_from: assessment_summary
    produces:
    - monitoring_decision
    key_data:
    - title: Restriction Findings
      summary: Impacted states and restrictions
      views:
      - view: table
        from: restriction_findings
  - id: record_flag
    name: Record Compliance Flag
    type: notify
    after: review_gate
    condition: '{{monitoring_decision}} == "Flag for Action"'
    description: Records and routes the flagged state-level restrictions for compliance action.
    produces:
    - recorded_flag
    action:
      type: simulated
      name: record_flag
      config:
        summary: State-level restrictions flagged for {{product}}
        findings: '{{restriction_findings}}'
  metadata:
    version: 1
    priority: 10
    entity_optional: true
    run_steps_before_gate: true
    tools:
      skills: []
      connectors: []
      allow_unlisted_skills: false
  related_signals_events:
  - COMP_FSSAIRegulationPublished
  - COMP_DraftRegulationPublished
