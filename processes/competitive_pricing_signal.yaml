version: 1
processes:
- id: competitive_pricing_signal
  name: Competitive Pricing Signal
  description: 'Reviews the competitor price gaps surfaced by the competitive-pricing
    signal, judges materiality, and lets the pricing team flag the exposed SKUs for
    a pricing review.

    '
  domain: Pricing
  owner: pricing_team
  definition_type: text
  applies_to:
  - entity: Products
  triggers:
  - type: signal
    signal_key: competitive-pricing
  - type: event
    event_type: competitive-pricing
  - type: manual
    allowed_roles:
    - PricingManager
    - CategoryManager
  inputs:
  - name: product
    type: reference
    references: Product
    required: false
  outputs:
  - name: pricing_decision
    type: enum
    values:
    - Flag for Pricing Review
    - No Action
  steps:
  - id: summarise_price_gaps
    name: Summarise Price Gaps
    type: agent
    description: Summarise the competitor price comparisons the signal surfaced.
    instruction: "`exposure_items` holds the competitor price comparisons this signal\
      \ surfaced \u2014 each row has `customer` (the SKU vs competitor matchup), `value`\
      \ (own vs competitor price and the % gap) and `risk` (High/Medium). Write a\
      \ short `price_gap_summary` \u2014 how many material gaps, which SKUs are most\
      \ exposed, and the direction (priced above vs below competitors) \u2014 and\
      \ set `exposure_level` (high | medium | low): high when any row is High risk.\
      \ Do not restate every row; the table is shown alongside.\n"
    produces:
    - price_gap_summary
    - exposure_level
    key_data:
    - title: Competitor Price Gaps
      summary: "Per (SKU \xD7 competitor) \u2014 own vs competitor price and the gap."
      views:
      - view: table
        from: exposure_items
        columns:
        - customer
        - value
        - risk
  - id: assess_pricing_exposure
    name: Assess Pricing Exposure
    type: agent
    after: summarise_price_gaps
    description: Recommend a move per exposed SKU.
    instruction: "For each row in `exposure_items`, recommend a move: `reprice` (gap\
      \ \u2265 15%, High risk), `review` (a smaller but real gap) or `hold` (immaterial).\
      \ Output `pricing_actions`: one row per matchup with {sku: the `customer` label,\
      \ gap: the `value`, risk, move, reason (one line)}. Do not invent rows beyond\
      \ `exposure_items`; output an empty list only if `exposure_items` is empty.\n"
    produces:
    - pricing_actions
  - id: review_price_gaps
    name: Review Price Gaps
    type: decision
    after: assess_pricing_exposure
    description: Pricing team reviews the exposure and decides whether to flag for
      a pricing review.
    instruction: 'Review the price gaps and the recommended moves. Choose "Flag for
      Pricing Review" when one or more SKUs are materially mispriced against competitors
      (a High-risk gap); choose "No Action" when the gaps are immaterial. Recommend
      "Flag for Pricing Review" whenever a High-risk gap is present.

      '
    decision_options:
    - Flag for Pricing Review
    - No Action
    recommends: exposure_level
    rationale_from: price_gap_summary
    produces:
    - pricing_decision
    key_data:
    - title: Competitor Price Gaps
      summary: The price comparisons this signal surfaced.
      views:
      - view: table
        from: exposure_items
        columns:
        - customer
        - value
        - risk
    - title: Recommended Pricing Actions
      summary: The recommended move per exposed SKU.
      views:
      - view: table
        from: pricing_actions
        columns:
        - sku
        - gap
        - risk
        - move
        - reason
  - id: record_pricing_review
    name: Record Pricing Review
    type: notify
    after: review_price_gaps
    condition: '{{pricing_decision}} == "Flag for Pricing Review"'
    description: Record the SKUs flagged for a pricing review and route to the pricing
      owner.
    produces:
    - pricing_review_recorded
    action:
      type: simulated
      name: record_pricing_review
      config:
        summary: "Competitive pricing signal \u2014 SKUs flagged for pricing review."
        findings: '{{pricing_actions}}'
  metadata:
    version: 2
    priority: 10
    kind: signal
    signal_key: competitive-pricing
    entity_optional: true
    run_steps_before_gate: true
    context_package:
    - key: exposure_items
      source: event
    - key: comparison_groups
      source: event
    key_data:
    - title: Competitor Price Gaps
      summary: The competitor price comparisons this signal surfaced.
      views:
      - view: table
        from: exposure_items
        columns:
        - customer
        - value
        - risk
    tools:
      skills: []
      connectors: []
      allow_unlisted_skills: false
  related_signals_events:
  - NPD_CompetitorProductLaunch
  - NPD_CompetitorPackInnovation
  - MKT_CompetitorCampaignLaunch
  - SALES_CompetitorNewListing
  - SALES_CompetitorListingRemoval
  - SALES_CompetitorSearchRankingChange
  - SALES_CompetitorOutOfStock
  - SALES_CompetitorAssortmentChange
  - FIN_CompetitorPriceChange
  - FIN_CompetitorPromotionLaunch
  - FIN_CompetitorPackSizeChange
  - FIN_CompetitorBundleOffer
  - FIN_CategoryPricingMovement
  - FIN_RetailerDiscountMovement
  - CMI_CompetitorProductLaunch
  - CMI_CompetitorPriceChange
  - CMI_CompetitorPromotion
  - CMI_CompetitorClaimChange
  - CMI_CompetitorChannelExpansion
  - CMI_NewChallengerBrandEmerging
