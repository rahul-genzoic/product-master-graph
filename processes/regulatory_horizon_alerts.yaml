version: 1

processes:
  - id: regulatory_horizon_alerts
    name: Regulatory Horizon Alerts
    description: >
      Continuous monitoring of pre-rule signals, advisory committee outputs and
      legislative activity, mapped to portfolio exposure before rules are finalised.
    domain: Compliance
    owner: compliance_team
    definition_type: text

    applies_to:
      - entity: Product

    triggers:
      - { type: schedule, cron: "0 6 * * 1" }   # weekly, Monday 06:00
      - { type: manual, allowed_roles: [ComplianceLead, RegulatoryAffairs] }

    inputs:
      - { name: product, type: reference, references: Product, required: false }

    outputs:
      - { name: horizon_decision, type: enum, values: ["Add to Watchlist", "No Action Needed"] }

    steps:
      - id: gather_horizon_signals
        name: Gather Horizon Signals
        type: agent
        description: Assembles pre-rule signals and legislative activity relevant to the product portfolio.
        instruction: >
          Reason over the event inputs and gathered graph context to collect pre-rule
          signals, advisory committee outputs and pending legislative activity that
          could affect the product. Produce the structured lists named in produces.
          Do NOT invent data beyond what is gathered; output empty lists where there is none.
        produces:
          - horizon_signals
          - legislative_activity
        key_data:
          - title: Horizon Signals
            summary: Pre-rule and advisory signals gathered for the portfolio
            views:
              - { view: table, from: horizon_signals }

      - id: assess_exposure
        name: Assess Portfolio Exposure
        type: agent
        after: gather_horizon_signals
        description: Evaluates gathered signals against portfolio exposure.
        instruction: >
          Evaluate horizon_signals and legislative_activity against the product's
          portfolio exposure to identify emerging regulatory risks. Produce an exposure
          findings list, a one-line summary and an overall exposure level fact.
        produces:
          - exposure_findings
          - exposure_summary
          - exposure_level

      - id: horizon_review_gate
        name: Horizon Review Gate
        type: decision
        after: assess_exposure
        description: Regulatory affairs reviews exposure findings and decides whether to track the signal.
        instruction: >
          Review exposure_findings. Choose "Add to Watchlist" when a material pre-rule
          or legislative signal warrants ongoing tracking; choose "No Action Needed"
          when there is nothing to act on. Recommend "Add to Watchlist" whenever a
          material finding present.
        decision_options: ["Add to Watchlist", "No Action Needed"]
        recommends: exposure_level
        rationale_from: exposure_summary
        produces:
          - horizon_decision
        key_data:
          - title: Exposure Findings
            summary: Emerging regulatory risks mapped to portfolio exposure
            views:
              - { view: table, from: exposure_findings }

      - id: record_watchlist_entry
        name: Record Watchlist Entry
        type: notify
        after: horizon_review_gate
        condition: '{{horizon_decision}} == "Add to Watchlist"'
        description: Records and routes the watchlist entry on the positive branch.
        produces:
          - watchlist_entry_recorded
        action:
          type: simulated
          name: record_watchlist_entry
          config:
            summary: 'Added {{product}} to the regulatory horizon watchlist'
            findings: '{{exposure_findings}}'

    related_signals_events: [COMP_DraftRegulationPublished, COMP_InternationalRegulatoryChange]   # reverse of master_data/signals_events.yaml related_processes for regulatory_horizon_alerts

    metadata:
      version: 1
      priority: 10
      # Demo sweep: fireable without a pivot entity (discovers its own targets).
      entity_optional: true
      run_steps_before_gate: true
      tools:
        skills: []
        connectors: []
        allow_unlisted_skills: false
