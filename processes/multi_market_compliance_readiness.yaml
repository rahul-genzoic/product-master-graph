version: 1
processes:
- id: multi_market_compliance_readiness
  name: Multi-Market Compliance Readiness
  description: 'For any SKU entering a new market, produce a full compliance gap report covering reformulation requirements,
    estimated approval timeline and cost.

    '
  domain: Compliance
  owner: compliance_team
  definition_type: text
  applies_to:
  - entity: Product
  triggers:
  - type: schedule
    cron: 0 6 * * 1
  - type: manual
    allowed_roles:
    - ComplianceLead
    - RegulatoryAffairs
  inputs:
  - name: product
    type: reference
    references: Product
    required: false
  outputs:
  - name: readiness_decision
    type: enum
    values:
    - Proceed to Market Entry
    - "Hold \u2014 Gaps Remain"
  steps:
  - id: assemble_market_profile
    name: Assemble Target Market Profile
    type: agent
    description: Gathers the SKU's formulation, labeling and the target market's regulatory requirements.
    instruction: 'Reasoning over the event inputs and gathered graph context, assemble the SKU''s current formulation, ingredients
      and label claims alongside the target market''s applicable regulatory requirements and any registration prerequisites.
      Output the structured lists named in produces. Do NOT invent data beyond what is gathered; output empty lists where
      there is none.

      '
    produces:
    - sku_regulatory_requirements
    - sku_current_profile
    key_data:
    - title: Target Market Requirements
      summary: Regulatory requirements applicable to the SKU in the target market
      views:
      - view: table
        from: sku_regulatory_requirements
  - id: evaluate_compliance_gaps
    name: Evaluate Compliance Gaps
    type: agent
    after: assemble_market_profile
    description: Compares the SKU profile against market requirements to size gaps, timeline and cost.
    instruction: 'Evaluate the SKU''s current profile against the target market''s regulatory requirements to identify reformulation
      requirements, estimated approval timeline and estimated cost. Produce a findings list of each gap, a one-line readiness
      summary, and an overall readiness risk level.

      '
    produces:
    - compliance_gap_findings
    - readiness_summary
    - readiness_risk_level
  - id: readiness_gate
    name: Market Entry Readiness Review
    type: decision
    after: evaluate_compliance_gaps
    description: Regulatory Affairs reviews the gap report and decides whether the SKU is ready to enter the market.
    instruction: "Review compliance_gap_findings. Choose \"Proceed to Market Entry\" when the SKU meets the target market's\
      \ requirements with no blocking gaps; choose \"Hold \u2014 Gaps Remain\" when there is nothing to act on because material\
      \ gaps remain unresolved. Recommend \"Proceed to Market Entry\" whenever the findings show all critical requirements\
      \ are satisfied.\n"
    decision_options:
    - Proceed to Market Entry
    - "Hold \u2014 Gaps Remain"
    recommends: readiness_risk_level
    rationale_from: readiness_summary
    produces:
    - readiness_decision
    key_data:
    - title: Compliance Gap Findings
      summary: Reformulation, timeline and cost gaps for the target market
      views:
      - view: table
        from: compliance_gap_findings
  - id: record_market_entry
    name: Record Market Entry Approval
    type: notify
    after: readiness_gate
    condition: '{{readiness_decision}} == "Proceed to Market Entry"'
    description: Records the approved market-entry decision and routes the gap report to the launch owners.
    produces:
    - market_entry_record
    action:
      type: simulated
      name: record_market_entry
      config:
        summary: Market entry approved for {{product}} with resolved compliance gaps.
        findings: '{{compliance_gap_findings}}'
  related_signals_events:
  - COMP_InternationalRegulatoryChange
  - SALES_RetailerExpansionAnnouncement
  - SALES_QuickCommerceMarketExpansion
  - SALES_NewDistributionOpportunity
  - CMI_CompetitorGeographicExpansion
  - COMP_NewMarketChannelListingRequested
  - CMI_MarketEntryAssessmentInitiated
  metadata:
    version: 1
    priority: 10
    entity_optional: true
    run_steps_before_gate: true
    tools:
      skills: []
      connectors: []
      allow_unlisted_skills: false
