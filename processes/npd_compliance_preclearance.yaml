version: 1
processes:
- id: npd_compliance_preclearance
  name: New Product Compliance Pre-Clearance
  description: 'Auto-triggered when an NPD brief reaches feasibility stage. Runs a
    full FSSAI check across ingredient approvals, claim validity, label requirements,
    and channel compliance, returning a structured clearance report.

    '
  domain: Compliance
  owner: compliance_team
  definition_type: text
  applies_to:
  - entity: Products
  triggers:
  - type: schedule
    cron: 0 6 * * 1
  - type: manual
    allowed_roles:
    - ComplianceLead
    - RegulatoryAffairs
  inputs:
  - name: product
    type: reference
    references: Product
    required: false
  outputs:
  - name: clearance_decision
    type: enum
    values:
    - Clear for Development
    - "Block \u2014 Compliance Gaps"
  steps:
  - id: assemble_compliance_profile
    name: Assemble Compliance Profile
    type: agent
    description: Assembles the regulatory profile for the product from event inputs
      and gathered graph context.
    instruction: 'Reason over the NPD brief inputs and the auto-gathered graph context
      to compile the product''s ingredient list with FSSAI approval status and its
      declared marketing claims with label and channel attributes. Output the structured
      lists named in produces. Do NOT invent data beyond what is gathered; output
      empty lists where there is none.

      '
    produces:
    - ingredient_profile
    - claim_and_label_profile
    key_data:
    - title: Ingredient & Approval Profile
      summary: Ingredients with their FSSAI approval status
      views:
      - view: table
        from: ingredient_profile
  - id: evaluate_fssai_compliance
    name: Evaluate FSSAI Compliance
    type: agent
    after: assemble_compliance_profile
    description: Evaluates the assembled profile against FSSAI requirements to surface
      compliance gaps.
    instruction: 'Evaluate ingredient_profile and claim_and_label_profile against
      FSSAI ingredient approvals, claim validity rules, label requirements, and channel
      compliance. Produce a findings list of each gap or violation, a one-line summary
      of overall readiness, and a compliance risk level.

      '
    produces:
    - compliance_findings
    - compliance_summary
    - compliance_risk_level
  - id: clearance_gate
    name: Clearance Decision Gate
    type: decision
    after: evaluate_fssai_compliance
    description: Compliance reviewer decides whether the product may proceed to development.
    instruction: "Review compliance_findings. Choose \"Clear for Development\" when\
      \ no blocking FSSAI gaps remain; choose \"Block \u2014 Compliance Gaps\" when\
      \ there is nothing to act on that clears the product. Recommend \"Block \u2014\
      \ Compliance Gaps\" whenever a material unresolved finding is present.\n"
    decision_options:
    - Clear for Development
    - "Block \u2014 Compliance Gaps"
    recommends: compliance_risk_level
    rationale_from: compliance_summary
    produces:
    - clearance_decision
    key_data:
    - title: Compliance Findings
      summary: Gaps and violations identified in the FSSAI evaluation
      views:
      - view: table
        from: compliance_findings
  - id: record_clearance
    name: Record Clearance Report
    type: notify
    after: clearance_gate
    condition: '{{clearance_decision}} == "Clear for Development"'
    description: Records the clearance report and routes it to development on the
      positive branch.
    produces:
    - recorded_clearance
    action:
      type: simulated
      name: record_clearance
      config:
        summary: 'Clearance recorded for {{product}}: cleared for development.'
        findings: '{{compliance_findings}}'
  related_signals_events:
  - NPD_NewIngredientTechnologyInnovation
  - COMP_IngredientAdditiveRuleChange
  - QA_ScientificSafetyFinding
  - NPD_NPDComplianceClearanceRequired
  - NPD_ProductReadyForLaunchReview
  metadata:
    version: 1
    priority: 10
    entity_optional: true
    run_steps_before_gate: true
    tools:
      skills: []
      connectors: []
      allow_unlisted_skills: false
