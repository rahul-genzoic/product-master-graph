version: 1

processes:
  - id: regulatory_change_implementation
    name: Regulatory Change Implementation Tracking
    description: >
      When a regulation requires action, create a change plan across all affected products and
      channels, assign owners, track completion and confirm full implementation with an audit trail.
    domain: Compliance
    owner: compliance_team
    definition_type: text

    applies_to:
      - entity: Regulation

    triggers:
      - { type: schedule, cron: "0 6 * * 1" }   # weekly, Monday 06:00
      - { type: manual, allowed_roles: [ComplianceLead, RegulatoryAffairs] }

    inputs:
      - { name: regulation, type: reference, references: Regulation, required: false }

    outputs:
      - { name: change_plan_decision, type: enum, values: ["Approve Change Plan", "Hold Plan"] }

    steps:
      - id: assemble_impact
        name: Assemble Regulatory Impact
        type: agent
        description: Maps the regulation to every affected product and channel.
        instruction: >
          Reason over the triggering regulation and gathered graph context to identify all affected
          products and the channels on which they are sold. Produce a structured list of affected
          products and a structured list of affected channels. Do NOT invent data beyond what is
          gathered; output empty lists where there is none.
        produces:
          - affected_products
          - affected_channels
        key_data:
          - title: Affected Products
            summary: Products impacted by the regulation
            views:
              - { view: table, from: affected_products }

      - id: build_change_plan
        name: Build Change Plan
        type: agent
        after: assemble_impact
        description: Builds the change plan, assigns owners and evaluates readiness.
        instruction: >
          Evaluate affected_products and affected_channels to construct a change plan with assigned
          owners and target completion for each item. Produce a findings list of required changes and
          gaps, a one-line summary of implementation readiness, and an overall readiness risk level.
        produces:
          - change_findings
          - readiness_summary
          - readiness_level

      - id: change_plan_gate
        name: Change Plan Approval Gate
        type: decision
        after: build_change_plan
        description: Compliance lead reviews the change plan and decides whether to approve it.
        instruction: >
          Review change_findings. Choose "Approve Change Plan" when required changes are scoped with
          owners and the plan can proceed; choose "Hold Plan" when there is nothing to act on or the
          plan is not ready. Recommend "Approve Change Plan" whenever a material required change is present.
        decision_options: ["Approve Change Plan", "Hold Plan"]
        recommends: readiness_level
        rationale_from: readiness_summary
        produces:
          - change_plan_decision
        key_data:
          - title: Change Findings
            summary: Required changes, owners and gaps
            views:
              - { view: table, from: change_findings }

      - id: record_change_plan
        name: Record Change Plan
        type: notify
        after: change_plan_gate
        condition: '{{change_plan_decision}} == "Approve Change Plan"'
        description: Records the approved change plan and routes owner assignments with an audit trail.
        produces:
          - recorded_change_plan
        action:
          type: simulated
          name: record_change_plan
          config:
            summary: 'Approved change plan for regulation {{regulation}}'
            findings: '{{change_findings}}'

    related_signals_events: [COMP_IngredientAdditiveRuleChange, COMP_PackagingRegulationChange, COMP_EPREnvironmentalRegulationChange]   # reverse of master_data/signals_events.yaml related_processes for regulatory_change_implementation

    metadata:
      version: 1
      priority: 10
      # Demo sweep: fireable without a pivot entity (discovers its own targets).
      entity_optional: true
      run_steps_before_gate: true
      tools:
        skills: []
        connectors: []
        allow_unlisted_skills: false
