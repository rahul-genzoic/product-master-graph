        - reason
        - suggested_action
        - confidence
        - priority
        - estimated_impact
    - title: Seasonal Campaign Brief (Final Plan)
      summary: The consolidated brief across all approved sets, with the build-up
        timeline.
      views:
      - view: table
        from: flagged_campaigns
        columns:
        - store_name
        - CAMPAIGN_ID
        - PRODUCT_TYPE
        - PLATFORM
        - SEGMENTS
        - ROI
        - AD_SALES_RS
        - AD_SPEND_RS
        - category
        - reason
        - suggested_action
        - confidence
        - priority
        - estimated_impact
