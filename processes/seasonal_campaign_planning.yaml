version: 1

processes:
  # Seasonal Campaign Planning — evidence-backed recommendations for an
  # upcoming event (festival/seasonal occasion), grounded in how the SAME
  # stores/segments actually performed last time this event happened.
  #
  # Workflow: an agent step discovers every notable event coming up in India
  # (from its own knowledge of the calendar — no external skill/connector),
  # this process picks the single highest-priority one itself, then another
  # agent step resolves this year's and last year's date for it → the
  # comparable window is computed automatically from last year's date →
  # evaluate last year's (store, campaign) performance in that window with
  # the SAME evidence-based action ladder
  # campaign_planning_optimisation uses for month-to-date data → flag
  # stores with proven demand but no budget allocated yet for the upcoming
  # event month → human approval at each gate → merge into one brief with a
  # build-up timeline → Final Send Approval → email.
  #
  # Data source: RAW_MARKETING_DATA is daily ad data at the campaign grain
  # with NO store id of its own (RES_ID is a platform ad/restaurant id) — it
  # holds full multi-year history, but only V_STORE_CAMPAIGN_CURRENT's
  # CURRENT_DATE()-scoped join exposes it with a resolved store_name. This
  # process instead reads V_STORE_CAMPAIGN_HISTORY (sql/views.sql), the SAME
  # RAW_MARKETING_DATA -> STORE_CHANNEL_MAPPING join (RES_ID matched against
  # ZOMATO_ID/SWIGGY_ID) but rolled up to one row per (store, campaign,
  # CALENDAR MONTH) across all history — so "how did we do last Diwali" is
  # queryable by month instead of only "this month, live now."
  #
  # Event dates: previously manual-trigger inputs (event_date_this_year,
  # last_year_window_start, last_year_window_end) — then looked up via an
  # "Event Calendar Lookup (Web)" skill, which has since been removed from
  # assistant-backend (app/skills/event-calendar-lookup/ now holds only
  # empty cache dirs — no SKILL.md, config.json, or lookup.py left). Rather
  # than depend on a skill that no longer exists, discovery and date
  # resolution are both done directly by AGENT steps reasoning over the
  # well-known India event calendar documented in metadata.event_categories
  # below — no skill call, no connector, nothing to go missing again.
  #
  # The pipeline: discover_upcoming_events (agent step, scans today ->
  # +6 weeks using its own knowledge of the events in metadata.
  # event_categories, scoped to India since every store this graph
  # evaluates is a Zomato/Swiggy store there) -> select_top_event picks ONE
  # highest-priority candidate (soonest date) and sets `event_name` from it
  # -> lookup_event_dates (agent step) resolves THIS year's and LAST year's
  # date for that chosen event from the same calendar knowledge -> evaluate_
  # seasonal_performance. There is no manual "name an event yourself" path
  # — `event_name` is always produced by select_top_event, never a process
  # input. See the ponytail note below for what this still can't do (plan
  # more than one event per run).
  #
  # Not built here (still descoped — nothing in this graph provides it):
  # product-catalog scoring, creative or ad-copy generation, competitor
  # analysis. Inventing any of that would violate the same
  # "never recommend without evidence" rule campaign_planning_optimisation
  # follows.
  #
  # ponytail: known gaps this YAML file can't close on its own —
  # - The "Event Calendar Lookup (Web)" skill this process used to call for
  #   discover_upcoming_events/lookup_event_dates has been removed from
  #   assistant-backend entirely. Both steps are now AGENT steps that
  #   reason directly over metadata.event_categories instead — no skill,
  #   no connector, so there's no "did the skill call reach the backend"
  #   failure mode left to worry about. The only real gap now: agent
  #   knowledge of exact lunar/lunisolar festival dates (Diwali, Holi, Eid,
  #   etc.) is inherently less precise than a live web lookup would be —
  #   both agent steps are instructed to mark low-confidence guesses as
  #   such via event_lookup_confidence/discover confidence rather than
  #   assert a precise date they aren't sure of. Every downstream step
  #   still treats a failed/low-confidence lookup as "no data" or flags it
  #   plainly, so this remains a graceful degradation, not a silent one.
  # - This process plans exactly ONE event per run (the single
  #   highest-priority candidate `select_top_event` picks), not "a brief
  #   for every high-value upcoming event" as originally envisioned. Running
  #   a full evidence-based evaluation -> budget-gap -> approve -> brief ->
  #   approve -> email sequence per discovered event, in one run, would need
  #   either a "sub-process per item" primitive or a `foreach` that can loop
  #   a whole chain of agent/decision/agent/decision steps per row — this
  #   codebase's `type: foreach` (demand_forecast.yaml,
  #   customer_review_aggregation_and_triage.yaml) only loops a single
  #   terminal action per row behind one human approval, not a multi-step
  #   chain. Until one of those exists, the honest design is: one run =
  #   discover many, plan the top one; re-run for the next.
  # - HISTORICAL (audit evt_7e833717-8b93-4e45-b323-7ff473f29dfd,
  #   2026-08-03): a schedule trigger was once tried here and REMOVED after
  #   it fired with an unbindable `region` default, failed
  #   discover_upcoming_events on a missing param, and cascaded to a stuck
  #   human-approval task for an empty result. Fully moot now — this
  #   process has NO inputs at all (event_name is always produced by
  #   select_top_event, never supplied by a caller), so there is nothing
  #   left for any trigger to bind. The trigger is still manual-only below
  #   (see the triggers block) purely because nobody has decided this
  #   should run unattended on a schedule yet, not because of any binding
  #   limitation — that blocker is gone. Re-add a schedule trigger whenever
  #   that decision is made.
  # - No confirmed way to bind a manual-trigger input into a
  #   context_package gather's WHERE as a literal value — every existing
  #   process in this codebase only filters gather rows by days_until(today)
  #   or static literals, never by an arbitrary date computed at run time.
  #   Until that's confirmed supported, this process fetches
  #   V_STORE_CAMPAIGN_HISTORY unfiltered (ordered oldest month first,
  #   capped) and has the AGENT step filter to the computed window by
  #   reading MONTH — consistent with this codebase's existing design
  #   ("the LLM only filters, groups, and explains results; the SQL view
  #   already computed every metric"). Once input-binding into gather WHERE
  #   is confirmed, push the window filter down into the fetch itself.
  # - Same row-level approve/reject/edit and persisted-audit-trail gaps noted
  #   in campaign_planning_optimisation.yaml apply here too — not repeated.
  - id: seasonal_campaign_planning
    name: Seasonal Campaign Planning
    description: >
      Given an upcoming event and its comparable window last year, evaluates
      how every (store, campaign) actually performed in that window using the
      same evidence-based action ladder as Campaign Planning & Optimisation,
      flags stores with proven demand but no budget allocated yet for the
      upcoming event, and — after reviewer approval — emails the marketing
      team a seasonal campaign brief with a build-up timeline.
    domain: Marketing
    owner: marketing_team
    definition_type: text

    applies_to:
      - entity: Store
      - entity: Store
        where:
          - { field: id, op: ne, value: __none__ }

    triggers:
      # Manual only, by choice rather than necessity — see the ponytail
      # note above (a schedule trigger was once removed here for a binding
      # limitation that no longer applies now that this process has no
      # inputs at all). Kept manual until someone decides this should run
      # unattended on a schedule instead.
      - { type: manual, allowed_roles: [MarketingManager] }

    outputs:
      - {
          name: report_decision,
          type: enum,
          values: ["Send Brief", "Hold, Do Not Send", "Escalate — No Data"],
        }

    steps:
      # 0. Find every candidate event coming up in India, directly from the
      # agent's own knowledge of the calendar (no external skill/connector
      # — see header comment for why). metadata.event_categories below is
      # the taxonomy/example list to draw from, not exhaustive — the agent
      # may include a well-known India-relevant event of the same nature
      # even if its exact name isn't listed there. Scope is always India:
      # every store this graph evaluates is a Zomato/Swiggy store there,
      # so both India-specific events and globally-observed events
      # celebrated there are in scope.
      - id: discover_upcoming_events
        name: Discover Upcoming Events
        type: agent
        description: Identify every notable event coming up in India within the next 6 weeks, from the agent's own calendar knowledge.
        instruction: >
          List every notable event relevant to India (national holidays,
          cultural/religious festivals, globally-observed occasions
          celebrated there, and marketing-seasonal periods) whose date falls
          between today and 6 weeks from today. Use metadata.event_categories
          as a taxonomy and example list, not an exhaustive one — include any
          other well-known India-relevant event of the same nature that you
          are confident falls in this window.

          For each event output: title, date (this year's occurrence,
          YYYY-MM-DD), country: ["India"], event_type (one of Global,
          National, Cultural, Religious, Marketing/Seasonal, Regional,
          Industry — per metadata.event_categories), and confidence (0-1;
          use 1.0 for a fixed civil-calendar date you are certain of, e.g.
          Republic Day or Christmas; lower, e.g. 0.5, for a lunar/lunisolar
          festival date — e.g. Diwali, Holi, Eid — that shifts year to year
          and you are less certain of). Do not invent an event you don't
          actually recognize.

          If you cannot confidently identify ANY event in this window, set
          `discover_ok` to false, `discovered_events` to [], and
          `discover_error` to a one-line reason. Otherwise set `discover_ok`
          to true, `discover_error` to null, and output `discovered_events`
          as the JSON array described above.

          Answer directly from your own knowledge — do NOT call
          collect_context, run_skill, or any other tool for this. No
          calendar skill or connector is scoped to this process; a tool
          search will find nothing and is not evidence that no events
          exist.
        produces:
          - discovered_events
          - discover_ok
          - discover_error

      # 0c. Pick ONE event to plan for this run — the honest scope given
      # this engine's primitives (see ponytail note above: no per-item
      # multi-step-chain loop exists here). Soonest date wins, since that's
      # the most time-sensitive to act on; ties broken by event_type order
      # in metadata.event_categories (Global > National > Cultural >
      # Religious > Marketing/Seasonal > Regional > Industry, i.e. as
      # listed there — same order the skill's own SKILL.md table uses).
      - id: select_top_event
        name: Select Highest-Priority Discovered Event
        type: agent
        after: discover_upcoming_events
        description: Rank discovered events and select the single highest-priority one to plan for this run.
        instruction: >
          If `discover_ok` is false, or `discovered_events` is empty, do
          NOT set `event_name` — leave it unset and output a one-line
          `discovery_summary` stating plainly that no upcoming events were
          found in India within the scanned window (quoting
          `discover_error` if present). The next step (lookup_event_dates)
          will then fail gracefully on its own with an empty event_name,
          which the rest of this process already treats as "nothing to
          plan" — do not fabricate a fallback event.

          Otherwise, sort `discovered_events` by `date` ascending (soonest
          first); break ties by event_type order Global, National, Cultural,
          Religious, Marketing/Seasonal, Regional, Industry. Set `event_name`
          to the top pick's `title` (this becomes the SAME `event_name`
          every downstream step already reads). Output `discovery_summary`:
          one or two plain-language sentences naming how many events were
          found in the window, which one was selected and why (its date and
          event_type), and that the rest were left for a future run.
        produces:
          - event_name
          - discovery_summary

      # 1. Look up this year's and last year's date for `event_name`,
      # directly from the agent's own calendar knowledge (no external
      # skill/connector — see header comment). `event_name` always comes
      # from select_top_event just above. If select_top_event left
      # `event_name` unset (nothing discovered), this step has nothing to
      # resolve and fails gracefully into the same event_lookup_ok=false
      # path evaluate_seasonal_performance already handles below.
      - id: lookup_event_dates
        name: Look Up Event Dates
        type: agent
        after: select_top_event
        description: Resolve this year's and last year's date for event_name from the agent's own calendar knowledge.
        instruction: >
          If `event_name` is unset or empty, set `event_lookup_ok` to false,
          `event_lookup_error` to "no event_name to look up", and leave
          event_date_this_year/last_year_event_date/event_lookup_confidence/
          event_lookup_sources null. Stop.

          Otherwise, resolve `event_date_this_year` (this year's occurrence
          of `event_name`, YYYY-MM-DD) and `last_year_event_date` (last
          year's occurrence, YYYY-MM-DD) from your own knowledge of the
          Indian event calendar. Set `event_lookup_confidence` to "HIGH" for
          a fixed civil-calendar date you are certain of (e.g. Republic Day,
          Independence Day, Christmas, Valentine's Day), or "LOW" for a
          lunar/lunisolar festival (e.g. Diwali, Holi, Eid, Navratri) whose
          exact date you are less certain of. `event_lookup_sources` is
          always null — this is the agent's own knowledge, not a fetched
          source. Set `event_lookup_ok` to true and `event_lookup_error` to
          null.

          If you do not recognize `event_name` at all, or cannot confidently
          resolve either date, set `event_lookup_ok` to false,
          `event_lookup_error` to a one-line reason, and leave both dates
          null — do not guess.

          Answer directly from your own knowledge — do NOT call
          collect_context, run_skill, or any other tool for this. No
          calendar skill or connector is scoped to this process; a tool
          search will find nothing and is not evidence that the date is
          unresolvable.
        produces:
          - event_date_this_year
          - last_year_event_date
          - event_lookup_ok
          - event_lookup_confidence
          - event_lookup_sources
          - event_lookup_error

      # 2. Evaluate every (store, campaign) row whose MONTH falls inside the
      # comparable window computed from last year's looked-up event date —
      # using the SAME evidence-based action ladder as
      # campaign_planning_optimisation's evaluate_campaigns step, applied to
      # last year's window totals instead of this month's. Do NOT recompute
      # ROI/ROAS/CTR — already correct per row.
      - id: evaluate_seasonal_performance
        name: Seasonal Performance Evaluation & Action Recommendation
        type: agent
        after: lookup_event_dates
        description: Evaluate last year's comparable-window performance for every (store, campaign), and recommend one evidence-backed action per row for this year's event.
        instruction: >
          FIRST, check `event_lookup_ok`. If it is false/absent, or
          `event_date_this_year`/`last_year_event_date` is missing,
          lookup_event_dates could not resolve `event_name`
          (`event_lookup_error` has the reason, e.g. an unrecognized event
          name) — output
          `seasonal_action_suggestions: []`, `last_year_window_start`/
          `last_year_window_end` as null, and a one-line
          `seasonal_performance_summary` stating plainly that the event
          calendar lookup failed and no dates could be determined
          automatically for `event_name`, quoting `event_lookup_error` if
          present. Do NOT guess a date or invent a window when the lookup
          failed. Stop — do not evaluate anything below.

          Otherwise, compute the comparable window from
          `last_year_event_date`: `last_year_window_start` =
          `last_year_event_date` minus
          metadata.lookup_rules.comparison_window_before_days (42) days;
          `last_year_window_end` = `last_year_event_date` plus
          metadata.lookup_rules.comparison_window_after_days (7) days. Output
          both as `last_year_window_start`/`last_year_window_end` (dates) —
          every downstream step and the final email reference them by these
          names.

          `seasonal_campaign_history` is fetched from V_STORE_CAMPAIGN_HISTORY
          — one row per (store, campaign, MONTH) across ALL history, each
          with AD_SPEND_RS, AD_SALES_RS, AD_ORDERS, ROI, ROAS, CTR,
          ADS_M2O_PCT, and OVERALL_M2O_PCT already pre-computed for that
          month, plus WINDOW_START/WINDOW_END (the actual date span rolled
          into that row) and TARGETING/SEGMENTS. Do NOT recompute ROI, ROAS,
          CTR, or either M2O_PCT — they are already correct per row.

          Keep only rows whose MONTH falls inside the inclusive range
          [`last_year_window_start`, `last_year_window_end`] just computed
          (compare by calendar month — a row's MONTH is the first day of
          that month). Discard every other row before evaluating anything;
          they belong to a different period and must never be cited as
          evidence for `event_name`. If NO rows survive this filter, output
          `seasonal_action_suggestions: []` and stop — do not guess at
          similar events or invent numbers for a store/segment with no data
          in this window; state plainly in a one-line
          `seasonal_performance_summary` that no historical data exists for
          this window, rather than fabricating one.

          Otherwise, evaluate EVERY surviving row — every store that has
          data in this window, not only the strongest performers. The
          customer-acquisition SEGMENTS a campaign targets is the meaningful
          grouping here, not PRODUCT_TYPE (carry PRODUCT_TYPE on each row
          only as a reference field). SEGMENTS values are store-specific —
          never treat a SEGMENTS value at one store as equivalent to the
          same-named value at a different store; every comparison stays
          within one store_name.

          Assign exactly one `suggested_action` per row from this
          evidence-based ladder — identical to Campaign Planning &
          Optimisation's ladder, applied here to last year's WINDOW totals
          instead of month-to-date. Never assign an action without citing
          its evidence in `reason` — ROI alone is not evidence; cite ROI
          plus at least one of ROAS / AD_SPEND_RS / AD_SALES_RS / the
          ADS_M2O_PCT vs OVERALL_M2O_PCT comparison — AND, in the same
          `reason`, add one further sentence in plain business language
          explaining what that evidence means for `event_name` this year and
          why it leads to this suggested_action. Every `reason` must be
          composed fresh from this row's own figures — never copy or lightly
          reword another row's reason, and never state a trend, prediction,
          or cause that isn't directly computable from this row's own
          columns:
            0a. AD_SPEND_RS = 0: suggested_action = "cannot_evaluate",
               category = "no_spend", reason states there is no spend to
               evaluate a return on for this window. Skip every other rung.
            0b. AD_ORDERS < 5 (metadata.campaign_rules.not_enough_data.min_ad_orders):
               suggested_action = "not_enough_data", category = "insufficient_sample",
               reason cites AD_ORDERS and AD_SPEND_RS and states plainly the
               sample from this window is too small to draw a conclusion
               from. Skip every other rung.
            1. ROI = 0 (AD_SALES_RS = 0 — real spend converted to zero
               attributed sales; its own rung, not lumped with a merely-weak
               ROI=0.43 window, since it can mean true failure, an
               attribution gap, or a timing artifact, and the reason must
               name which is most likely from this row's own AD_SPEND_RS/
               AD_ORDERS): suggested_action = "avoid_repeat"; category =
               "critical_failure" if AD_SPEND_RS >= 200
               (metadata.campaign_rules.critical_failure.min_spend_rs) else
               "underperforming". reason cites AD_SPEND_RS and AD_ORDERS,
               explains none of that spend converted last time, and — for
               critical_failure only — explicitly recommends NOT repeating
               this campaign as-is for `event_name` this year and instead
               redirecting that budget toward a segment/platform that did
               convert (see seasonal_budget_gaps).
            2. 0 < ROI < 0.75: suggested_action = "avoid_repeat", category =
               "underperforming", reason cites the ROI plus AD_SPEND_RS and
               AD_SALES_RS, explains this lost money last time relative to
               spend, and recommends not repeating it at the same spend
               level for `event_name` this year.
            3. 0.75 <= ROI < 1.0: suggested_action = "repeat_reduced_budget",
               category = "weak", reason cites the ROI and — if ADS_M2O_PCT
               is at least 5 percentage points below OVERALL_M2O_PCT — cites
               both percentages and explains ads converted materially worse
               than the store's own average that window; otherwise states
               plainly there's a modest loss without a clear conversion-gap
               cause and that spend should start lower this year while the
               cause is investigated.
            4. 1.0 <= ROI < 1.5 (break-even — NOT a "stop" or an "increase",
               genuinely ambiguous with the evidence available):
               suggested_action = "repeat_same_budget", category =
               "breakeven", reason cites the ROI and states plainly this was
               roughly break-even — no clear case to cut or grow spend for
               `event_name` this year, repeat at the same level and
               re-evaluate.
            5. 1.5 <= ROI < 2.5: suggested_action =
               "repeat_increased_budget_cautious", category = "good", reason
               cites the ROI and the ADS_M2O_PCT vs OVERALL_M2O_PCT
               comparison, explains a positive return with this conversion
               performance means the store can likely absorb somewhat more
               spend for `event_name` this year, and explicitly frames this
               as a cautious/modest increase.
            6. 2.5 <= ROI <= 10: suggested_action =
               "repeat_increased_budget_confident", category = "excellent",
               reason cites the ROI, AD_SPEND_RS, and the SEGMENTS this
               campaign targeted, and explains this is proven seasonal
               demand at a real spend level worth capturing with more budget
               this year rather than leaving it capped again.
            7. ROI > 10: suggested_action = "validate_before_repeating",
               category = "outlier", reason cites the ROI plus AD_SPEND_RS
               and AD_ORDERS and states plainly a ROI this high from one
               window is most often a small-spend or small-sample artifact,
               so it needs a human look before being trusted as a repeatable
               seasonal result — do NOT recommend increasing budget or treat
               this row as proof of anything on this number alone.

          For every row (rungs 1-7 only; rungs 0a/0b always get confidence
          "LOW", priority "LOW", estimated_impact null), also set:
            `confidence`: "HIGH" if AD_ORDERS >= 20 AND ROI is at least 0.3
              away from the nearest ladder boundary (0.75, 1.0, 1.5, 2.5, or
              10); "LOW" if AD_ORDERS < 20 OR ROI is within 0.1 of a boundary
              OR suggested_action is "validate_before_repeating" (always
              LOW); "MEDIUM" otherwise.
            `priority`: "HIGH" if AD_SPEND_RS >= 5000
              (metadata.campaign_rules.priority.high_spend_rs_gte) AND
              suggested_action is "avoid_repeat" or starts with
              "repeat_increased_budget" — real money is on the line; "LOW"
              if AD_SPEND_RS < 1000 (.priority.low_spend_rs_lt) OR
              suggested_action is "repeat_same_budget" or
              "validate_before_repeating"; "MEDIUM" otherwise.
            `estimated_impact`: a short rupee estimate for `event_name` this
              year, always caveated as approximate and based on last year's
              window, never presented as a precise forecast —
              "avoid_repeat": "~₹<AD_SPEND_RS> not worth repeating at that
              spend, based on last year"; "repeat_reduced_budget": "~₹
              <AD_SPEND_RS × campaign_rules.reduce_budget.reduce_pct%> lower
              spend suggested, assuming ROI holds"; "repeat_increased_budget_cautious"/
              "repeat_increased_budget_confident": "~₹<AD_SPEND_RS ×
              increase_pct% × ROI> additional sales if this segment performs
              similarly to last year (returns typically diminish as spend
              grows)"; "repeat_same_budget"/"validate_before_repeating": null.

          If `seasonal_campaign_history` has no rows in the requested window,
          return `seasonal_action_suggestions: []`. Otherwise output
          `seasonal_action_suggestions`: a JSON array, one object per
          surviving row, with exactly these keys: store_name, CAMPAIGN_ID,
          PRODUCT_TYPE, PLATFORM, SEGMENTS, MONTH, ROI, ROAS, AD_SALES_RS,
          AD_SPEND_RS, AD_ORDERS, ADS_M2O_PCT, OVERALL_M2O_PCT, category,
          reason, suggested_action, confidence, priority, estimated_impact.
          Also output `seasonal_performance_summary`: one or two plain-
          language sentences on the overall shape of last year's window
          (e.g. how many stores had data, and the rough split between
          repeat/avoid/increase calls) — never a per-row restatement.
          Prepend `discovery_summary` as its own sentence first, so the
          reader knows how this event was auto-selected.
        produces:
          - seasonal_action_suggestions
          - seasonal_performance_summary
          - last_year_window_start
          - last_year_window_end

      # 2-GATE. Approve — every evaluated (store, campaign) row's recommended action.
      - id: approve_seasonal_actions
        name: Approve Seasonal Actions
        type: decision
        after: evaluate_seasonal_performance
        # Skip this gate — not just "recommend REJECT" — when there's
        # nothing to review (event lookup/discovery failed, or genuinely no
        # historical data in the window), same pattern as
        # approve_seasonal_budget_gaps below. Added after audit
        # evt_7e833717-8b93-4e45-b323-7ff473f29dfd showed a real run
        # parking at this gate with an empty list and no human ever picking
        # it up — create_seasonal_campaign_brief already treats a missing
        # decision the same as APPROVE, so skipping here is safe.
        condition: "{{seasonal_action_suggestions}} != []"
        description: Marketing manager approves or rejects the recommended actions for the upcoming event.
        instruction: >
          Review `seasonal_action_suggestions` — every (store, campaign)'s
          recommended action for `event_name` this year, based on last
          year's comparable window, each with an evidence-backed reason.
          Recommend APPROVE to carry these into the final brief, REJECT to
          hold the whole batch back this run (e.g. the event's scale or
          timing has materially changed this year).

          `seasonal_action_suggestions` is already provided above — do NOT
          call collect_context or any other tool to search for or verify it.
          A tool search for this fact will find nothing (it is a process
          fact, not a graph entity) and an empty tool result does NOT mean
          the data is missing; judge only what's already given to you.
        decision_options: [APPROVE, REJECT]
        rationale_from: seasonal_action_suggestions
        produces:
          - seasonal_actions_decision
        key_data:
          - title: Seasonal Action Recommendations
            summary: Every (store, campaign) with data in last year's comparable window, evaluated with an evidence-backed action for this year.
            views:
              - view: table
                from: seasonal_action_suggestions
                columns:
                  [
                    store_name,
                    CAMPAIGN_ID,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    MONTH,
                    ROI,
                    ROAS,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                    ADS_M2O_PCT,
                    OVERALL_M2O_PCT,
                    category,
                    reason,
                    suggested_action,
                    confidence,
                    priority,
                    estimated_impact,
                  ]

      # 3. Budget-gap discovery — proven seasonal demand with no budget
      # allocated yet for the upcoming event month. Runs off
      # evaluate_seasonal_performance directly (not gated behind approval),
      # same reasoning as find_expansion_opportunities in
      # campaign_planning_optimisation.
      - id: find_seasonal_budget_gaps
        name: Seasonal Budget Gap Discovery
        type: agent
        after: evaluate_seasonal_performance
        description: Flag stores with proven seasonal demand last year but no budget allocated yet for this year's event month.
        instruction: >
          `segment_budget` is fetched from V_SEGMENT_BUDGET — one row per
          (store, channel, BUDGET_MONTH) with ALLOCATED_BUDGET_RS. Keep only
          rows whose BUDGET_MONTH equals the calendar month of
          `event_date_this_year` — that is the budget that would fund
          `event_name` this year.

          For every store with at least one row in
          `seasonal_action_suggestions` where suggested_action starts with
          "repeat_increased_budget" (a genuine proven result last year —
          never "validate_before_repeating": that rung is an unvalidated
          artifact, not proof of anything) AND AD_SPEND_RS >=
          metadata.expansion_rules.min_proof_point_spend_rs (500) AND
          AD_ORDERS >= metadata.expansion_rules.min_proof_point_orders (20),
          check whether that store + the proof-point campaign's PLATFORM has
          ANY `segment_budget` row this event month with ALLOCATED_BUDGET_RS
          > 0. If not, add ONE row: category = "seasonal_budget_gap",
          suggested_action = "allocate_budget_for_event", CAMPAIGN_ID = the
          proof-point CAMPAIGN_ID (reference only), PRODUCT_TYPE, PLATFORM,
          SEGMENTS, ROI, AD_SALES_RS, AD_SPEND_RS, ADS_M2O_PCT,
          OVERALL_M2O_PCT copied verbatim from that proof-point row — never
          invent numbers. reason = one line naming the proof point's ROI and
          stating plainly no budget is allocated yet for `event_name` this
          year on that platform at this store. confidence = "MEDIUM" (real
          evidence, from one window, not a controlled test). priority =
          "HIGH" if the proof-point's AD_SPEND_RS >=
          metadata.campaign_rules.priority.high_spend_rs_gte, else "MEDIUM".
          estimated_impact = "~₹<proof-point AD_SALES_RS> if this segment
          performs similarly to last year (approximate — no budget currently
          allocated to fund it)".

          A store with no qualifying proof-point row, or one that already
          has budget allocated this event month on that platform, gets no
          row. If no store qualifies, return `seasonal_budget_gaps: []`.
          Otherwise output `seasonal_budget_gaps`: a JSON array with exactly
          these keys: store_name, CAMPAIGN_ID, PRODUCT_TYPE, PLATFORM,
          SEGMENTS, ROI, AD_SALES_RS, AD_SPEND_RS, ADS_M2O_PCT,
          OVERALL_M2O_PCT, category, reason, suggested_action, confidence,
          priority, estimated_impact.
        produces:
          - seasonal_budget_gaps

      # 3-GATE. Approve — Seasonal Budget Gaps.
      - id: approve_seasonal_budget_gaps
        name: Approve Seasonal Budget Gap Suggestions
        type: decision
        after: find_seasonal_budget_gaps
        condition: "{{seasonal_budget_gaps}} != []"
        description: Marketing manager approves or rejects the budget-gap suggestions.
        instruction: >
          Review `seasonal_budget_gaps` — stores with proven demand for
          `event_name` last year but no budget allocated yet this year, each
          modeled on a specific proof-point campaign. Recommend APPROVE to
          carry these into the final brief, REJECT to hold them back this
          run (e.g. budget is already committed elsewhere).

          `seasonal_budget_gaps` is already provided above — do NOT call
          collect_context or any other tool to search for or verify it. A
          tool search for this fact will find nothing (it is a process fact,
          not a graph entity) and an empty tool result does NOT mean the
          data is missing; judge only what's already given to you.
        decision_options: [APPROVE, REJECT]
        rationale_from: seasonal_budget_gaps
        produces:
          - seasonal_budget_decision
        key_data:
          - title: Seasonal Budget Gaps
            summary: Stores with proven demand for this event last year but no budget allocated yet this year.
            views:
              - view: table
                from: seasonal_budget_gaps
                columns:
                  [
                    store_name,
                    CAMPAIGN_ID,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    ROI,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                    reason,
                    suggested_action,
                    confidence,
                    priority,
                    estimated_impact,
                  ]

      # 4. Merge approved sets + a build-up timeline. The timeline is pure
      # calendar arithmetic off event_date_this_year (no data claim, so it's
      # safe to generate directly), NOT another evidence-backed claim.
      - id: create_seasonal_campaign_brief
        name: Seasonal Campaign Brief
        type: agent
        after: approve_seasonal_budget_gaps
        description: Merge the approved seasonal-action and budget-gap suggestions into one brief, with a build-up timeline.
        instruction: >
          `seasonal_action_suggestions` is governed by
          `seasonal_actions_decision`; `seasonal_budget_gaps` is governed
          separately by `seasonal_budget_decision`. A decision fact is
          present only when there was something to review; when the
          underlying suggestion list was already empty the gate was skipped
          and its decision fact won't exist — treat a missing decision the
          same as APPROVE. Include a set in `flagged_campaigns` UNLESS its
          governing decision is exactly "REJECT".

          Concatenate the included sets — `seasonal_action_suggestions`,
          then `seasonal_budget_gaps` — into `flagged_campaigns`: a JSON
          array, each item already shaped with store_name, CAMPAIGN_ID,
          PRODUCT_TYPE, PLATFORM, SEGMENTS, ROI, AD_SALES_RS, AD_SPEND_RS,
          category, reason, suggested_action, confidence, priority,
          estimated_impact from the steps that produced them — a straight
          carry-over, never invent or recompute any of them. Sort by
          `priority` (HIGH first, then MEDIUM, then LOW), preserving
          original relative order within each band. If nothing is included,
          return `flagged_campaigns: []`. Never return null, a string, or
          omit the field.

          Also output `seasonal_timeline`: a plain list of 8 lines, computed
          purely from calendar arithmetic on `event_date_this_year` (never
          treat this as data-backed, it is a schedule, not a forecast):
          "Week -6 (<date, 42 days before>): Planning", "Week -5 (<35 days
          before>): Creative production", "Week -4 (<28 days before>):
          Landing page ready", "Week -3 (<21 days before>): Email setup",
          "Week -2 (<14 days before>): Ads live", "Week -1 (<7 days
          before>): Reminder campaign", "<event_date_this_year>: Peak
          promotions", "<event_date_this_year + 7 days>: Performance
          review". Compute each date by subtracting/adding the stated number
          of days from `event_date_this_year`.

          `flagged_summary`: plain business language grouped by
          suggested_action, naming the specific action, citing its reason,
          and — whenever `estimated_impact` is not null — appending it in
          parentheses. If a set was rejected at its gate, note that plainly.
          If `flagged_campaigns` is empty overall, `flagged_summary` = "No
          historical data was found for this event window." if
          `seasonal_campaign_history` had no rows in the requested window,
          else "All suggestions were reviewed and held back this run."
          Describe actions only — do not paste the raw table or restate
          every metric already in `flagged_campaigns`.
        produces:
          - flagged_campaigns
          - flagged_summary
          - seasonal_timeline

      # 5. GATE — Final Send Approval.
      - id: review
        name: Final Send Approval
        type: decision
        after: create_seasonal_campaign_brief
        description: Marketing manager confirms sending the consolidated seasonal brief (or escalates if there was no historical data at all).
        instruction: >
          Review flagged_summary, flagged_campaigns, and seasonal_timeline —
          the CONSOLIDATED plan from the two gates above (each already
          approved or rejected individually). This gate is about whether to
          SEND it, not re-litigate each set. Recommend "Escalate — No Data"
          if `event_lookup_ok` was false (lookup_event_dates couldn't
          resolve `event_name` — nothing to review or send, see
          `event_lookup_error`), OR if `seasonal_campaign_history` had NO
          rows at all in [`last_year_window_start`, `last_year_window_end`]
          — nothing to review or send. An empty `flagged_campaigns` with historical data
          present is a different, normal case — every set was rejected above
          — and is NOT a reason to escalate; recommend "Send Brief" in that
          case too, since a "nothing flagged" brief is still worth sending.
          Only recommend "Hold, Do Not Send" if flagged_summary itself looks
          wrong or incomplete (e.g. contradicts flagged_campaigns) and
          shouldn't go out as-is.

          `flagged_summary`, `flagged_campaigns`, and `seasonal_timeline` are
          already provided above — do NOT call collect_context or any other
          tool to search for or verify them. A tool search for these facts
          will find nothing (they are process facts, not graph entities) and
          an empty tool result does NOT mean the data is missing; judge only
          what's already given to you.
        decision_options: ["Send Brief", "Hold, Do Not Send", "Escalate — No Data"]
        rationale_from: flagged_summary
        produces:
          - report_decision
        key_data:
          - title: Seasonal Campaign Brief
            summary: Evidence-backed actions and budget gaps for the upcoming event, plus the build-up timeline.
            views:
              - view: table
                from: flagged_campaigns
                columns:
                  [
                    store_name,
                    CAMPAIGN_ID,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    ROI,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                    category,
                    reason,
                    suggested_action,
                    confidence,
                    priority,
                    estimated_impact,
                  ]
          - title: Last Year's Comparable-Window Performance
            summary: Every (store, campaign) row in the requested historical window.
            views:
              - view: table
                from: seasonal_campaign_history
                columns:
                  [
                    store_name,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    MONTH,
                    ROI,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                  ]

      # 6. Execute — email, via the same Genzoic Email Formatter skill used
      # by campaign_planning_optimisation, only on APPROVE.
      - id: notify
        name: Email Seasonal Campaign Brief
        type: notify
        after: review
        condition: '{{report_decision}} == "Send Brief"'
        description: On approve, format and email the marketing team the seasonal campaign brief.
        produces:
          - report_sent
        action:
          type: skill
          config:
            type: skill
            skill: "genzoic-email-formatter"
            operation: send
            args:
              to: "rahul.ab@genzoic.com"
              subject: "Seasonal Campaign Brief — {{event_name}}"
              title: "Seasonal Campaign Planning — {{event_name}}"
              intro: >-
                Evaluated against last year's comparable window
                ({{last_year_window_start}} to {{last_year_window_end}}) for
                {{event_name}} on {{event_date_this_year}} — dates resolved
                automatically from the agent's own event-calendar knowledge,
                confidence: {{event_lookup_confidence}} (Zomato/Swiggy
                only, Meta/Google pending warehouse). {{flagged_summary}}
              sections:
                - type: table
                  caption: "Flagged actions and budget gaps — action, data, and reason"
                  columns:
                    [
                      store_name,
                      CAMPAIGN_ID,
                      PRODUCT_TYPE,
                      PLATFORM,
                      SEGMENTS,
                      ROI,
                      AD_SALES_RS,
                      AD_SPEND_RS,
                      category,
                      reason,
                      suggested_action,
                      priority,
                      confidence,
                      estimated_impact,
                    ]
                  records: "{{flagged_campaigns}}"
                - type: text
                  caption: "Build-up timeline"
                  body: "{{seasonal_timeline}}"
              footer_note: "Generated automatically by the Seasonal Campaign Planning process."

      # 7. Hold, no email — REJECT branch.
      - id: hold_no_action
        name: Hold Without Sending
        type: notify
        after: review
        condition: '{{report_decision}} == "Hold, Do Not Send"'
        description: Reviewed and held — no email sent this run.
        action:
          type: simulated
          config:
            note: "Seasonal campaign brief reviewed and held — no email sent this run."

      # 8. Escalate — ESCALATE branch (event lookup failed, or no historical
      # data for the computed window).
      - id: escalate_review
        name: Escalate — No Historical Data
        type: notify
        after: review
        condition: '{{report_decision}} == "Escalate — No Data"'
        description: Event date lookup failed, or no historical data found for the computed window — escalate for review.
        action:
          type: simulated
          config:
            note: "Seasonal campaign planning escalated — either event_name's date could not be resolved, or no historical campaign data was found for the computed window."

    metadata:
      version: 1
      priority: 15

      # Same thresholds as campaign_planning_optimisation.metadata.campaign_rules
      # — the ladder is the same business policy, just evaluated against last
      # year's window totals instead of month-to-date. Keep these two files'
      # numbers in sync if the policy changes; the ladder text in
      # evaluate_seasonal_performance above must stay numerically in sync too
      # (agent instructions are plain text, not templated from metadata).
      campaign_rules:
        cannot_evaluate:
          spend_eq_0: true
        not_enough_data:
          min_ad_orders: 5
        critical_failure:
          roi_eq_0: true
          min_spend_rs: 200
        avoid_repeat:
          roi_lt: 0.75
        repeat_reduced_budget:
          roi_between: [0.75, 1.0]
          reduce_pct: 30
        repeat_same_budget:
          roi_between: [1.0, 1.5]
        repeat_increased_budget_cautious:
          roi_between: [1.5, 2.5]
          increase_pct: 15
        repeat_increased_budget_confident:
          roi_between: [2.5, 10.0]
          increase_pct: 30
        validate_before_repeating:
          roi_gt: 10.0
        priority:
          high_spend_rs_gte: 5000
          low_spend_rs_lt: 1000

      expansion_rules:
        min_proof_point_spend_rs: 500
        min_proof_point_orders: 20
        max_proof_point_roi: 10.0

      # Comparable-window offsets around last year's looked-up event date —
      # single source of truth so the window is never hardcoded inline;
      # evaluate_seasonal_performance's instruction above must stay
      # numerically in sync (agent instructions are plain text, not
      # templated from metadata — same caveat as campaign_rules above and in
      # campaign_planning_optimisation.yaml). The discovery scan window
      # (today through +6 weeks) is hardcoded directly in
      # discover_upcoming_events's instruction above, not sourced from
      # metadata — there's no external skill default to inherit anymore.
      lookup_rules:
        comparison_window_before_days: 42
        comparison_window_after_days: 7

      # event_type taxonomy used by discover_upcoming_events/select_top_event
      # above — the agent classifies each discovered event into one of
      # these seven nature-shaped types. The example lists below are NOT an
      # exhaustive candidate calendar (discover_upcoming_events may include
      # a well-known event of the same nature even if unlisted here) —
      # they're a reference/example list scoped to what's relevant for
      # India, since that's this process's fixed scan country.
      event_categories:
        Global:
          [
            "Valentine's Day", "Earth Day", "International Yoga Day",
            "World Environment Day", "Mother's Day", "Father's Day",
            "Halloween", "Black Friday", "Cyber Monday",
          ]
        National:
          ["Republic Day", "Independence Day", "Gandhi Jayanti"]
        Cultural:
          ["Diwali", "Holi", "Navratri", "Dussehra", "Onam", "Pongal"]
        Religious:
          [
            "Christmas", "Eid", "Janmashtami", "Raksha Bandhan",
            "Durga Puja", "Ganesh Chaturthi",
          ]
        Marketing/Seasonal:
          [
            "Back to School", "Wedding Season", "Summer Sale", "Winter Sale",
            "Monsoon Season", "End of Season Sale", "New Year Sale",
            "Financial Year End", "Festive Shopping Season", "Prime Day",
            "Independence Sale", "Big Billion Days", "Great Indian Festival",
          ]
        Regional:
          ["Vishu", "Baisakhi", "Bihu", "Gudi Padwa", "Mysuru Dasara"]
        Industry:
          ["World Milk Day", "International Coffee Day", "National Pet Day"]

      # Pre-fetch full campaign history (unfiltered by date — see the
      # ponytail note at the top of this file) plus every segment_budget row
      # (BUDGET_MONTH is not scoped to "this month" in V_SEGMENT_BUDGET, so
      # it already covers the upcoming event month once it's created).
      context_package:
        - key: seasonal_campaign_history
          required: true
          gather:
            base:
              entity: Store
              dataset: V_STORE_CAMPAIGN_HISTORY
              columns:
                [
                  MASTER_STORE_ID,
                  CAMPAIGN_ID,
                  MONTH,
                  PLATFORM,
                  PRODUCT_TYPE,
                  TARGETING,
                  SEGMENTS,
                  WINDOW_START,
                  WINDOW_END,
                  AD_SPEND_RS,
                  AD_SALES_RS,
                  AD_ORDERS,
                  ROI,
                  ADS_M2O_PCT,
                  OVERALL_M2O_PCT,
                  ROAS,
                  CTR,
                ]
              order_by: MONTH
              order_dir: asc
              limit: 20000
          post:
            resolve:
              - { field: MASTER_STORE_ID, type: Store, as: store_name }
        - key: segment_budget
          required: true
          gather:
            base:
              entity: Store
              dataset: V_SEGMENT_BUDGET
              columns:
                [
                  MASTER_STORE_ID,
                  CHANNEL,
                  BUDGET_MONTH,
                  ALLOCATED_BUDGET_RS,
                  EXPECTED_REVENUE_RS,
                ]
              limit: 5000
          post:
            resolve:
              - { field: MASTER_STORE_ID, type: Store, as: store_name }

      key_data:
        - title: Discovered Upcoming Events
          summary: Every event discover_upcoming_events identified in India within the scan window.
          views:
            - view: table
              from: discovered_events
              columns: [title, date, country, event_type, confidence]
        - title: Last Year's Comparable-Window Performance
          summary: Every (store, campaign) row in the requested historical window.
          views:
            - view: table
              from: seasonal_campaign_history
              columns: [store_name, PRODUCT_TYPE, PLATFORM, SEGMENTS, MONTH, ROI, AD_SALES_RS, AD_SPEND_RS]
        - title: Seasonal Action Recommendations
          summary: Every (store, campaign) with data in last year's window, evaluated with an evidence-backed action for this year.
          views:
            - view: table
              from: seasonal_action_suggestions
              columns:
                [
                  store_name,
                  CAMPAIGN_ID,
                  PRODUCT_TYPE,
                  PLATFORM,
                  SEGMENTS,
                  MONTH,
                  ROI,
                  ROAS,
                  AD_SALES_RS,
                  AD_SPEND_RS,
                  category,
                  reason,
                  suggested_action,
                  confidence,
                  priority,
                  estimated_impact,
                ]
        - title: Seasonal Budget Gaps
          summary: Stores with proven demand for this event last year but no budget allocated yet this year.
          views:
            - view: table
              from: seasonal_budget_gaps
              columns:
                [
                  store_name,
                  CAMPAIGN_ID,
                  PRODUCT_TYPE,
                  PLATFORM,
                  SEGMENTS,
                  ROI,
                  AD_SALES_RS,
                  AD_SPEND_RS,
                  reason,
                  suggested_action,
                  confidence,
                  priority,
                  estimated_impact,
                ]
        - title: Seasonal Campaign Brief (Final Plan)
          summary: The consolidated brief across all approved sets, with the build-up timeline.
          views:
            - view: table
              from: flagged_campaigns
              columns:
                [
                  store_name,
                  CAMPAIGN_ID,
                  PRODUCT_TYPE,
                  PLATFORM,
                  SEGMENTS,
                  ROI,
                  AD_SALES_RS,
                  AD_SPEND_RS,
                  category,
                  reason,
                  suggested_action,
                  confidence,
                  priority,
                  estimated_impact,
                ]

      tools:
        skills: ["genzoic-email-formatter"]
        allow_unlisted_skills: false
        connectors: []
