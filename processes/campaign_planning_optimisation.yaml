version: 1

processes:
  # Campaign Planning & Optimisation — iterative campaign management.
  # Workflow: Read current campaigns → Evaluate every active campaign →
  # Recommend one evidence-backed action per campaign → Discover new
  # opportunities → Generate recommendations → Human approval → Execute
  # (email today, Zomato/Swiggy API later).
  #
  # Focus is improving every store, not just top performers. Every
  # recommendation must cite metrics (ROI, ROAS, spend, sales, orders,
  # conversion); never recommend changes without evidence.
  #
  # Reads V_STORE_CAMPAIGN_CURRENT (sql/views.sql), which pre-computes the
  # current month's campaign metrics. The LLM only filters, groups, and
  # explains results—no metric calculations.
  #
  # Current limitations:
  # - Live view for CURRENT_DATE() only; no historical/week-over-week analysis.
  # - Supports Zomato/Swiggy only; extend with SOURCE_SYSTEM when Meta/Google
  #   data is available.
  # - Advanced capabilities (business context, impact simulation, learning,
  #   campaign planning, outcome tracking) are deferred until supporting
  #   datasets and persistence exist.
  #
  # Uses real agentic `steps` (agent|decision|notify); no
  # metadata.steps_display_only.
  #
  # ponytail: known gaps that need engine/data changes this YAML file can't
  # make on its own — not silently dropped, just not fakeable here:
  # - Row-level approve/reject/edit: every `decision` step in this codebase
  #   (approve_actions, approve_expansion, review) produces ONE enum for the
  #   whole batch, not per-row edits. True per-campaign review needs a
  #   decision-step type that captures a list of {id, verdict, edit}, plus a
  #   `final_action` field threaded through create_action_plan.
  # - Persisted audit trail (input → rule → reason → review → final action →
  #   email sent): everything here is in-run process facts, nothing is
  #   written to a durable store. Needs a table + write step.
  # - Multi-channel dispatch (Slack/API/webhook alongside email): only the
  #   `skill`/`notify`/`simulated` action types exist; add channels as new
  #   `notify` steps once those connectors exist, no restructuring needed.
  # - Outcome tracking / feedback loop (did ROI improve after we acted):
  #   needs a persisted "what we recommended" store plus a follow-up job
  #   that re-reads campaign_comparison N days later and joins back to it.
  #   Add once that persistence exists.
  - id: campaign_planning_optimisation
    name: Campaign Planning & Optimisation
    description: >
      Reads currently-running ad-campaign performance by campaign and by dark
      store, and evaluates EVERY campaign — not only the top performers —
      recommending one evidence-backed action per row: stop, reduce budget,
      needs investigation, or increase budget (carefully, when the evidence
      supports it), plus new-campaign
      opportunities (strategic expansion into an uncovered customer segment).
      After the reviewer confirms, the summary is emailed to the marketing
      team as the action to take.
    domain: Marketing
    owner: marketing_team
    definition_type: text

    # Attach to every Store (the filter binding is what lets a manual run find it).
    applies_to:
      - entity: Store
      - entity: Store
        where:
          - { field: id, op: ne, value: __none__ }

    triggers:
      # TODO: campaign_performance_review isn't emitted onto the process bus
      # anywhere yet — the schedule and manual triggers are what actually fire.
      - { type: schedule, cron: "0 6 * * 1" } # weekly, Monday 06:00
      - { type: event, event_type: campaign_performance_review }
      - { type: manual, allowed_roles: [MarketingManager] }

    outputs:
      - {
          name: report_decision,
          type: enum,
          values: [APPROVE, REJECT, ESCALATE],
        }

    steps:
      # 1. Read (context_package already fetched campaign_comparison, whose
      # ROI/ROAS/CTR/M2O columns already ARE the KPI calculation) + evaluate
      # EVERY row — every store with campaign data, not only outliers — into
      # one evidence-backed action each.
      - id: evaluate_campaigns
        name: Campaign Performance Evaluation & Action Recommendation
        type: agent
        description: Evaluate every currently-running campaign, across every store, and recommend one evidence-backed action per row.
        instruction: >
          `campaign_comparison` is ALREADY assembled: each row is one
          (store, campaign) currently running this month, with AD_SPEND_RS,
          AD_SALES_RS, AD_ORDERS, ROI, ROAS, CTR, ADS_M2O_PCT (menu-to-order
          conversion driven by ads), and OVERALL_M2O_PCT (the store's overall
          conversion) pre-computed month-to-date, plus TARGETING and SEGMENTS
          describing who the campaign targets. Do NOT recompute ROI, ROAS,
          CTR, or either M2O_PCT — they are already correct per row. This is
          a live snapshot (this month, campaigns running now) — there is no
          week-over-week trend available, so never invent or imply one. It
          covers Zomato/Swiggy campaigns only (RAW_MARKETING_DATA);
          Meta/Google spend is not yet in the BigQuery warehouse — state
          this gap explicitly, don't present the numbers as full-funnel.

          Do not call any tool, skill, or connector. Evaluate EVERY row in
          `campaign_comparison` — every store that has campaign data, not
          only the strongest performers. The customer-acquisition SEGMENTS a
          campaign targets is the meaningful grouping here, not PRODUCT_TYPE
          (carry PRODUCT_TYPE on each row only as a reference field). SEGMENTS
          values are store-specific — never treat a SEGMENTS value at one
          store as equivalent to the same-named value at a different store;
          every comparison stays within one store_name.

          Assign exactly one `suggested_action` per row from this
          evidence-based ladder. Never assign an action without citing its
          evidence in `reason` — ROI alone is not evidence; cite ROI plus at
          least one of ROAS / AD_SPEND_RS / AD_SALES_RS / the ADS_M2O_PCT vs
          OVERALL_M2O_PCT comparison — AND, in the same `reason`, add one
          further sentence in plain business language explaining what that
          evidence means for this specific store and why it leads to this
          suggested_action (not just restating the numbers back). Every
          `reason` must be composed fresh from this row's own figures — never
          copy or lightly reword another row's reason, and never state a
          trend, prediction, or cause that isn't directly computable from this
          row's own columns:
            0a. AD_SPEND_RS = 0: suggested_action = "cannot_evaluate",
               category = "no_spend", reason states there is no spend to
               evaluate a return on yet. Skip every other rung for this row.
            0b. AD_ORDERS < 5 (metadata.campaign_rules.not_enough_data.min_ad_orders):
               suggested_action = "not_enough_data", category = "insufficient_sample",
               reason cites AD_ORDERS and AD_SPEND_RS and states plainly that
               the sample is too small to draw a stop/reduce/increase
               conclusion from yet — do not force this row into the ROI
               ladder below just because a number is available; a ROI
               computed from a handful of orders is not evidence. Skip every
               other rung for this row.
            1. ROI = 0 (AD_SALES_RS = 0, i.e. real spend converted to zero
               attributed sales — do NOT lump every ROI=0 row into the same
               bucket as a merely-weak ROI=0.43 campaign; this is its own
               rung specifically because it can mean true failure, timing lag
               in attribution, or an ingestion gap, and the reason must name
               which is most likely from this row's own AD_SPEND_RS/AD_ORDERS):
               suggested_action = "stop"; category = "critical_failure" if
               AD_SPEND_RS >= 200 (metadata.campaign_rules.critical_failure
               .min_spend_rs — real money spent for zero return, urgent),
               else "underperforming" (small spend, zero return, still worth
               stopping but not framed as urgent). reason cites AD_SPEND_RS
               and AD_ORDERS, explains none of this spend is converting into
               attributed sales, and — for critical_failure only — explicitly
               recommends redirecting this budget to a new campaign in a
               currently-uncovered segment at this store (see
               expansion_suggestions).
            2. 0 < ROI < 0.75: suggested_action = "stop", category =
               "underperforming", reason cites the ROI plus AD_SPEND_RS and
               AD_SALES_RS, explains that this campaign is currently losing
               money relative to spend, and recommends redirecting this
               budget rather than continuing to fund an underperforming one.
            3. 0.75 <= ROI < 1.0: suggested_action = "reduce_budget",
               category = "weak", reason cites the ROI and — if ADS_M2O_PCT
               is at least 5 percentage points below OVERALL_M2O_PCT — cites
               both percentages and explains ads are converting materially
               worse than the store's own average; otherwise states plainly
               there's a modest loss without a clear conversion-gap cause and
               that spend should be trimmed while the cause is investigated.
            4. 1.0 <= ROI < 1.5 (break-even — this band is NOT a "stop" or an
               "increase", it's genuinely ambiguous with the evidence
               available): suggested_action = "maintain", category =
               "breakeven", reason cites the ROI and states plainly that
               this is roughly break-even — no clear case yet to cut or grow
               spend, so hold and keep monitoring rather than guess.
            5. 1.5 <= ROI < 2.5 (average — the store has room to grow here,
               this band is NOT to be skipped just because it isn't a
               standout): suggested_action = "increase_budget_cautious",
               category = "good", reason cites the ROI and the ADS_M2O_PCT vs
               OVERALL_M2O_PCT comparison, explains that a positive return
               combined with this conversion performance means the store can
               likely absorb more spend before returns turn marginal, and
               explicitly frames this as a cautious/modest increase (never
               phrase this as confidently as an excellent performer's).
            6. 2.5 <= ROI <= 10: suggested_action = "increase_budget_confident",
               category = "excellent", reason cites the ROI, AD_SPEND_RS, and
               the SEGMENTS this campaign targets, and explains that this is
               proven demand at a real spend level worth capturing with more
               budget rather than leaving capped.
            7. ROI > 10: suggested_action = "validate_outlier", category =
               "outlier", reason cites the ROI plus AD_SPEND_RS and
               AD_ORDERS and states plainly that a ROI this high is most
               often a small-spend or small-sample artifact (or an
               attribution-timing quirk), so it needs a human look before
               being trusted as a repeatable result — do NOT recommend
               increasing budget or treat this row as a proof point for
               expansion off this number alone.
          The point of rungs 3-5 is that weak and average stores get a
          concrete, evidence-backed action too — this ladder does not exist
          only to reward already-strong campaigns.

          For every row (rungs 1-7 only; rungs 0a/0b always get confidence
          "LOW", priority "LOW", estimated_impact null), also set:
            `confidence`: "HIGH" if AD_ORDERS >= 20 AND ROI is at least 0.3
              away from the nearest ladder boundary (0.75, 1.0, 1.5, 2.5, or
              10) — a decisive number backed by a real sample; "LOW" if
              AD_ORDERS < 20 (thin sample, even though it cleared the
              not_enough_data floor) OR ROI is within 0.1 of a boundary
              (could flip to the neighboring rung on a small data wobble) OR
              suggested_action is "validate_outlier" (always LOW — that's the
              point of the rung); "MEDIUM" otherwise.
            `priority`: "HIGH" if AD_SPEND_RS >= 5000 (metadata.campaign_rules
              .priority.high_spend_rs_gte) AND suggested_action is "stop" or
              starts with "increase_budget" — real money is on the line;
              "LOW" if AD_SPEND_RS < 1000 (.priority.low_spend_rs_lt) OR
              suggested_action is "maintain" or "validate_outlier"; "MEDIUM"
              otherwise.
            `estimated_impact`: a short rupee estimate, always caveated as
              approximate, never presented as a precise forecast —
              "stop": "~₹<AD_SPEND_RS>/month freed up if spend stops
              entirely"; "reduce_budget": "~₹<AD_SPEND_RS × campaign_rules
              .reduce_budget.reduce_pct%>/month saved, assuming ROI holds";
              "increase_budget_cautious"/"increase_budget_confident":
              "~₹<AD_SPEND_RS × increase_pct% × ROI>/month additional sales,
              assuming ROI holds at the current level (returns typically
              diminish as spend grows)"; "maintain"/"validate_outlier": null
              (no directional call yet, so no number to attach).

          If `campaign_comparison` is empty, return
          `campaign_action_suggestions: []`. Otherwise output
          `campaign_action_suggestions`: a JSON array, one object per row
          (never null, a string, or omitted — an empty run is `[]`, not
          omitted), with exactly these keys: store_name, CAMPAIGN_ID,
          PRODUCT_TYPE, PLATFORM, SEGMENTS, ROI, ROAS, AD_SALES_RS,
          AD_SPEND_RS, AD_ORDERS, ADS_M2O_PCT, OVERALL_M2O_PCT, category,
          reason, suggested_action, confidence, priority, estimated_impact.
        produces:
          - campaign_action_suggestions

      # 2-GATE. Approve — every evaluated campaign's recommended action, in
      # one review/one approval (no split between underperforming and
      # budget-increase — that split was causing data-visibility problems).
      - id: approve_actions
        name: Approve Campaign Actions
        type: decision
        after: evaluate_campaigns
        description: Marketing manager approves or rejects the recommended actions across all evaluated campaigns.
        instruction: >
          Review `campaign_action_suggestions` — every currently-running
          campaign's recommended action (cannot_evaluate, not_enough_data,
          stop, reduce_budget, maintain, increase_budget_cautious,
          increase_budget_confident, or validate_outlier), each with its
          evidence-backed reason. Recommend
          APPROVE to carry all of these into the final action plan, REJECT
          to hold the whole batch back this run (e.g. a known seasonal dip
          that shouldn't trigger any changes yet).

          `campaign_action_suggestions` is already provided above — do NOT
          call collect_context or any other tool to search for or verify it.
          A tool search for this fact will find nothing (it is a process
          fact, not a graph entity) and an empty tool result does NOT mean
          the data is missing; judge only what's already given to you. Every
          row already carries its own cited evidence (ROI plus spend/sales/
          conversion figures) in `reason` — never state that evidence,
          insight, or data is lacking or that action suggestions weren't
          gathered; that evidence is already present in every row above.
          Only recommend REJECT for a substantive reason (e.g. a known
          seasonal dip), never for a perceived absence of data.
        decision_options: [APPROVE, REJECT]
        rationale_from: campaign_action_suggestions
        produces:
          - actions_decision
        key_data:
          - title: Campaign Action Recommendations
            summary: Every currently-running campaign, evaluated with an evidence-backed action — not just the top performers.
            views:
              - view: table
                from: campaign_action_suggestions
                columns:
                  [
                    store_name,
                    CAMPAIGN_ID,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    ROI,
                    ROAS,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                    ADS_M2O_PCT,
                    OVERALL_M2O_PCT,
                    category,
                    reason,
                    suggested_action,
                    confidence,
                    priority,
                    estimated_impact,
                  ]
          # Authoring key_data here fully replaces the process-level default
          # (_key_data_specs in event_agent.py) rather than merging with it —
          # so the raw fetched campaign_comparison must be repeated here too,
          # or reviewers only see the derived recommendations at this gate,
          # not the underlying month-to-date data they're based on.
          - title: Current Campaign Performance
            summary: Month-to-date performance per (store, campaign) currently running.
            views:
              - view: table
                from: campaign_comparison
                columns:
                  [
                    store_name,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    ROI,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                    ADS_M2O_PCT,
                    OVERALL_M2O_PCT,
                  ]

      # 3. Opportunity Discovery — new campaigns to launch. Runs off
      # evaluate_campaigns directly (not gated behind approve_actions):
      # expansion only needs campaign_action_suggestions' increase_budget_
      # confident rows and segment_budget, neither of which depends on
      # whether the manager has approved the stop/reduce/increase actions
      # yet. Only the final send
      # (notify) needs to wait for every upstream approval.
      - id: find_expansion_opportunities
        name: Opportunity Discovery (New Campaigns)
        type: agent
        after: evaluate_campaigns
        description: Identify customer-segment gaps at proven stores, and store/channel budget that's allocated but unspent.
        instruction: >
          Campaign targeting here is decided by SEGMENTS (the customer
          segment a campaign targets), not PRODUCT_TYPE — PRODUCT_TYPE is
          carried in every row only as a reference to which running
          campaign the suggestion is modeled on. SEGMENTS values are
          store-specific — never match a SEGMENTS value between two
          different stores as if it were the same audience. Two SEGMENTS
          strings at the SAME store that differ only in wording or spacing
          (e.g. "Young Professionals - Lunch" vs "Young Professionals /
          Office Lunch") describe the same audience — normalize whitespace/
          punctuation and compare case-insensitively before treating two
          values as distinct segments, so the same real gap is never
          proposed twice under two spellings.

          Find expansion candidates from TWO signals — emit at most one
          expansion row per (store, missing SEGMENTS value) even if both
          signals point to it:

          1. Proof-point gap: for every store with at least one row in
          `campaign_action_suggestions` where suggested_action =
          "increase_budget_confident" (ROI between 2.5 and 10 — a genuine
          "excellent" result, never "validate_outlier": a ROI > 10 row is an
          unvalidated artifact, not proof of anything repeatable, and must
          NEVER be used as a proof point here) AND AD_SPEND_RS >=
          metadata.expansion_rules.min_proof_point_spend_rs (500) AND
          AD_ORDERS >= metadata.expansion_rules.min_proof_point_orders (20)
          — a high ROI from a tiny sample or trivial spend is not a proof
          point, e.g. ROI 6 from AD_SPEND_RS 50 / AD_ORDERS 3 does NOT
          qualify — check which SEGMENTS values that
          store has NO currently-running campaign for, against the full set
          of SEGMENTS values seen anywhere in `campaign_comparison`. For each
          missing SEGMENTS value, add ONE expansion suggestion: category =
          "strategic_expansion", suggested_action = "new_campaign:<missing
          SEGMENTS value>", CAMPAIGN_ID = null, SEGMENTS = the missing
          segment itself (the gap being proposed), PRODUCT_TYPE and PLATFORM
          = the PRODUCT_TYPE and PLATFORM of the high-performing proof-point
          campaign (reference only, not the gap dimension), and
          ROI/AD_SALES_RS/AD_SPEND_RS/ADS_M2O_PCT/OVERALL_M2O_PCT copied from
          that proof-point campaign — never invent numbers. reason = one line
          naming the missing segment and the
          proof-point CAMPAIGN_ID/ROI it's modeled on (e.g. "no running
          campaign targets the Value-Seekers segment at this store; Campaign
          47 in that segment runs ROI 2.6"). A store with no qualifying
          proof-point row, or one already running every SEGMENTS value, gets
          no row from this signal.

          2. Unspent budget: for every `segment_budget` row where
          ALLOCATED_BUDGET_RS > 0 but that store_name + CHANNEL has NO
          matching PLATFORM rows at all in `campaign_comparison` this
          BUDGET_MONTH, add ONE expansion row: category =
          "strategic_expansion", suggested_action =
          "new_campaign:budget_allocated_unused", CAMPAIGN_ID = null,
          PRODUCT_TYPE = null, PLATFORM = the segment_budget CHANNEL,
          AD_SPEND_RS = 0, AD_SALES_RS = null, ADS_M2O_PCT = null,
          OVERALL_M2O_PCT = null,
          ROI = null (there's no campaign to measure — state the
          ALLOCATED_BUDGET_RS rupee amount in reason and in flagged_summary
          instead), reason = one line stating the allocated rupee amount and
          that zero campaigns are running against it this month.

          Treat rows with PRODUCT_TYPE = null as their own store-specific
          case (never a source or target for signal 1's gap-matching).

          Every row also gets: `confidence` = "MEDIUM" for a signal-1 proof-
          point row that clears the sufficiency thresholds above (it's real
          evidence, but from one campaign, not a controlled test — never
          "HIGH"), or "LOW" for a signal-2 unspent-budget row (no performance
          evidence at all, just an unused allocation). `priority` = "HIGH" if
          ALLOCATED_BUDGET_RS (signal 2) or the proof-point's AD_SPEND_RS
          (signal 1) is >= metadata.campaign_rules.priority.high_spend_rs_gte,
          else "MEDIUM". `estimated_impact` = for signal 1, "~₹<proof-point
          AD_SALES_RS>/month if this segment performs similarly to the proof
          point (approximate — new segment, unproven)"; for signal 2, "~₹
          <ALLOCATED_BUDGET_RS>/month already budgeted and currently unused".

          If no store qualifies under either signal, return
          `expansion_suggestions: []`. Otherwise output
          `expansion_suggestions`: a JSON array with exactly these keys:
          store_name, CAMPAIGN_ID, PRODUCT_TYPE, PLATFORM, SEGMENTS, ROI,
          AD_SALES_RS, AD_SPEND_RS, ADS_M2O_PCT, OVERALL_M2O_PCT, category,
          reason, suggested_action, confidence, priority, estimated_impact.
        produces:
          - expansion_suggestions

      # 3-GATE. Approve — Strategic Expansion (new_campaign).
      - id: approve_expansion
        name: Approve New Campaign Opportunities
        type: decision
        after: find_expansion_opportunities
        condition: "{{expansion_suggestions}} != []"
        description: Marketing manager approves or rejects the new-campaign suggestions.
        instruction: >
          Review `expansion_suggestions` — proposed new campaigns, each
          modeled on a proven high-performing campaign or an already-funded
          but unused budget line. Recommend APPROVE to carry these into the
          final action plan, REJECT to hold them back this run (e.g.
          product/menu isn't ready to launch yet).

          `expansion_suggestions` is already provided above — do NOT call
          collect_context or any other tool to search for or verify it. A
          tool search for this fact will find nothing (it is a process fact,
          not a graph entity) and an empty tool result does NOT mean the
          data is missing; judge only what's already given to you.
        decision_options: [APPROVE, REJECT]
        rationale_from: expansion_suggestions
        produces:
          - expansion_decision
        key_data:
          - title: Strategic Expansion Opportunities
            summary: Proposed new campaigns — segment gaps at proven stores and unspent allocated budget, with the reason behind each call.
            views:
              - view: table
                from: expansion_suggestions
                columns:
                  [
                    store_name,
                    CAMPAIGN_ID,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    ROI,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                    ADS_M2O_PCT,
                    OVERALL_M2O_PCT,
                    reason,
                    suggested_action,
                    confidence,
                    priority,
                    estimated_impact,
                  ]

      # 4. Recommendation Generation — merge whichever of the two suggestion
      # sets were approved above (campaign actions, then new campaigns).
      - id: create_action_plan
        name: Recommendation Generation
        type: agent
        after: approve_expansion
        description: Merge the approved campaign-action and expansion suggestions into one final action plan.
        instruction: >
          `campaign_action_suggestions` is governed by `actions_decision`
          (the Approve Campaign Actions gate); `expansion_suggestions` is
          governed separately by `expansion_decision`. A decision fact is
          present only when there was something to review; when the
          underlying suggestion list was already empty the gate was skipped
          and its decision fact won't exist — treat a missing decision the
          same as APPROVE (there's nothing to exclude anyway). Include a
          suggestion set in `flagged_campaigns` UNLESS its governing
          decision is exactly "REJECT".

          Concatenate the included sets — `campaign_action_suggestions`,
          then `expansion_suggestions` — into `flagged_campaigns`: a JSON
          array, each item already shaped with store_name, CAMPAIGN_ID,
          PRODUCT_TYPE, PLATFORM, SEGMENTS, ROI, AD_SALES_RS, AD_SPEND_RS,
          ADS_M2O_PCT, OVERALL_M2O_PCT, category, reason, suggested_action,
          confidence, priority, estimated_impact from the steps that
          produced them — every row already supplies its own `reason`,
          `priority`, and `estimated_impact`, so this is a straight
          carry-over, never invent or recompute any of them. Then sort the
          concatenated array by `priority` (HIGH first, then MEDIUM, then
          LOW), preserving the original relative order within each priority
          band — a reviewer scanning top-to-bottom should see the
          highest-money-at-risk/upside items first, not just campaign-action
          rows before expansion rows. If nothing is included, return
          `flagged_campaigns: []`. Never return null, a string, or omit the
          field.

          `flagged_summary`: plain business language grouped by
          suggested_action, naming the specific action, citing its reason,
          and — whenever `estimated_impact` is not null — appending it in
          parentheses (e.g. "estimated ~₹4,200/month saved") so the reader
          knows why it matters, e.g. "Stop: Campaign 12 at Store X (zero
          sales on ₹300 spend — a critical failure, not just a weak result;
          redirect this budget to a new campaign in an uncovered segment at
          this store instead). Stop: Campaign 8 at Store Y (ROI 0.6 — losing
          money on spend). Reduce budget: Campaign 15 at Store T (ROI 0.9,
          converting materially worse than the store average — trim spend
          until conversion improves). Maintain: Campaign 21 at Store W (ROI
          1.2 — roughly break-even, hold and keep monitoring rather than
          guess). Increase budget (cautiously): Campaign 33 at Store U (ROI
          1.8, converting on par with the store average — room to absorb
          more spend before returns turn marginal). Increase budget
          (confidently): Campaign 47 at Store Z (ROI 2.6 on ₹6,000 spend,
          targeting the Value-Seekers segment — proven demand worth
          capturing further). Validate before scaling: Campaign 52 at Store
          Q (ROI 14 on ₹80 spend — likely a small-sample artifact, needs a
          human look before trusting it). New campaign: Store Z should
          launch a campaign for the Loyal-Regulars segment — no running
          campaign targets it, and Campaign 47 (same store, Value-Seekers
          segment) proves ROI 2.6 is achievable there." If a set was rejected at its
          gate, note that plainly, e.g. "Campaign action suggestions were
          reviewed and held back this run." If `flagged_campaigns` is empty
          overall, `flagged_summary` = "No campaigns are currently running."
          if `campaign_comparison` was empty, else "All suggestions were
          reviewed and held back this run." Describe actions only — do not
          paste the raw table or restate every metric already in
          `flagged_campaigns`.
        produces:
          - flagged_campaigns
          - flagged_summary

      # 5. GATE — Final Send Approval. The marketing manager already approved
      # each set above; this gate confirms sending the consolidated plan.
      - id: review
        name: Final Send Approval
        type: decision
        after: create_action_plan
        description: Marketing manager confirms sending the consolidated action plan (or escalates if there was no data at all).
        instruction: >
          Review flagged_summary and flagged_campaigns — the CONSOLIDATED
          plan from the two gates above (each already approved or rejected
          individually). This gate is about whether to SEND it, not
          re-litigate each set. Recommend ESCALATE if `campaign_comparison`
          itself was empty this run (no campaigns currently running at all —
          nothing to review), OR if every row's DATE in `campaign_comparison`
          is more than 2 days older than `scheduled_at` (when `scheduled_at`
          is present) — that gap means the underlying view hasn't refreshed
          and every recommendation above would be acting on stale data;
          state that explicitly rather than sending a plan built on it. An
          empty
          `flagged_campaigns` with a non-empty `campaign_comparison` is a
          different, normal case — every set was rejected above — and is
          NOT a reason to escalate. In that case, and in every other case,
          recommend APPROVE to send the performance + optimisation summary
          to the marketing team, whether or not any campaigns were flagged
          this run. Only recommend REJECT if flagged_summary itself looks
          wrong or incomplete (e.g. contradicts flagged_campaigns, or a
          category/suggested_action is missing or inconsistent) and
          shouldn't go out as-is.

          `flagged_summary` and `flagged_campaigns` are already provided
          above — do NOT call collect_context or any other tool to search
          for or verify them. A tool search for these facts will find
          nothing (they are process facts, not graph entities) and an empty
          tool result does NOT mean the data is missing; judge only what's
          already given to you.
        decision_options: [APPROVE, REJECT, ESCALATE]
        rationale_from: flagged_summary
        produces:
          - report_decision
        key_data:
          - title: Flagged Campaigns
            summary: Every evaluated campaign's action, plus strategic-expansion suggestions, this month — with the reason behind each call.
            views:
              - view: table
                from: flagged_campaigns
                columns:
                  [
                    store_name,
                    CAMPAIGN_ID,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    ROI,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                    ADS_M2O_PCT,
                    OVERALL_M2O_PCT,
                    category,
                    reason,
                    suggested_action,
                    confidence,
                    priority,
                    estimated_impact,
                  ]
          # Authoring key_data here fully replaces the process-level default
          # (_key_data_specs in event_agent.py) rather than merging with it —
          # so the full campaign_comparison table must be repeated here too,
          # or reviewers only ever see the flagged subset at this gate.
          - title: Current Campaign Performance
            summary: Month-to-date performance per (store, campaign) currently running.
            views:
              - view: table
                from: campaign_comparison
                columns:
                  [
                    store_name,
                    PRODUCT_TYPE,
                    PLATFORM,
                    SEGMENTS,
                    ROI,
                    AD_SALES_RS,
                    AD_SPEND_RS,
                    ADS_M2O_PCT,
                    OVERALL_M2O_PCT,
                  ]

      # 6. Execute — email today, direct Zomato/Swiggy API updates later — only on
      # APPROVE. Uses the "Genzoic Email Formatter" skill (action type: skill,
      # matching shelf_life_risk_monitoring/customer_review_aggregation_and_triage)
      # instead of the plain `email` action, so flagged_campaigns renders as a
      # clean Genzoic HTML table + plain-text fallback via the org's SendGrid
      # connector. `args.sections[].records` binds to the flagged_campaigns fact;
      # `columns` picks + orders the fields the email table shows.
      - id: notify
        name: Email Performance & Optimisation Summary
        type: notify
        after: review
        condition: '{{report_decision}} == "APPROVE"'
        description: On approve, format and email the marketing team the action plan.
        produces:
          - report_sent
        action:
          type: skill
          config:
            type: skill
            skill:
              "genzoic-email-formatter" # Skill.name (slug) — call_skill resolves by Skill.name (subprocess gets DB +
              # app imports because it starts with "Genzoic")
            operation: send
            args:
              to: "rahul.ab@genzoic.com"
              subject: "Campaign Recalibration Actions — Month-to-Date"
              title: "Campaign Planning & Optimisation — Action Plan"
              intro: >-
                Campaign review completed across dark-store locations
                (Zomato/Swiggy only, Meta/Google pending warehouse),
                month-to-date. {{flagged_summary}}
              sections:
                - type: table
                  caption: "Flagged campaigns — action, data, and reason"
                  columns:
                    [
                      store_name,
                      CAMPAIGN_ID,
                      PRODUCT_TYPE,
                      PLATFORM,
                      SEGMENTS,
                      ROI,
                      AD_SALES_RS,
                      AD_SPEND_RS,
                      ADS_M2O_PCT,
                      category,
                      reason,
                      suggested_action,
                      priority,
                      confidence,
                      estimated_impact,
                    ]
                  records: "{{flagged_campaigns}}"
              footer_note: "Generated automatically by the Campaign Planning & Optimisation process."

      # 7. Hold, no email — REJECT branch.
      - id: hold_no_action
        name: Hold Without Sending
        type: notify
        after: review
        condition: '{{report_decision}} == "REJECT"'
        description: Reviewed and held — no email sent this run.
        action:
          type: simulated
          config:
            note: "Campaign performance reviewed and held — no email sent this run."

      # 8. Escalate — ESCALATE branch (no campaign data this run).
      - id: escalate_review
        name: Escalate — No Campaign Data
        type: notify
        after: review
        condition: '{{report_decision}} == "ESCALATE"'
        description: No campaign performance data returned this run — escalate for review.
        action:
          type: simulated
          config:
            note: "Campaign planning & optimisation escalated — no campaign performance data returned this run."

    metadata:
      version: 7
      priority: 15

      # Single source of truth for the evaluation/expansion thresholds — edit
      # these to change business policy; the ladder in evaluate_campaigns'
      # instruction below must stay numerically in sync (agent instructions
      # are plain text, not templated from metadata, so this file has no way
      # to make the prompt read these values automatically).
      # Widened middle bands + a critical_failure/outlier split, based on the
      # real ROI distribution: 460 rows sit at ROI = 0.0 (a spend=0 / no-
      # sales spike, not one homogeneous "bad campaign" bucket) and the bulk
      # of the rest cluster between 1.0 and 3.0, with a handful of ROI > 10
      # outliers that are almost always a tiny-spend/tiny-order artifact, not
      # a repeatable result.
      campaign_rules:
        cannot_evaluate:
          spend_eq_0: true
        not_enough_data:
          min_ad_orders: 5
          # No campaign-age check: V_STORE_CAMPAIGN_CURRENT has a row DATE but
          # no campaign start/launch date column, so "days running" isn't
          # computable yet. Add once that column exists.
        critical_failure:
          roi_eq_0: true
          min_spend_rs: 200 # ROI=0 at/above this spend is flagged more urgently
        stop:
          roi_lt: 0.75
        reduce_budget:
          roi_between: [0.75, 1.0]
          reduce_pct: 30
        maintain:
          roi_between: [1.0, 1.5]
        increase_budget_cautious:
          roi_between: [1.5, 2.5]
          increase_pct: 15
        increase_budget_confident:
          roi_between: [2.5, 10.0]
          increase_pct: 30
        validate_outlier:
          roi_gt: 10.0
        priority:
          high_spend_rs_gte: 5000
          low_spend_rs_lt: 1000

      expansion_rules:
        min_proof_point_spend_rs: 500
        min_proof_point_orders: 20
        # A proof point must be a genuine "excellent" result, not an
        # unvalidated outlier — ROI > 10 needs a human look before it's used
        # to justify launching a new campaign elsewhere.
        max_proof_point_roi: 10.0

      # Pre-fetch currently-running campaigns per (store, campaign).
      context_package:
        - key: campaign_comparison
          required: true
          gather:
            base:
              entity: Store
              dataset: V_STORE_CAMPAIGN_CURRENT
              columns:
                [
                  MASTER_STORE_ID,
                  CAMPAIGN_ID,
                  PLATFORM,
                  PRODUCT_TYPE,
                  TARGETING,
                  SEGMENTS,
                  DATE,
                  AD_SPEND_RS,
                  AD_SALES_RS,
                  AD_ORDERS,
                  ROI,
                  ADS_M2O_PCT,
                  OVERALL_M2O_PCT,
                  ROAS,
                  CTR,
                ]
              order_by: ROI
              order_dir: asc
              limit: 5000
          post:
            resolve:
              - { field: MASTER_STORE_ID, type: Store, as: store_name }
        # Real budget-pacing signal (V_SEGMENT_BUDGET, sql/views.sql) — this
        # month's allocated budget per (store, channel), so root-cause and
        # opportunity-discovery can reason from actual figures instead of
        # guessing.
        - key: segment_budget
          required: true
          gather:
            base:
              entity: Store
              dataset: V_SEGMENT_BUDGET
              columns:
                [
                  MASTER_STORE_ID,
                  CHANNEL,
                  BUDGET_MONTH,
                  ALLOCATED_BUDGET_RS,
                  EXPECTED_REVENUE_RS,
                ]
              limit: 5000
          post:
            resolve:
              - { field: MASTER_STORE_ID, type: Store, as: store_name }
        - { key: scheduled_at, source: event, required: false }

      # Process-level "Data used" fallback — only shown if some future gate is
      # added without its own authored key_data (_key_data_specs in
      # event_agent.py); every gate today authors its own, so this never
      # actually renders yet. Kept fuller than just the raw campaign table so
      # that fallback isn't a downgrade from what the real gates show.
      key_data:
        - title: Current Campaign Performance
          summary: Month-to-date performance per (store, campaign) currently running.
          views:
            - view: table
              from: campaign_comparison
              columns:
                [
                  store_name,
                  PRODUCT_TYPE,
                  PLATFORM,
                  SEGMENTS,
                  ROI,
                  AD_SALES_RS,
                  AD_SPEND_RS,
                  ADS_M2O_PCT,
                  OVERALL_M2O_PCT,
                ]
        - title: Campaign Action Recommendations
          summary: Every currently-running campaign, evaluated with an evidence-backed action — with the reason behind each call.
          views:
            - view: table
              from: campaign_action_suggestions
              columns:
                [
                  store_name,
                  CAMPAIGN_ID,
                  PRODUCT_TYPE,
                  PLATFORM,
                  SEGMENTS,
                  ROI,
                  ROAS,
                  AD_SALES_RS,
                  AD_SPEND_RS,
                  ADS_M2O_PCT,
                  OVERALL_M2O_PCT,
                  category,
                  reason,
                  suggested_action,
                  confidence,
                  priority,
                  estimated_impact,
                ]
        - title: Strategic Expansion Opportunities
          summary: Proposed new campaigns — segment gaps at proven stores and unspent allocated budget, with the reason behind each call.
          views:
            - view: table
              from: expansion_suggestions
              columns:
                [
                  store_name,
                  CAMPAIGN_ID,
                  PRODUCT_TYPE,
                  PLATFORM,
                  SEGMENTS,
                  ROI,
                  AD_SALES_RS,
                  AD_SPEND_RS,
                  ADS_M2O_PCT,
                  OVERALL_M2O_PCT,
                  reason,
                  suggested_action,
                  confidence,
                  priority,
                  estimated_impact,
                ]
        - title: Flagged Campaigns (Final Plan)
          summary: The consolidated action plan across all approved sets, by store and segment — with the reason behind each call.
          views:
            - view: table
              from: flagged_campaigns
              columns:
                [
                  store_name,
                  CAMPAIGN_ID,
                  PRODUCT_TYPE,
                  PLATFORM,
                  SEGMENTS,
                  ROI,
                  AD_SALES_RS,
                  AD_SPEND_RS,
                  ADS_M2O_PCT,
                  OVERALL_M2O_PCT,
                  category,
                  reason,
                  suggested_action,
                  confidence,
                  priority,
                  estimated_impact,
                ]

      # Only the email-formatting skill is needed — the agent steps themselves
      # only filter/group pre-computed rows from campaign_comparison, they call
      # no tools. Listing "genzoic-email-formatter" lets the notify step's
      # `action: {type: skill}` above fire; allow_unlisted_skills: false and
      # connectors: [] stop the agent from reaching for anything else (e.g.
      # HubSpot) that has nothing to do with this Zomato/Swiggy BigQuery data.
      tools:
        skills: ["genzoic-email-formatter"]
        allow_unlisted_skills: false
        connectors: []
