version: 1
processes:
- id: dark_store_licence_management
  name: Dark Store FSSAI Licence Management
  description: 'Track all dark-store locations (partner, address, licence, expiry) with periodic partner check-ins, flagging
    non-responders, expiring licences and address changes, and drafting the required amendment applications.

    '
  domain: Compliance
  owner: compliance_team
  definition_type: text
  applies_to:
  - entity: Store
  triggers:
  - type: schedule
    cron: 0 6 * * 1
  - type: manual
    allowed_roles:
    - ComplianceLead
    - RegulatoryAffairs
  inputs:
  - name: store
    type: reference
    references: Store
    required: false
  outputs:
  - name: licence_decision
    type: enum
    values:
    - Draft Amendment Applications
    - No Action Needed
  steps:
  - id: assemble_dark_store_register
    name: Assemble Dark Store Register
    type: agent
    description: Compiles the dark-store register with partner, address, licence and check-in status.
    instruction: 'Reason over the event inputs and gathered graph context to assemble the current register of dark-store locations,
      capturing partner, address, FSSAI licence number and expiry for each. Separately collect the latest periodic partner
      check-in responses and their dates. Do NOT invent data beyond what is gathered; output empty lists where there is none.

      '
    produces:
    - store_register
    - checkin_responses
    key_data:
    - title: Dark Store Register
      summary: All dark-store locations with partner, address, licence and expiry.
      views:
      - view: table
        from: store_register
  - id: evaluate_licence_status
    name: Evaluate Licence and Check-in Status
    type: agent
    after: assemble_dark_store_register
    description: Evaluates the register against check-ins to detect issues needing action.
    instruction: 'Evaluate store_register against checkin_responses to identify non-responding partners, licences that are
      expired or expiring soon, and address changes that diverge from the licensed address. Produce a findings list of affected
      stores with the issue type, a one-line summary of overall status, and an escalation level fact reflecting the most severe
      finding.

      '
    produces:
    - licence_findings
    - status_summary
    - escalation_level
  - id: licence_review_gate
    name: Licence Review Gate
    type: decision
    after: evaluate_licence_status
    description: Compliance team reviews findings and decides whether to draft amendment applications.
    instruction: 'Review licence_findings. Choose "Draft Amendment Applications" when there are expiring licences, address
      changes or unresolved non-responders requiring a licence amendment; choose "No Action Needed" when there is nothing
      to act on. Recommend "Draft Amendment Applications" whenever a material finding is present.

      '
    decision_options:
    - Draft Amendment Applications
    - No Action Needed
    recommends: escalation_level
    rationale_from: status_summary
    produces:
    - licence_decision
    key_data:
    - title: Licence Findings
      summary: Stores flagged for non-response, expiry or address change.
      views:
      - view: table
        from: licence_findings
  - id: record_amendment_drafts
    name: Record Amendment Drafts
    type: notify
    after: licence_review_gate
    condition: '{{licence_decision}} == "Draft Amendment Applications"'
    description: Records the drafted amendment applications and routes them for filing.
    produces:
    - amendment_drafts_recorded
    action:
      type: simulated
      name: record_amendment_drafts
      config:
        summary: Amendment applications drafted for dark store {{store}}.
        findings: '{{licence_findings}}'
  related_signals_events:
  - COMP_FSSAILicenceExpiry
  metadata:
    version: 1
    priority: 10
    entity_optional: true
    run_steps_before_gate: true
    tools:
      skills: []
      connectors: []
      allow_unlisted_skills: false
