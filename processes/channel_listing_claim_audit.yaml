version: 1
processes:
- id: channel_listing_claim_audit
  name: Channel Listing Claim Audit
  description: 'Weekly scan of all live channel listings against the current approved
    product record in PIM, flagging claim drift, outdated nutritional info, wrong
    FSSAI number and old images.

    '
  domain: Compliance
  owner: compliance_team
  definition_type: text
  applies_to:
  - entity: Products
  triggers:
  - type: schedule
    cron: 0 6 * * 1
  - type: manual
    allowed_roles:
    - ComplianceLead
    - RegulatoryAffairs
  inputs:
  - name: product
    type: reference
    references: Products
    required: false
  outputs:
  - name: audit_decision
    type: enum
    values:
    - Flag for Correction
    - No Issues
  steps:
  - id: gather_listings
    name: Gather Live Listings and Approved Record
    type: agent
    description: Assembles the live channel listings alongside the approved PIM record.
    instruction: 'Reason over the event inputs and gathered graph context to assemble
      the set of live channel listings for the product together with the current approved
      product record from PIM. Output the structured lists named in produces. Do NOT
      invent data beyond what is gathered; output empty lists where there is none.

      '
    produces:
    - live_listings
    - approved_record
    key_data:
    - title: Live Channel Listings
      summary: All live listings pulled per channel for this product.
      views:
      - view: table
        from: live_listings
  - id: evaluate_drift
    name: Evaluate Listing Drift
    type: agent
    after: gather_listings
    description: Evaluates each listing against the approved record for discrepancies.
    instruction: 'Compare each live listing against the approved PIM record and identify
      claim drift, outdated nutritional info, wrong FSSAI number and old images. Produce
      a findings list of discrepancies, a one-line summary and a risk level fact.
      Do NOT invent data; output an empty findings list where there are no discrepancies.

      '
    produces:
    - drift_findings
    - drift_summary
    - drift_level
  - id: review_gate
    name: Compliance Review Gate
    type: decision
    after: evaluate_drift
    description: Compliance team reviews the drift findings and decides whether correction
      is needed.
    instruction: 'Review drift_findings. Choose "Flag for Correction" when any listing
      shows claim drift, outdated nutritional info, a wrong FSSAI number or an old
      image; choose "No Issues" when there is nothing to act on. Recommend "Flag for
      Correction" whenever a material discrepancy is present.

      '
    decision_options:
    - Flag for Correction
    - No Issues
    recommends: drift_level
    rationale_from: drift_summary
    produces:
    - audit_decision
    key_data:
    - title: Drift Findings
      summary: Discrepancies between live listings and the approved record.
      views:
      - view: table
        from: drift_findings
  - id: record_corrections
    name: Record Correction Tasks
    type: notify
    after: review_gate
    condition: '{{audit_decision}} == "Flag for Correction"'
    description: Records and routes correction tasks on the flagged branch.
    produces:
    - correction_record
    action:
      type: simulated
      name: record_corrections
      config:
        summary: Correction tasks recorded for {{product}} listings requiring updates.
        findings: '{{drift_findings}}'
  related_signals_events:
  - SALES_CompetitorNewListing
  - SALES_CompetitorListingRemoval
  - SALES_MarketplacePolicyChange
  - COMP_NewMarketChannelListingRequested
  - SALES_NewListingRequestReceived
  - SALES_ListingContentUpdateRequired
  metadata:
    version: 1
    priority: 10
    entity_optional: true
    run_steps_before_gate: true
    tools:
      skills: []
      connectors: []
      allow_unlisted_skills: false
