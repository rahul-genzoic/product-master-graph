version: 1
processes:
- id: product_master_ca_skill_test
  name: "Product Master \u2014 CA Skill Smoke Test"
  description: "End-to-end test of the Google Conversational Analytics skill. Two\
    \ natural-language\nquestions are put to the Data Agent product_master_agent by\
    \ naming the skill on a\nstep; Gemini writes and runs the SQL on BigQuery and\
    \ returns the rows plus the SQL.\nThe first question is deliberately identical\
    \ to the sibling\nproduct_master_semantic_smoke_test, which asks the same agent\
    \ through context-graph\n\u2014 so the two runs can be compared directly. One\
    \ review gate shows both; APPROVE if\ndata came back.\n"
  domain: Merchandising
  owner: data_team
  definition_type: text
  applies_to:
  - entity: Products
  - entity: Products
    where:
    - field: id
      op: ne
      value: __none__
  triggers:
  - type: manual
    allowed_roles:
    - DataAnalyst
    - MerchandisingManager
  - type: event
    event_type: product_master_ca_skill_test
  inputs:
  - name: scheduled_at
    type: datetime
    required: false
  outputs:
  - name: decision
    type: enum
    values:
    - APPROVE
    - REJECT
  - name: check_summary
    type: string
  steps:
  - id: ask_products_by_category
    name: "Ask CA \u2014 active products by category"
    type: agent
    description: The sibling process's exact question, routed through the skill instead.
    skill:
      name: Google Conversational Analytics
      operation: ask
      args:
        question: How many active products are in each category?
        data_agent_id: product_master_agent
        limit: 20
      as: ca_by_category
  - id: ask_channel_listings
    name: "Ask CA \u2014 product listings by channel"
    type: agent
    after: ask_products_by_category
    description: A different question against the same agent.
    skill:
      name: Google Conversational Analytics
      operation: ask
      args:
        question: How many products are listed on each sales channel?
        data_agent_id: product_master_agent
        limit: 20
      as: ca_by_channel
  - id: review
    name: Review CA output
    type: decision
    after: ask_channel_listings
    description: Confirm the Conversational Analytics skill answered both questions.
    instruction: "Two questions were put to the Conversational Analytics Data Agent\
      \ \"product_master_agent\" by calling the \"Google Conversational Analytics\"\
      \ skill directly \u2014 Gemini wrote and ran the SQL on BigQuery; our platform\
      \ generated nothing. Write a SHORT summary: for each, whether it succeeded,\
      \ its row_count, and one concrete number from its rows. The first question is\
      \ the SAME one the sibling process product_master_semantic_smoke_test asks through\
      \ context-graph, so if you can see that run's result, say whether the two agree.\
      \ If a fact failed, quote its `error` and `message` verbatim \u2014 that message\
      \ is the whole diagnosis. Recommend APPROVE if at least one returned rows, which\
      \ proves the connector, the skill and the agent all work end to end. REJECT\
      \ if both failed. Do NOT re-query and do NOT call any tool.\n"
    decision_options:
    - APPROVE
    - REJECT
    produces:
    - check_summary
    key_data:
    - title: Active products by category (via CA skill)
      summary: Answered by the Data Agent product_master_agent over BigQuery
      views:
      - view: table
        from: ca_by_category.rows
    - title: Product listings by sales channel (via CA skill)
      summary: Same Data Agent, second question
      views:
      - view: table
        from: ca_by_channel.rows
  metadata:
    version: 1
    effective_from: 2026-08-10
    priority: 5
    requires_human_approval: true
    tools:
      skills: []
      allow_unlisted_skills: false
    context_package:
    - key: scheduled_at
      source: event
      required: false
    policy_rules:
    - "`ca_by_category` and `ca_by_channel` are the results of the \"Google Conversational\
      \ Analytics\" skill, invoked directly by this process's steps. They are already\
      \ gathered \u2014 do NOT re-query, do NOT call a skill, and do NOT list every\
      \ row."
    - "Gemini wrote and ran the SQL inside Google Conversational Analytics. No semantic\
      \ model file was read and no SQL was generated by our own engine \u2014 do not\
      \ refer to a verified query or to context-graph in the summary."
    - "Each fact carries `success`, `rows`, `columns`, `row_count` and `sql`. On failure\
      \ it carries `error` and `message` \u2014 report those verbatim."
    - Recommend APPROVE when at least one fact has rows; REJECT when both failed.
    actions:
    - name: acknowledge_ca_skill_test
      decision: APPROVE
      connector: notify
      config:
        type: notify
        recipient: data_team
        message: "Conversational Analytics skill path verified \u2014 a process step\
          \ named the skill and the Data Agent answered over BigQuery."
    - name: dismiss_ca_skill_test
      decision: REJECT
      connector: simulated
      config:
        type: simulated
        note: "CA skill smoke test returned no rows. Read the skill's own `error`/`message`\
          \ first. Then check, in order: (1) the google-conversational-analytics connector\
          \ is connected for this org, with the GCP project AND the agent's region\
          \ \u2014 a region mismatch returns 403 'Read access to project was denied',\
          \ which looks like a permissions problem but is a wrong-endpoint problem;\
          \ (2) the agent is ticked in the connect dialog's picker, which is what\
          \ makes the display name `product_master_agent` resolve \u2014 otherwise\
          \ paste the raw agent id; (3) the 'Google Conversational Analytics' skill\
          \ is seeded (make seed-skill SKILL='google-conversational-analytics') and\
          \ enabled for the running user; (4) the service account has Gemini Data\
          \ Analytics Data Agent User on the agent plus BigQuery Data Viewer/Job User;\
          \ (5) compare with the sibling product_master_semantic_smoke_test \u2014\
          \ if that one works and this doesn't, the problem is the connector/skill,\
          \ not the agent."
  related_signals_events: []
