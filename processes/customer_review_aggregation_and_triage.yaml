version: 1

processes:
  # Graph-native re-implementation of the standalone complaint_analysis_pipeline
  # (test-contexts/complaint_analysis_pipeline), following that pipeline's REAL
  # trace chain (not fuzzy name-matching against current stock):
  #
  #   Store  --(Complaints link: CUSTOMER_COMPLAINT_EVENTS)-->  complaints (carry ORDER_ID)
  #          --(join complaint.ORDER_ID == sale.ONLINE_ORDER_ID, on BUSINESS_ANALYTICS)
  #                                                            -->  the products in that order
  #          --(join STORE_ID + SKU_ID + ORDER_DATE == snapshot_date on STORE_INVENTORY_DAILY)
  #                                                            -->  that product's inventory ON the order date
  #          --(walk Product--stock_config_for-->Store)        -->  that (SKU, store)'s min_days_shelf_life
  #
  # The whole chain is DETERMINISTIC (assembled by the gather engine). The AI
  # recommender then makes the two judgement calls the DSL can't:
  #   1. classify each complaint OPERATIONS vs PRODUCT (reads the complaint text), and
  #   2. for PRODUCT complaints, decide whether the batch available that day was
  #      near expiry — earliest-expiring batch's remaining life at the order date
  #      (earliest_expiry_that_day - Order_date) vs the SKU's min_days_shelf_life —
  #      and flag near-expiry stock as the likely cause ("tastes bad / not fresh").
  #
  # Reviews are aggregated too but NOT traced (no order id on a review): per store
  # we surface the ratings + all review text so the recommender can report average
  # rating, low-rated reviews, and product-vs-operational themes, and cross-check
  # them against the complaint findings.
  #
  # NOTE (faithful-adaptation): the pipeline's +/-1 day inventory fallback and its
  # fuzzy item->SKU match are not expressible in the gather DSL. Here the order->
  # product link is exact (BUSINESS_ANALYTICS carries SKU_ID per line) and the
  # inventory lookup is an EXACT snapshot_date == order_date match (no +/-1 fallback).
  # The near-expiry QUANTITY can't be summed deterministically (needs per-batch
  # date math the DSL lacks), so the recommender derives the near-expiry verdict
  # from earliest_expiry_that_day + Order_date + min_days_shelf_life.
  - id: customer_review_aggregation_and_triage
    name: Customer Complaint Root-Cause Triage
    description: |
      Traces each customer complaint back to its root cause, per dark store:
      start at the Store, pull its complaints (each references an ORDER_ID), match
      that to the sales table (BUSINESS_ANALYTICS.ONLINE_ORDER_ID) to see which
      products were in the order, then look up the store's inventory for that
      product ON the order date (the earliest-expiring available batch) and that
      SKU's configured shelf-life threshold. The AI classifies each complaint
      OPERATIONS vs PRODUCT; for PRODUCT complaints it checks whether the stock
      sold was near expiry on the order date and flags that as the likely cause.
      Reviews are aggregated per store (average rating, all reviews, themes) but
      not traced. After the overview gate, the reviewer walks the complaints STORE
      BY STORE (one approve/reject gate per store), and the confirmed triage is
      emailed via the Genzoic Email Formatter skill.

      For the agent: `complaint_root_cause` is ALREADY traced by the system — one
      row per complaint x product in its order, carrying that product's inventory
      ON the order date (`inventory_that_day`, `earliest_expiry_that_day`) and the
      SKU's `min_days_shelf_life`. CLASSIFY each complaint as OPERATIONS (delivery,
      packaging/spillage, wrong or missing items, service, timing) or PRODUCT
      (freshness/expiry, taste, quality, ingredients, hygiene) from `Complaint` +
      `Issue_type` + `Complaint_item`. For PRODUCT complaints, compute remaining
      life = (`earliest_expiry_that_day` − `Order_date`) and compare to
      `min_days_shelf_life` (treat 2 days if null): if <= threshold (or negative =
      sold expired), flag near-expiry stock as the LIKELY ROOT CAUSE; else leave it
      a plain quality issue. A null `Product_name`/`Order_date` = order not traced
      (can't assess). `store_reviews` is untraced — report the average rating and
      PRODUCT-vs-OPERATIONS themes and cross-check against the complaints. Write a
      SHORT summary (OPERATIONS vs PRODUCT split, how many PRODUCT complaints are
      near-expiry-explained with standout examples, and the review picture).
      Recommend APPROVE at the overview gate to action the triage store by store;
      recommend REJECT (no action) only if both facts are empty.
    domain: Product Reviews & Complaints
    owner: cx_team
    definition_type: text

    # Attach to every Store. The bare `Store` binds the type; the filtered
    # duplicate is what lets a manual/entity run discover the process (same
    # pattern as the sibling processes in this folder).
    applies_to:
      - entity: Store
      - entity: Store
        where:
          - { field: id, op: ne, value: __none__ }

    triggers:
      - { type: schedule, cron: "0 6 * * *" }                 # daily 06:00 (recent slice)
      - { type: event, event_type: customer_review_triage }
      - { type: manual, allowed_roles: [MarketingManager, ProductionManager] }

    # What the event carries in (scheduled sweep: none required; a manual/entity
    # run may pin one store). Documentation for the new definition shape.
    inputs:
      - { name: store_id, type: reference, references: Store, required: false }
      - { name: scheduled_at, type: datetime, required: false }

    # What the decision yields.
    outputs:
      - { name: decision, type: enum, values: [APPROVE, REJECT] }
      - { name: complaints_confirmed, type: object }
      - { name: complaints_held, type: object }

    # Stepped / foreach mode (NO metadata.steps_display_only): the EventAgent walks
    # these steps. Gate order: overview triage (AI classifies + summarises, gates the
    # whole run) -> per-STORE loop (one approve/reject gate per store, showing that
    # store's complaints) -> email the confirmed triage. Mirrors demand_forecast's
    # review_plan -> action_rows (foreach group_by store) -> dispatch_report shape.
    # NOTE (engine): agent steps BEFORE the first gate never run, so the AI triage is
    # done inside the first gate's own tool loop (review_triage below), not a prior step.
    steps:
      # 1) OVERVIEW GATE — the AI does the whole triage here (classify every complaint
      #    OPERATIONS vs PRODUCT, run the near-expiry root-cause check, read the
      #    reviews) and gates the run before the per-store walk begins.
      - id: review_triage
        name: Review complaint triage
        type: decision
        description: Production / marketing owner reviews the AI's root-cause triage and decides whether to action it store by store.
        instruction: >
          ALL the data you need is ALREADY in the FACTS — `complaint_root_cause` (the traced
          complaints) and `store_reviews` (the reviews) were assembled and handed to you by the
          system. Do NOT call collect_context, run_skill, call_connector or any other tool to
          fetch or verify data — there is nothing more to gather and no external credentials are
          needed. If a table looks short, that IS the data; never treat present-but-small data as
          missing. Work ONLY from the provided FACTS and go straight to finish_decision.

          `complaint_root_cause` is traced one row per complaint x product in its order, carrying
          that product's inventory ON the order date and the SKU's shelf-life threshold. CLASSIFY
          every complaint OPERATIONS (delivery, packaging, wrong/missing items, service, timing)
          vs PRODUCT (freshness/expiry, taste, quality, hygiene) from `Complaint` + `Issue_type`
          + `Complaint_item`. For PRODUCT complaints compute remaining life =
          (`earliest_expiry_that_day` - `Order_date`) vs `min_days_shelf_life` (treat 2 days if
          null): <= threshold (or negative) => flag near-expiry stock as the likely root cause.
          `store_reviews` is untraced — report the average rating and PRODUCT vs OPERATIONS themes
          and cross-check against the complaints. Write a SHORT summary (OPS vs PRODUCT split, how
          many PRODUCT complaints are near-expiry-explained with standout examples, the review
          picture). Do not paste the raw tables.

          DEFAULT to APPROVE to action the triage store by store — recommend REJECT ONLY if BOTH
          `complaint_root_cause` and `store_reviews` are genuinely empty (no rows at all). Never
          REJECT because of a supposed data-access / credentials / incomplete-data problem: the
          data is already provided.
        decision_options: [APPROVE, REJECT]
        produces:
          - triage_decision
        key_data:
          - title: "Complaint root-cause (traced)"
            summary: "Each complaint x product in its order, with that day's inventory & shelf-life threshold"
            views:
              - { view: table, from: complaint_root_cause, columns: [Store_name, Product_name, Complaint_date, Issue_type, Category, Complaint, Order_date, inventory_that_day, earliest_expiry_that_day, min_days_shelf_life] }
          - title: "Store reviews (untraced)"
            summary: "Recent customer reviews per store with a low-rating flag"
            views:
              - { view: table, from: store_reviews, columns: [Store_name, Rating, rating_band, Review, Review_date, Customer] }

      # 2) PER-STORE LOOP — one approve/reject gate per store (group_by MASTER_STORE_ID),
      #    showing that store's complaints. Approve = confirm this store's complaints into
      #    the emailed triage; Reject = hold them. Accumulates into confirmed / held (named
      #    via `produces`). No per-row side-effect action — the deliverable is the email.
      - id: triage_by_store
        name: Triage each store
        type: foreach
        after: review_triage
        for_each: complaint_root_cause
        group_by: MASTER_STORE_ID          # ONE gate per store, not per complaint row
        description: For each store, review its complaints and approve to confirm them into the emailed triage, or reject to hold them.
        instruction: >
          {{Store_name}}: review this store's traced complaints in the table — the
          OPERATIONS vs PRODUCT split and any PRODUCT complaints explained by near-expiry
          stock (remaining life vs the SKU's shelf-life threshold). Approve to confirm this
          store's complaints into the emailed triage report, or Reject to hold them.
        decision_options: [APPROVE, REJECT]
        produces:
          - complaints_confirmed
          - complaints_held
        key_data:
          - title: "Complaints at this store"
            summary: "Every traced complaint x product for this store"
            views:
              - { view: table, from: foreach_rows, columns: [Product_name, Complaint_date, Issue_type, Category, Complaint, Order_date, inventory_that_day, earliest_expiry_that_day, min_days_shelf_life] }

      # 3) EMAIL — send the confirmed triage via the Genzoic Email Formatter skill
      #    (clean HTML tables + plain-text fallback, over the org's SendGrid connector).
      #    STEP action => BARE {{fact}} templating; single-token {{...}} preserves the
      #    native row-list the skill's `records` needs.
      - id: email_triage
        name: Email triage report
        type: notify
        after: triage_by_store
        description: Email the production & marketing owners the confirmed root-cause triage + the store reviews.
        produces:
          - report_done
        action:
          type: skill
          name: email_triage_report
          config:
            type: skill
            skill: "genzoic-email-formatter"     # Skill.name (slug) — call_skill resolves by Skill.name (subprocess gets DB +
                                                  # app imports because it starts with "Genzoic")
            operation: send
            args:
              to: "uzairtajmat7@gmail.com"
              subject: "Complaint root-cause triage — product vs operational"
              title: "Customer Complaint Root-Cause Triage"
              intro: >-
                The complaint sweep traced each complaint through its order (ORDER_ID ->
                ONLINE_ORDER_ID) to the products in that order, then to the store's inventory
                for those products on the order date and the SKU's shelf-life threshold. The
                confirmed complaints (reviewed store by store) are below, classified OPERATIONS
                vs PRODUCT with near-expiry stock flagged as the likely cause where it fits,
                followed by the untraced store reviews. Please action the flagged
                product-quality issues.
              sections:
                - type: table
                  caption: "Confirmed complaints — traced, OPERATIONS vs PRODUCT"
                  columns: [Store_name, Product_name, Complaint_date, Issue_type, Category, Complaint, Order_date, inventory_that_day, earliest_expiry_that_day, min_days_shelf_life]
                  records: "{{complaints_confirmed}}"
                - type: table
                  caption: "Store reviews (untraced) — ratings & themes"
                  columns: [Store_name, Rating, rating_band, Review, Review_date, Customer]
                  records: "{{store_reviews}}"
              footer_note: "Generated automatically by the Customer Complaint Root-Cause Triage process."

    # What to remember across runs (aspirational — not yet consumed at runtime).
    learning: |
      Persist, per store x product, recurring PRODUCT complaints explained by
      near-expiry stock — a repeat pattern points at a batch / cold-chain problem.

    related_kpis: [AvgStoreRating]   # must exist in master_data/kpis.yaml (unknown = fatal at apply)

    related_signals_events: [QA_PublicComplaintTrend, QA_CategoryQualityIssue, QA_ConsumerComplaintsAboveThreshold, QA_ProductReturnsAboveThreshold]   # reverse of master_data/signals_events.yaml related_processes for customer_review_aggregation_and_triage

    metadata:
      version: 4
      effective_from: 2026-07-24
      priority: 15
      requires_human_approval: true
      # NO steps_display_only -> process.steps run (stepped/foreach path, like demand_forecast).

      # Scope the agent's ToolBelt — graph + the context_package facts only, no
      # external skills (the classification is the agent's own reasoning, not a skill).
      tools:
        skills: []

      context_package:
        # =================================================================
        # 1) The traced complaints table. One row per (complaint x product in
        #    its order), carrying that product's inventory ON the order date and
        #    the SKU's shelf-life threshold. Assembled in one gather block:
        #      collect complaints + sales + inventory (each STARTS at the Store
        #      node and follows the link it declares) -> match complaint.ORDER_ID
        #      to sale.ONLINE_ORDER_ID -> match (store, SKU, order date) to that
        #      day's inventory (pre-rolled to one row per store/SKU/day) -> walk
        #      stock_config_for to bring min_days_shelf_life.
        #    Scoped to one store on an entity/manual run; all stores on the sweep.
        # =================================================================
        - key: complaint_root_cause
          required: false
          gather:
            collect:
              # -- complaints for the recent window, per store -----------------
              - as: complaints
                entity: Store
                dataset: CUSTOMER_COMPLAINT_EVENTS   # Store->Complaints link (join MASTER_STORE_ID)
                columns: [EVENT_ID, MASTER_STORE_ID, ISSUE_TYPE, ITEM_NAME, CUSTOMER_COMMENTS, ORDER_ID, COMPLAINT_RECEIVED_AT]
                order_by: COMPLAINT_RECEIVED_AT
                order_dir: desc
                limit: 2000
                reduce:
                  rename: { ORDER_ID: online_order_id }
                  # rolling window: last 7 days. Tighten to -1 for yesterday-only,
                  # or widen if the demo data is older than a week.
                  compute:
                    - { as: _days_out, days_until: COMPLAINT_RECEIVED_AT }
                  where:
                    - { field: _days_out, op: gte, value: -7 }
                  drop: [_days_out]

              # -- sales lines, per store: the "which products were in the order" -
              #    source. `ONLINE_ORDER_ID` is the aggregator order id that matches
              #    the complaint's ORDER_ID; the internal ORDER_ID is not selected.
              - as: sales
                entity: Store
                dataset: silver.BUSINESS_ANALYTICS   # Store->Sales link (join STORE_ID); silver-qualified so the read hits silver, not bronze
                columns: [ONLINE_ORDER_ID, STORE_ID, SKU_ID, ITEM_SOURCE_NAME, QUANTITY, ORDER_DATE, ORDER_STATE]
                order_by: ORDER_DATE
                order_dir: desc
                limit: 5000                          # ceiling; the window below does the real trimming
                reduce:
                  rename: { ONLINE_ORDER_ID: online_order_id }
                  # Don't pull all history — keep only recent orders (the slice the
                  # last-7-days complaints were placed in). 14 days, NOT 7: an order
                  # is PLACED before its complaint is RECEIVED, so widen past the
                  # complaint window to be sure the traced order is present.
                  compute:
                    - { as: _days_out, days_until: ORDER_DATE }
                  where:
                    - { field: _days_out, op: gte, value: -14 }
                  drop: [_days_out]

              # -- inventory, per store, PRE-ROLLED to one row per (store, SKU, day) -
              #    so the join to sales is 1:1 (no batch fan-out downstream).
              #    snapshot_date -> ORDER_DATE makes the join pick the snapshot ON
              #    the order date. earliest_expiry_that_day (min expiry across that
              #    day's sellable batches) = the batch assumed to have been used.
              - as: inventory
                entity: Store
                dataset: STORE_INVENTORY_DAILY       # Store->Inventory batches link (join store_id)
                columns: [store_id, product_sku, available_quantity, expiry_date, snapshot_date, batch_row_number]
                order_by: snapshot_date
                order_dir: desc
                limit: 5000                          # ceiling; the window below does the real trimming
                reduce:
                  rename: { store_id: STORE_ID, product_sku: SKU_ID, snapshot_date: ORDER_DATE }
                  rollup:
                    group_by: [STORE_ID, SKU_ID, ORDER_DATE]
                    filter_rows:
                      # only recent snapshots (same 14-day window as sales) and
                      # sellable batches — no point rolling up dates no order hits.
                      compute:
                        - { as: _days_out, days_until: ORDER_DATE }
                      where:
                        - { field: available_quantity, op: gt, value: 0 }   # sellable batches only
                        - { field: _days_out, op: gte, value: -14 }         # recent snapshots only
                    agg:
                      - { as: earliest_expiry_that_day, op: min,   col: expiry_date }
                      - { as: inventory_that_day,       op: sum,   col: available_quantity }
                      - { as: batches_that_day,         op: count, col: batch_row_number }
            join:
              # complaint -> its order's product lines (keep untraced complaints).
              - { left: complaints, right: sales, "on": [online_order_id], how: left }
              # that product's inventory AT this store ON the order date.
              - { right: inventory, "on": [STORE_ID, SKU_ID, ORDER_DATE], how: left }
            links:
              # bring the (SKU, store) configured shelf-life threshold used to
              # decide "near expiry" (Product --stock_config_for--> Store edge).
              - from: SKU_ID
                from_type: Product
                via: stock_config_for
                direction: out
                match: STORE_ID
                bring: [min_days_shelf_life]
          post:
            # Business-friendly column names for the shown/emailed table.
            rename:
              COMPLAINT_RECEIVED_AT: Complaint_date
              CUSTOMER_COMMENTS:     Complaint
              ISSUE_TYPE:            Issue_type
              ITEM_NAME:             Complaint_item
              ITEM_SOURCE_NAME:      Order_item
              ORDER_DATE:            Order_date
            # First-pass OPERATIONS vs PRODUCT tag from the structured Issue_type,
            # shown as a column in the decision table. This is the deterministic
            # signal; the AI recommender still makes the final, text-aware call
            # (reads Complaint + Complaint_item) in its triage. `contains` is a
            # case-sensitive substring match, so match the Issue_type label tokens.
            compute:
              - as: Category
                bucket:
                  - { when: { field: Issue_type, op: contains, value: "Wrong" },   value: OPERATIONS }
                  - { when: { field: Issue_type, op: contains, value: "Missing" }, value: OPERATIONS }
                  - { when: { field: Issue_type, op: contains, value: "Late" },    value: OPERATIONS }
                  - { when: { field: Issue_type, op: contains, value: "Deliver" }, value: OPERATIONS }
                  - { when: { field: Issue_type, op: contains, value: "Packag" },  value: OPERATIONS }
                  - { when: { field: Issue_type, op: contains, value: "Quality" }, value: PRODUCT }
                  - { when: { field: Issue_type, op: contains, value: "Taste" },   value: PRODUCT }
                  - { when: { field: Issue_type, op: contains, value: "Fresh" },   value: PRODUCT }
                  - { when: { field: Issue_type, op: contains, value: "Expir" },   value: PRODUCT }
                  - { else: "Review" }
            # drop the plumbing columns (keep MASTER_STORE_ID + SKU_ID for resolve).
            drop: [EVENT_ID, online_order_id, STORE_ID, QUANTITY, ORDER_STATE, batches_that_day]
            sort_by: Complaint_date
            resolve:
              - { field: MASTER_STORE_ID, type: Store,   as: Store_name }
              - { field: SKU_ID,          type: Product, as: Product_name }

        # =================================================================
        # 2) Reviews per store (NOT traced — no order id). Raw reviews + a
        #    low-rating band; the recommender computes the average and themes.
        # =================================================================
        - key: store_reviews
          required: false
          gather:
            base:
              entity: Store
              dataset: CUSTOMER_REVIEW_EVENTS        # Store->Reviews link (join MASTER_STORE_ID)
              columns: [REVIEW_ID, MASTER_STORE_ID, STAR_RATING, REVIEW_TEXT, REVIEW_DATE, CUSTOMER_NAME]
              order_by: REVIEW_DATE
              order_dir: desc
              limit: 2000
          post:
            rename: { STAR_RATING: Rating, REVIEW_TEXT: Review, REVIEW_DATE: Review_date, CUSTOMER_NAME: Customer }
            compute:
              - { as: _days_out, days_until: Review_date }
              - as: rating_band
                bucket:
                  - { when: { field: Rating, op: lte, value: 3 }, value: low }
                  - { else: ok }
            where:
              # rolling window: last 30 days (reviews are sparser than complaints).
              - { field: _days_out, op: gte, value: -30 }
            drop: [_days_out, REVIEW_ID]
            sort_by: Review_date
            resolve:
              - { field: MASTER_STORE_ID, type: Store, as: Store_name }

        - { key: scheduled_at, source: event, required: false }

      # "Data used" cards for the decision gate (KeyData carousel). `from` matches
      # the context_package keys; table view only (UI: table / markdown / image).
      key_data:
        - title: "Complaint root-cause (traced)"
          summary: "Each complaint x product in its order, with that day's inventory & shelf-life threshold"
          views:
            - { view: table, from: complaint_root_cause, columns: [Store_name, Product_name, Complaint_date, Issue_type, Category, Complaint, Order_date, inventory_that_day, earliest_expiry_that_day, min_days_shelf_life] }
        - title: "Store reviews (untraced)"
          summary: "Recent customer reviews per store with a low-rating flag"
          views:
            - { view: table, from: store_reviews, columns: [Store_name, Rating, rating_band, Review, Review_date, Customer] }

      # NOTE: policy_rules is documentation only — the EventAgent reads `description`
      # (the TASK), not this block; the key guidance is folded into description above.
      policy_rules:
        - "COMPLAINTS: each row of `complaint_root_cause` is ONE complaint x ONE product that was in its order, already traced by the system (complaint ORDER_ID -> sale ONLINE_ORDER_ID -> the order's products -> that product's inventory ON the order date). Columns: `Store_name`, `Product_name` (a product in the order), `Complaint_date`, `Complaint` (customer text), `Issue_type`, `Complaint_item` (what the customer named), `Order_item`, `Order_date`, `inventory_that_day` (qty of that product available at the store on the order date), `earliest_expiry_that_day` (expiry of the earliest-expiring batch available that day = the batch assumed used), and `min_days_shelf_life` (that SKU's configured near-expiry threshold). A null `Product_name`/`Order_date` means the order was NOT found in sales (can't trace products); a null `earliest_expiry_that_day` means no inventory snapshot existed for that product on the order date."
        - "CLASSIFY every complaint into EXACTLY ONE Category: OPERATIONS (delivery, packaging/spillage, wrong or missing items, service, timing) or PRODUCT (food quality, freshness/expiry, taste, ingredients, preparation, hygiene, appearance). Judge from `Complaint_item` + `Issue_type` + `Complaint`. If both are present use the PRIMARY concern; default food-related text to PRODUCT. One complaint may appear on several rows (one per product in its order) — treat it as a single complaint and focus the freshness check on the row whose `Order_item`/`Product_name` best matches `Complaint_item`."
        - "ROOT CAUSE — PRODUCT complaints only: compute the stock's remaining life at the order date = (`earliest_expiry_that_day` - `Order_date`) in days, and compare to `min_days_shelf_life` (if `min_days_shelf_life` is null, treat 2 days as the near-expiry threshold). If remaining life <= threshold (or negative = already expired when sold), set `near_expiry_inventory_that_day` = YES and call this the LIKELY ROOT CAUSE — e.g. 'complaint says not fresh; the batch available on {Order_date} expired {earliest_expiry_that_day} (~{n} day(s) of life left vs {min_days_shelf_life}-day threshold) -> near-expiry stock is the probable cause'. Otherwise set `near_expiry_inventory_that_day` = NO and leave it as a plain product-quality issue not explained by expiry. If there is no traced product / no inventory, say so (cannot assess)."
        - "OPERATIONS complaints: do NOT look at inventory — leave them as operational issues; set `near_expiry_inventory_that_day` = N/A."
        - "PRESENT the triage as a table with these columns: Store_name, Product_name, Complaint_date, Complaint, Category, inventory_that_day, near_expiry_inventory_that_day."
        - "REVIEWS: `store_reviews` is per-store customer reviews (NOT traced to orders). For each store report the AVERAGE `Rating` and the review count, list/summarise the low-rated reviews (`rating_band` = low), and extract the recurring themes split PRODUCT (taste, freshness, quality) vs OPERATIONS (delivery, packaging, service). Cross-check: call out stores that have BOTH product-quality complaints AND low review ratings / product-themed reviews (a corroborated quality problem), and note stores whose complaints are operational but whose reviews are fine."
        - "Write a SHORT decision summary in plain business language: total complaints triaged, the OPERATIONS vs PRODUCT split, how many PRODUCT complaints were explained by near-expiry stock (with standout Store x Product x Order_date examples), and the review picture (average ratings, notable low-rated stores/themes). Do NOT paste the raw tables verbatim."
        - "At the OVERVIEW gate recommend APPROVE to action the triage store by store, then a per-store loop confirms each store's complaints and the confirmed set is emailed (root-cause triage + store reviews) to the production & marketing owners. If both `complaint_root_cause` and `store_reviews` are empty, recommend REJECT (no action)."

      # NOTE: the email is now a STEP action on `email_triage` (Genzoic Email Formatter,
      # via the org SendGrid connector) — not a decision-keyed `actions:` block. Stepped
      # /foreach runs fire step actions inline, so there is no process-level `actions:`.
